<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Ventas - Tablero Interactivo</title>
  
  <link rel="icon" href="https://raw.githubusercontent.com/jarodlopez/Ventas-MM/refs/heads/main/MM-Logo-N.png" type="image/png" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    .pipeline-scroll { scroll-snap-type: x mandatory; }
    .pipeline-col { scroll-snap-align: start; min-height: 60vh; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass-modal { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .dragging { opacity: 0.5; transform: scale(0.98); }
    .drag-over { background-color: rgba(203, 213, 225, 0.8) !important; border: 2px dashed #94a3b8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen flex flex-col overflow-hidden">
  
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAAETou6DhYIJJ8cxI13BU1p_l3yGPMilA",
      authDomain: "ventas-ebd49.firebaseapp.com",
      projectId: "ventas-ebd49",
      storageBucket: "ventas-ebd49.firebasestorage.app",
      messagingSenderId: "907042495792",
      appId: "1:907042495792:web:6827da0b73333496f6bcf5"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const PIPELINE_STATUSES = ["Con oferta", "Acepta oferta", "Long track", "Dispersado", "Rechazado", "Cancelado", "Expirado"];
    
    const LOST_REASONS = [
      "No contesta / Inlocalizable",
      "Oferta expirada",
      "Tasa/Condiciones no favorables",
      "Se fue con la competencia",
      "No cumple requisitos / Buro",
      "Cliente se arrepintió",
      "Otro motivo"
    ];

    const parseDate = (input) => {
      if (!input) return new Date();
      if (input.toDate) return input.toDate();
      const d = new Date(input);
      return isNaN(d) ? new Date() : d; // FIX: Prevención de NaN si la fecha es inválida
    };

    const money = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val || 0);
    const moneyUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val || 0);
    const formatDate = (input) => new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', hour:'2-digit', minute:'2-digit' }).format(parseDate(input));

    const getQuincena = (date) => date.getDate() <= 15 ? 1 : 2;

    const getBusinessDaysQuincena = (targetDate, quincena) => {
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();
      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      const startDay = quincena === 1 ? 1 : 16;
      const endDay = quincena === 1 ? 15 : lastDayOfMonth;
      let totalBusinessDays = 0, remainingDays = 0;
      
      // FIX: Precisión en el cálculo de días restantes
      const today = new Date();
      today.setHours(0,0,0,0);

      for (let d = startDay; d <= endDay; d++) {
        const dateCheck = new Date(year, month, d);
        if (dateCheck.getDay() !== 0 && dateCheck.getDay() !== 6) { 
          totalBusinessDays++;
          if (dateCheck >= today) remainingDays++;
        }
      }
      return { totalBusinessDays, remainingDays, startDay, endDay };
    };

    const Login = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [error, setError] = useState('');

      const handleGoogleLogin = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => setError("Error con Google: " + err.message));
      };

      const handleEmailAuth = (e) => {
        e.preventDefault();
        setError('');
        if (isRegistering) {
          auth.createUserWithEmailAndPassword(email, password)
            .catch(err => setError(err.code === 'auth/email-already-in-use' ? 'El correo ya está registrado.' : err.message));
        } else {
          auth.signInWithEmailAndPassword(email, password)
            .catch(err => setError(err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' ? 'Datos incorrectos.' : err.message));
        }
      };

      return (
        <div className="flex-1 flex flex-col items-center justify-center bg-slate-900 text-slate-900 p-4">
          <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm flex flex-col items-center">
            <i className="fas fa-chart-line text-5xl text-blue-600 mb-4"></i>
            <h1 className="text-2xl font-black mb-1">CRM Ventas</h1>
            <p className="text-sm text-slate-500 mb-6">{isRegistering ? 'Crear cuenta' : 'Ingreso Agentes'}</p>

            {error && <div className="w-full bg-red-100 text-red-600 p-2 rounded text-xs font-bold text-center mb-4">{error}</div>}

            <form onSubmit={handleEmailAuth} className="w-full flex flex-col gap-3 mb-6">
              <input type="email" placeholder="Correo" required value={email} onChange={e => setEmail(e.target.value)} className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
              <input type="password" placeholder="Contraseña" required value={password} onChange={e => setPassword(e.target.value)} className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
              <button type="submit" className="w-full bg-blue-600 text-white font-bold p-2 rounded hover:bg-blue-700 mt-1">{isRegistering ? 'Registrarse' : 'Iniciar Sesión'}</button>
            </form>

            <div className="w-full flex items-center gap-2 mb-6"><div className="h-px bg-slate-200 flex-1"></div><span className="text-xs text-slate-400 font-bold uppercase">O entra con</span><div className="h-px bg-slate-200 flex-1"></div></div>

            <button onClick={handleGoogleLogin} className="w-full bg-slate-50 border border-slate-200 text-slate-700 p-2 rounded font-bold hover:bg-slate-100 flex items-center justify-center gap-2">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" className="w-5 h-5" /> Google
            </button>

            <button onClick={() => { setIsRegistering(!isRegistering); setError(''); }} className="mt-6 text-sm text-blue-600 hover:underline">{isRegistering ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}</button>
          </div>
        </div>
      );
    };

    const PlanningModal = ({ isOpen, onClose, metaData, setMetaData, businessData, year, month, quincena }) => {
      const [localMeta, setLocalMeta] = useState(metaData);
      
      useEffect(() => { setLocalMeta(metaData); }, [metaData, isOpen]);

      const handleSaveMeta = (e) => { 
        e.preventDefault();
        setMetaData(localMeta); 
        onClose();
      };

      const handleChange = (e) => {
        setLocalMeta({...localMeta, [e.target.name]: Number(e.target.value)});
      };

      if (!isOpen) return null;

      const dailyGoal = businessData.totalBusinessDays > 0 ? localMeta.monto / businessData.totalBusinessDays : 0;
      const projection = [];
      let accum = 0;
      const today = new Date().getDate();
      const isCurrentMonth = new Date().getMonth() === month && new Date().getFullYear() === year;

      for(let d = businessData.startDay; d <= businessData.endDay; d++){
         const date = new Date(year, month, d);
         const isWeekend = date.getDay() === 0 || date.getDay() === 6;
         if(!isWeekend) accum += dailyGoal;
         projection.push({ day: d, isWeekend, expected: accum, isToday: isCurrentMonth && d === today });
      }

      return (
        <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
              <h2 className="font-bold text-lg text-blue-900">Planificación y Bonos Q{quincena}</h2>
              <button onClick={onClose}><i className="fas fa-times text-slate-400 hover:text-red-500"></i></button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-4 flex flex-col md:flex-row gap-6">
              
              <div className="flex-1 flex flex-col gap-4">
                  <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 shadow-sm">
                      <h3 className="font-bold text-blue-800 text-sm mb-3"><i className="fas fa-bullseye mr-2"></i>Objetivo Base</h3>
                      <div className="flex gap-4">
                          <div className="flex-1">
                              <label className="text-xs font-bold text-blue-700 mb-1 block">Meta al 100% (MXN)</label>
                              <input type="number" name="monto" value={localMeta.monto} onChange={handleChange} className="w-full border border-blue-200 rounded p-2 font-bold focus:outline-none focus:border-blue-500" />
                          </div>
                          <div className="w-1/3">
                              <label className="text-xs font-bold text-blue-700 mb-1 block">T. de Cambio</label>
                              <input type="number" step="0.01" name="tipoCambio" value={localMeta.tipoCambio} onChange={handleChange} className="w-full border border-blue-200 rounded p-2 text-center focus:outline-none focus:border-blue-500" />
                          </div>
                      </div>
                  </div>

                  <div className="bg-green-50 p-4 rounded-lg border border-green-100 shadow-sm">
                      <h3 className="font-bold text-green-800 text-sm mb-3"><i className="fas fa-money-bill-wave mr-2"></i>Esquema de Pago ($ USD)</h3>
                      <div className="grid grid-cols-2 gap-3">
                          <div><label className="text-[10px] font-bold text-green-700 uppercase">Pago al 80%</label><input type="number" name="bono80" value={localMeta.bono80} onChange={handleChange} className="w-full border border-green-200 rounded px-2 py-1 focus:outline-none focus:border-green-500 text-sm" /></div>
                          <div><label className="text-[10px] font-bold text-green-700 uppercase">Pago al 100%</label><input type="number" name="bono100" value={localMeta.bono100} onChange={handleChange} className="w-full border border-green-200 rounded px-2 py-1 focus:outline-none focus:border-green-500 font-bold text-sm" /></div>
                          <div><label className="text-[10px] font-bold text-green-700 uppercase">Pago al 120%</label><input type="number" name="bono120" value={localMeta.bono120} onChange={handleChange} className="w-full border border-green-200 rounded px-2 py-1 focus:outline-none focus:border-green-500 text-sm" /></div>
                          <div><label className="text-[10px] font-bold text-green-700 uppercase">Pago al 140%</label><input type="number" name="bono140" value={localMeta.bono140} onChange={handleChange} className="w-full border border-green-200 rounded px-2 py-1 focus:outline-none focus:border-green-500 text-sm" /></div>
                      </div>
                  </div>
              </div>

              <div className="flex-1 bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden flex flex-col h-64 md:h-auto">
                 <div className="p-2 bg-slate-100 border-b font-bold text-xs text-slate-600 text-center uppercase tracking-wider">Proyección de Venta Diaria</div>
                 <div className="overflow-y-auto flex-1">
                  <table className="w-full text-sm">
                    <thead><tr className="text-left text-[10px] uppercase text-slate-400 bg-slate-50"><th className="p-2 pl-4">Día</th><th className="p-2 text-right pr-4">Acumulado Ideal</th></tr></thead>
                    <tbody>
                      {projection.map(row => (
                        <tr key={row.day} className={`border-b border-slate-100 ${row.isWeekend ? 'bg-slate-50 text-slate-400' : ''} ${row.isToday ? 'bg-blue-50 font-bold' : ''}`}>
                          <td className="p-2 pl-4 flex items-center gap-2">{row.day} {row.isWeekend && '(Fin)'} {row.isToday && <span className="text-[9px] bg-blue-500 text-white px-1 rounded shadow-sm">HOY</span>}</td>
                          <td className="p-2 text-right pr-4 font-mono text-xs">{row.isWeekend ? '-' : money(row.expected)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                 </div>
              </div>
            </div>

            <div className="p-4 bg-slate-50 border-t flex justify-end gap-2">
                <button onClick={onClose} className="px-4 py-2 bg-slate-200 font-bold rounded hover:bg-slate-300">Cancelar</button>
                <button onClick={handleSaveMeta} className="px-6 py-2 bg-blue-600 text-white font-bold rounded shadow-lg hover:bg-blue-700">Guardar Plan</button>
            </div>
          </div>
        </div>
      );
    };

    const MetricsHeader = ({ sales, metaData, businessData, onOpenPlanning }) => {
      const sold = sales.filter(s => s.estatus === 'Dispersado').reduce((acc, curr) => acc + (Number(curr.monto_dispersado) || 0), 0);
      const hotMoney = sales.filter(s => s.estatus === 'Acepta oferta' || s.estatus === 'Long track').reduce((acc, curr) => acc + (Number(curr.monto_preaprobado) || 0), 0);
      
      const tc = metaData.tipoCambio || 1;
      const meta = Number(metaData.monto) || 0;
      
      const percent = meta > 0 ? (sold / meta) * 100 : 0;

      // Cálculo del bono en vivo y cuánto falta para el SIGUIENTE escalón
      let currentBonus = 0;
      let nextBonusLvl = "";
      let nextPercent = 0;
      let missingForNext = 0;

      if (percent >= 140) { 
          currentBonus = Number(metaData.bono140) || 0; 
          nextBonusLvl = "MAX"; 
      }
      else if (percent >= 120) { 
          currentBonus = Number(metaData.bono120) || 0; 
          nextBonusLvl = "140%"; 
          nextPercent = 140;
          missingForNext = (meta * 1.4) - sold;
      }
      else if (percent >= 100) { 
          currentBonus = Number(metaData.bono100) || 0; 
          nextBonusLvl = "120%"; 
          nextPercent = 120;
          missingForNext = (meta * 1.2) - sold;
      }
      else if (percent >= 80) { 
          currentBonus = Number(metaData.bono80) || 0; 
          nextBonusLvl = "100%"; 
          nextPercent = 100;
          missingForNext = meta - sold;
      }
      else { 
          nextBonusLvl = "80%"; 
          nextPercent = 80;
          missingForNext = (meta * 0.8) - sold;
      }

      // CONFIGURACIÓN DE LA BARRA VISUAL HASTA EL 150%
      const maxVisualScale = 150; 
      const fillVisualWidth = Math.min((percent / maxVisualScale) * 100, 100);

      return (
        <div className="bg-white p-3 shadow-sm border-b flex flex-wrap gap-4 md:gap-6 items-center justify-between">
          <div className="flex flex-wrap gap-4 md:gap-6 items-center flex-1 w-full lg:w-auto">
             
             {/* REAL DISPERSADO */}
             <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">Real Dispersado</p>
                <p className="text-2xl font-black text-slate-800 leading-none">{money(sold)}</p>
                <p className="text-[10px] text-green-600 font-bold mt-1 tracking-wide">{moneyUSD(sold / tc)} USD</p>
             </div>
             <div className="hidden sm:block w-px h-10 bg-slate-200"></div>
             
             {/* META 100% */}
             <div>
                <p className="text-[10px] font-bold text-slate-400 uppercase">Meta (100%)</p>
                <p className="text-xl font-bold text-slate-700 leading-none">{money(meta)}</p>
                <p className="text-[10px] text-slate-400 font-bold mt-1 tracking-wide">{moneyUSD(meta / tc)} USD</p>
             </div>
             <div className="hidden md:block w-px h-10 bg-slate-200"></div>

             {/* BARRA DE TERMÓMETRO CON CHECKPOINTS (TRACKING DE PORCENTAJES) */}
             <div className="flex-1 min-w-[220px] max-w-lg mt-2 mb-1">
                 <div className="flex justify-between items-end mb-1">
                     <p className="text-[10px] font-bold text-slate-400 uppercase">Progreso Total</p>
                     <p className={`text-sm font-black ${percent >= 100 ? 'text-green-600' : 'text-blue-600'}`}>{percent.toFixed(1)}%</p>
                 </div>
                 
                 <div className="relative w-full bg-slate-200 rounded-full h-3.5 mb-5 mt-1">
                    {/* El color de la barra cambia según el nivel alcanzado */}
                    <div 
                      className={`absolute top-0 left-0 h-full rounded-full transition-all duration-1000 shadow-inner ${percent >= 140 ? 'bg-purple-500' : percent >= 120 ? 'bg-indigo-500' : percent >= 100 ? 'bg-green-500' : percent >= 80 ? 'bg-blue-500' : 'bg-orange-400'}`} 
                      style={{ width: `${fillVisualWidth}%` }}
                    ></div>
                    
                    {/* Ticks/Marcadores del 80%, 100%, 120% y 140% con tooltips de faltante */}
                    {[80, 100, 120, 140].map(mark => {
                        const montoDeEstaMarca = meta * (mark / 100);
                        const faltaParaEstaMarca = montoDeEstaMarca - sold;
                        const tooltipText = faltaParaEstaMarca > 0 
                            ? `Te faltan ${money(faltaParaEstaMarca)} para llegar al ${mark}%` 
                            : `¡Ya pasaste la marca del ${mark}%!`;

                        return (
                            <div key={mark} className="absolute top-0 bottom-0 border-l-2 border-white/60 z-10 group cursor-help" style={{ left: `${(mark / maxVisualScale) * 100}%` }} title={tooltipText}>
                                <span className={`absolute top-4 -translate-x-1/2 text-[9px] font-bold whitespace-nowrap ${percent >= mark ? 'text-slate-800' : 'text-slate-400 group-hover:text-blue-600'}`}>
                                    {mark}%
                                </span>
                            </div>
                        )
                    })}
                 </div>
                 
                 {/* TRACKING INFERIOR DINÁMICO (Próxima Meta) */}
                 <div className="-mt-1">
                     {nextPercent > 0 ? (
                         <p className="text-[10px] text-slate-500 font-medium">
                             🎯 Faltan <span className="font-bold text-slate-700">{money(missingForNext)}</span> para llegar al {nextPercent}%
                         </p>
                     ) : (
                         <p className="text-[10px] text-purple-600 font-bold">
                             🚀 ¡Has alcanzado el tope máximo (140%)!
                         </p>
                     )}
                 </div>
             </div>
             <div className="hidden lg:block w-px h-10 bg-slate-200"></div>

             {/* CALIENTE */}
             <div className="hidden sm:block">
                <p className="text-[10px] font-bold text-purple-500 uppercase flex items-center gap-1"><i className="fas fa-fire"></i> Caliente</p>
                <p className="text-xl font-bold text-purple-700 leading-none">{money(hotMoney)}</p>
                <p className="text-[10px] text-purple-500 font-bold mt-1 tracking-wide">{moneyUSD(hotMoney / tc)} USD</p>
             </div>
             <div className="hidden xl:block w-px h-10 bg-slate-200"></div>

             {/* BONO EN VIVO */}
             <div className="bg-green-50 border border-green-200 rounded-lg px-3 py-1 flex items-center gap-2">
                 <div className="bg-green-100 p-1.5 rounded-full"><i className="fas fa-sack-dollar text-green-600 text-sm"></i></div>
                 <div>
                     <p className="text-[9px] font-bold text-green-700 uppercase">Bono Liberado</p>
                     <p className="text-lg font-black text-green-600 leading-none">{moneyUSD(currentBonus)}</p>
                 </div>
                 <div className="text-[9px] font-bold text-green-500 ml-1 hidden xl:block border-l border-green-200 pl-2">
                     Siguiente: {nextBonusLvl}
                 </div>
             </div>
             
             <div className="hidden xl:block w-px h-10 bg-slate-200"></div>

             {/* DÍAS RESTANTES */}
             <div className="hidden lg:block">
                <p className="text-[10px] font-bold text-slate-400 uppercase"><i className="far fa-clock mr-1"></i>Restante</p>
                <p className="text-lg font-bold text-slate-700 leading-none">{businessData.remainingDays} días</p>
             </div>

          </div>
          
          <button onClick={onOpenPlanning} className="bg-slate-800 text-white px-4 py-2 rounded text-xs font-bold hover:bg-slate-700 shadow-lg whitespace-nowrap mt-2 sm:mt-0">
            <i className="fas fa-cogs mr-2"></i>Ajustar Plan
          </button>
        </div>
      );
    };

    const SaleCard = ({ sale, updateSale, deleteSale, onStatusChange, onEdit }) => {
      const [showDeleteModal, setShowDeleteModal] = useState(false);
      const [pin, setPin] = useState('');
      const [showHistory, setShowHistory] = useState(false);
      const [comment, setComment] = useState('');
      const [isDraggable, setIsDraggable] = useState(false);

      const addComment = (e) => {
        e.preventDefault();
        if(!comment.trim()) return;
        updateSale(sale.id, { history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `Nota: ${comment}`, user: 'Agente' }) });
        setComment('');
      };

      const handleDragStart = (e) => {
        e.dataTransfer.setData('saleId', sale.id);
        setTimeout(() => e.target.classList.add('dragging'), 0);
      };
      
      const handleDragEnd = (e) => {
        e.target.classList.remove('dragging');
        setIsDraggable(false); 
      };

      const getBorderColor = () => {
        if(sale.estatus === 'Dispersado') return 'bg-green-500';
        if(sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') return 'bg-red-500';
        return 'bg-blue-500';
      }

      // LÓGICA NIVEL DIOS: ALERTA DE CONGELAMIENTO (LEADS FRÍOS)
      // Compara la última vez que se le movió algo al lead (historial) vs hoy. Si pasaron 3 días o más y está en proceso = ¡Alerta de frío!
      const lastUpdate = sale.history && sale.history.length > 0
            ? new Date(sale.history[sale.history.length - 1].date)
            : parseDate(sale.fecha);
      
      const today = new Date();
      // Reseteamos las horas a medianoche para que calcule los días exactos sin importar la hora del día
      const msPerDay = 1000 * 60 * 60 * 24;
      const daysStale = Math.floor((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - new Date(lastUpdate.getFullYear(), lastUpdate.getMonth(), lastUpdate.getDate())) / msPerDay);
      
      const isStale = ['Con oferta', 'Acepta oferta'].includes(sale.estatus) && daysStale >= 3;

      return (
        <div 
          draggable={isDraggable}
          onDragStart={handleDragStart}
          onDragEnd={handleDragEnd}
          className={`bg-white p-3 rounded-lg shadow-sm border border-slate-200 mb-2 relative group hover:shadow-md transition-all ${isDraggable ? 'cursor-grab' : ''}`}
        >
          <div className={`absolute left-0 top-0 bottom-0 w-1 rounded-l-lg ${getBorderColor()}`}></div>
          <div className="pl-2">
            
            <div className="flex justify-between items-start">
              <div className="flex items-center gap-2 flex-wrap">
                <div 
                  onMouseEnter={() => setIsDraggable(true)}
                  onMouseLeave={() => setIsDraggable(false)}
                  className="text-slate-300 hover:text-blue-500 cursor-grab px-1"
                  title="Arrastrar tarjeta"
                >
                  <i className="fas fa-grip-vertical text-sm"></i>
                </div>
                <span className="text-xs font-bold text-slate-700 font-mono select-text">{sale.folio}</span>
                
                {sale.isCarryOver && (
                  <span className="bg-orange-100 text-orange-700 text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm border border-orange-200 flex items-center gap-1" title="Este lead viene de un periodo anterior">
                    <i className="fas fa-history text-[8px]"></i> CARRY
                  </span>
                )}
                
                {sale.canal === 'UPPER' && (
                  <span className="bg-indigo-100 text-indigo-700 text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm border border-indigo-200 flex items-center gap-1" title="Lead de campañas UPPER">
                    <i className="fas fa-bolt text-[8px]"></i> UPPER
                  </span>
                )}

                {/* ETIQUETA NIVEL DIOS: ALERTA DE HIELO */}
                {isStale && (
                  <span className="bg-cyan-50 text-cyan-600 text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm border border-cyan-200 flex items-center gap-1 animate-pulse" title={`Lleva ${daysStale} días sin movimiento. ¡Llámale!`}>
                    <i className="fas fa-snowflake text-[8px]"></i> {daysStale} DÍAS FRÍO
                  </span>
                )}

              </div>
              <div className="flex">
                <button onClick={() => onEdit(sale)} className="text-slate-300 hover:text-blue-500 px-2" title="Editar"><i className="fas fa-pencil-alt text-xs"></i></button>
                <button onClick={() => setShowDeleteModal(true)} className="text-slate-300 hover:text-red-500 px-2" title="Eliminar"><i className="fas fa-trash-alt text-xs"></i></button>
              </div>
            </div>
            
            <h3 className="font-bold text-sm text-slate-800 truncate mt-1 select-text">{sale.nombre_cliente}</h3>
            
            <div className="flex justify-between items-end mt-2 bg-slate-50 p-2 rounded border border-slate-100">
               <div className="flex flex-col gap-1">
                  {sale.monto_original ? (
                     <>
                        <div>
                          <span className="text-[9px] text-slate-400 uppercase font-bold block leading-none mb-0.5">Línea Preaprobada</span>
                          <span className={`font-medium text-[10px] ${sale.monto_original !== sale.monto_preaprobado ? 'text-slate-400 line-through' : 'text-slate-600'}`}>
                            {money(sale.monto_original)}
                          </span>
                        </div>
                        <div>
                          <span className="text-[9px] text-blue-500 uppercase font-bold block leading-none mb-0.5">Oferta Aceptada</span>
                          <span className="font-bold text-blue-700 text-xs">{money(sale.monto_preaprobado)}</span>
                        </div>
                     </>
                  ) : (
                     <div>
                       <span className="text-[10px] text-slate-400 uppercase font-bold block leading-none mb-0.5">Preaprobado</span>
                       <span className="font-bold text-slate-600 text-xs">{money(sale.monto_preaprobado)}</span>
                     </div>
                  )}
               </div>
               
               {sale.estatus === 'Dispersado' && (
                 <div className="flex flex-col text-right">
                     <span className="text-[10px] text-green-600 font-bold uppercase block leading-none mb-0.5">Dispersado</span>
                     <span className="font-bold text-green-700 text-sm">{money(sale.monto_dispersado)}</span>
                 </div>
               )}
               
               {(sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') && sale.motivo_perdida && (
                 <div className="flex flex-col text-right">
                     <span className="text-[10px] text-red-500 font-bold uppercase block leading-none mb-0.5">Motivo</span>
                     <span className="font-bold text-red-700 text-[10px] truncate max-w-[90px]" title={sale.motivo_perdida}>{sale.motivo_perdida}</span>
                 </div>
               )}
            </div>
            
            <div className="mt-2 flex flex-wrap gap-1 border-t border-slate-100 pt-2 items-center">
               {sale.telefono && (
                 <span className="px-1.5 py-0.5 rounded bg-slate-50 border border-slate-100 text-slate-500 text-[10px] flex items-center font-medium select-text">
                   <i className="fas fa-phone mr-1"></i> {sale.telefono}
                 </span>
               )}
               {sale.url && <a href={sale.url} target="_blank" className="w-5 h-5 rounded bg-slate-50 flex items-center justify-center text-slate-400 hover:text-blue-600 border border-slate-100" title="Ver en Hubspot"><i className="fas fa-link text-[10px]"></i></a>}
               <button onClick={() => setShowHistory(!showHistory)} className="ml-auto text-[10px] text-blue-500 underline">{showHistory ? 'Ocultar' : 'Bitácora'}</button>
            </div>
            
            {showHistory && (
              <div className="bg-slate-50 p-2 mt-2 rounded text-[10px]">
                 <div className="max-h-24 overflow-y-auto pr-1">
                   {sale.history && sale.history.slice().reverse().map((h, i) => (
                     <div key={i} className="border-b border-slate-200 pb-1 mb-1"><span className="font-bold text-slate-500 block">{formatDate(h.date)}</span><span className="break-words select-text">{h.action}</span></div>
                   ))}
                 </div>
                 <form onSubmit={addComment} className="flex gap-1 mt-2 border-t border-slate-200 pt-2">
                   <input type="text" value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Comentar..." className="flex-1 border border-slate-300 rounded px-1.5 py-1 text-xs outline-none" />
                   <button type="submit" className="bg-blue-600 text-white px-2 rounded"><i className="fas fa-paper-plane"></i></button>
                 </form>
              </div>
            )}
            
            <select value={sale.estatus} onChange={(e) => onStatusChange(sale, e.target.value)} className="mt-2 w-full text-xs bg-slate-50 border border-slate-200 rounded p-1 outline-none focus:border-blue-500 cursor-pointer">
               {PIPELINE_STATUSES.map(s => (<option key={s} value={s}>{s}</option>))}
            </select>
          </div>

          {showDeleteModal && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-5 rounded-lg shadow-xl w-full max-w-sm border-2 border-red-100 cursor-default">
                <h3 className="font-bold text-lg mb-2 text-red-600">Eliminar Registro</h3>
                <input type="password" placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} className="w-full border p-2 rounded mb-2 text-center" />
                <div className="flex gap-2"><button onClick={() => { if(pin === '2398') deleteSale(sale.id); }} className="flex-1 bg-red-600 text-white py-2 rounded font-bold">ELIMINAR</button><button onClick={() => {setShowDeleteModal(false); setPin('');}} className="flex-1 bg-slate-200 py-2 rounded font-bold">Cancelar</button></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = ({ user }) => {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [currentQuincena, setCurrentQuincena] = useState(new Date().getDate() <= 15 ? 1 : 2);
      
      const [allSales, setAllSales] = useState([]);
      const [isPlanningOpen, setIsPlanningOpen] = useState(false);
      
      const [metaData, setMetaData] = useState({ 
          monto: 0, 
          tipoCambio: 18.00, 
          bono80: 0, 
          bono100: 0, 
          bono120: 0, 
          bono140: 0 
      });
      
      const [showForm, setShowForm] = useState(false);
      const [formError, setFormError] = useState(''); 
      const [searchTerm, setSearchTerm] = useState('');

      const [acceptOfferData, setAcceptOfferData] = useState(null); 
      const [realAmount, setRealAmount] = useState('');
      
      const [lostData, setLostData] = useState(null);
      const [lostReason, setLostReason] = useState(LOST_REASONS[0]);
      
      const [editSaleData, setEditSaleData] = useState(null);

      const periodKey = `${user.uid}_${currentDate.getFullYear()}-${currentDate.getMonth()}-${currentQuincena}`;

      useEffect(() => {
        const unsub = db.collection('sales')
          .where('userId', '==', user.uid)
          .onSnapshot(snap => {
             const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
             docs.sort((a, b) => parseDate(b.fecha).getTime() - parseDate(a.fecha).getTime());
             setAllSales(docs);
          });
        return () => unsub();
      }, [user.uid]);

      useEffect(() => {
        const unsub = db.collection('metas').doc(periodKey).onSnapshot(doc => {
            if(doc.exists) {
                const data = doc.data();
                setMetaData({
                    monto: data.monto || 0,
                    tipoCambio: data.tipoCambio || 18.00,
                    bono80: data.bono80 || 0,
                    bono100: data.bono100 || 0,
                    bono120: data.bono120 || 0,
                    bono140: data.bono140 || 0
                });
            } else {
                setMetaData({ monto: 0, tipoCambio: 18.00, bono80: 0, bono100: 0, bono120: 0, bono140: 0 });
            }
        });
        return () => unsub();
      }, [periodKey]);

      const saveMeta = (dataObj) => db.collection('metas').doc(periodKey).set({ ...dataObj, userId: user.uid }, { merge: true });

      const filteredSales = useMemo(() => {
        const viewYear = currentDate.getFullYear();
        const viewMonth = currentDate.getMonth();
        const viewQ = currentQuincena;

        const lastDayOfMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const endDay = viewQ === 1 ? 15 : lastDayOfMonth;
        const viewEnd = new Date(viewYear, viewMonth, endDay, 23, 59, 59);

        let results = allSales.filter(sale => {
          if(!sale.fecha) return false;
          if (sale.estatus === 'Dispersado') {
             const d = parseDate(sale.fecha_dispersion || sale.fecha);
             return d.getFullYear() === viewYear && d.getMonth() === viewMonth && getQuincena(d) === viewQ;
          } 
          else if (sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') {
             const d = parseDate(sale.fecha_resolucion || sale.fecha);
             return d.getFullYear() === viewYear && d.getMonth() === viewMonth && getQuincena(d) === viewQ;
          } 
          else {
             const creationDate = parseDate(sale.fecha);
             return creationDate <= viewEnd;
          }
        }).map(sale => {
             const cDate = parseDate(sale.fecha);
             const cYear = cDate.getFullYear();
             const cMonth = cDate.getMonth();
             const cQ = getQuincena(cDate);
             let isCarry = false;
             if (cYear < viewYear) isCarry = true;
             else if (cYear === viewYear && cMonth < viewMonth) isCarry = true;
             else if (cYear === viewYear && cMonth === viewMonth && cQ < viewQ) isCarry = true;
             return { ...sale, isCarryOver: isCarry };
        });

        if (searchTerm.trim() !== '') {
            const term = searchTerm.toLowerCase();
            results = results.filter(s => 
                (s.folio && s.folio.toLowerCase().includes(term)) || 
                (s.nombre_cliente && s.nombre_cliente.toLowerCase().includes(term))
            );
        }

        return results;

      }, [allSales, currentDate, currentQuincena, searchTerm]);

      const businessData = getBusinessDaysQuincena(currentDate, currentQuincena);

      // --- CÁLCULOS NIVEL DIOS (WIN RATE & RUN RATE) ---
      const wonCount = filteredSales.filter(s => s.estatus === 'Dispersado').length;
      const lostCount = filteredSales.filter(s => ['Rechazado', 'Cancelado', 'Expirado'].includes(s.estatus)).length;
      const winRate = (wonCount + lostCount) > 0 ? ((wonCount / (wonCount + lostCount)) * 100).toFixed(0) : 0;

      const meta = Number(metaData.monto) || 0;
      const soldAmount = filteredSales.filter(s => s.estatus === 'Dispersado').reduce((acc, curr) => acc + (Number(curr.monto_dispersado) || 0), 0);
      const remainingToMeta = Math.max(0, meta - soldAmount);
      
      // Ritmo de venta necesario diario para llegar a la meta
      const requiredDaily = businessData.remainingDays > 0 ? (remainingToMeta / businessData.remainingDays) : remainingToMeta;
      // Ritmo de venta original (lo que tenía que vender desde el día 1)
      const originalDailyGoal = businessData.totalBusinessDays > 0 ? (meta / businessData.totalBusinessDays) : 0;
      
      const paceStatus = remainingToMeta === 0 ? 'superado' : (requiredDaily > originalDailyGoal ? 'atrasado' : 'excelente');

      // FIX: Try/Catch en operaciones, validaciones correctas de isUpper y validaciones seguras del '.toLowerCase()'
      const handleAddSale = async (e) => {
        e.preventDefault();
        const form = e.target;
        const newFolio = form.folio.value.trim();
        const newPhone = form.phone.value.trim();
        const clientName = form.client.value;
        const amount = Number(form.amount.value);
        // FIX: Se extrae el valor del checkbox de forma segura a través de elements
        const isUpper = form.elements['isUpper']?.checked || false; 

        const isFolioDup = allSales.some(s => s.folio && s.folio.toLowerCase() === newFolio.toLowerCase());
        if (isFolioDup) return setFormError('Error: Este Folio ya existe en tu pipeline.');

        if (newPhone) {
           const isPhoneDup = allSales.some(s => s.telefono === newPhone);
           if (isPhoneDup) return setFormError('Error: Este teléfono ya pertenece a otro cliente.');
        }

        setFormError(''); 

        const saleData = {
          userId: user.uid, 
          agentEmail: user.email,
          folio: newFolio, 
          nombre_cliente: clientName,
          monto_preaprobado: amount,
          monto_dispersado: 0,
          estatus: 'Con oferta',
          telefono: newPhone,
          url: form.url.value,
          canal: isUpper ? 'UPPER' : 'Normal',
          fecha: new Date().toISOString(), 
          history: [{ date: new Date().toISOString(), action: isUpper ? 'Lead UPPER Creado' : 'Lead Creado', user: 'Agente' }]
        };

        try {
          await db.collection('sales').add(saleData);
          setShowForm(false);
        } catch(err) {
          setFormError('Error al guardar: ' + err.message);
        }
      };

      const handleEditSubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const editedFolio = form.folio.value.trim();
        const editedPhone = form.phone.value.trim();

        const isFolioDup = allSales.some(s => s.folio && s.folio.toLowerCase() === editedFolio.toLowerCase() && s.id !== editSaleData.id);
        if (isFolioDup) return setFormError('Error: Ese Folio ya lo tiene otra tarjeta.');

        setFormError('');

        try {
          await db.collection('sales').doc(editSaleData.id).update({
              folio: editedFolio,
              nombre_cliente: form.client.value,
              monto_preaprobado: Number(form.amount.value), 
              telefono: editedPhone,
              url: form.url.value,
              history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: 'Datos de tarjeta editados', user: 'Agente' })
          });
          setEditSaleData(null);
        } catch(err) {
          setFormError('Error al actualizar: ' + err.message);
        }
      };

      // FIX: Añadimos .catch para evitar que rompa en background
      const handleUpdateSale = (id, data) => db.collection('sales').doc(id).update(data).catch(console.error);
      const handleDeleteSale = (id) => db.collection('sales').doc(id).delete().catch(console.error);

      // FIX: Aseguramos que sea asíncrona la acción de cambiar de estado para mayor estabilidad
      const processStatusChange = async (sale, newStatus) => {
        if (sale.estatus === newStatus) return; 
        
        try {
          if (newStatus === 'Acepta oferta') {
             setRealAmount(sale.monto_preaprobado);
             setAcceptOfferData(sale); 
          } 
          else if (newStatus === 'Dispersado') {
             await handleUpdateSale(sale.id, { 
               estatus: 'Dispersado', 
               monto_dispersado: Number(sale.monto_preaprobado), 
               fecha_dispersion: new Date().toISOString(), 
               history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `DISPERSADO AUTOMÁTICO: ${money(sale.monto_preaprobado)}`, user: 'Agente' }) 
             });
          } 
          else if (newStatus === 'Rechazado' || newStatus === 'Cancelado' || newStatus === 'Expirado') {
             setLostReason(newStatus === 'Expirado' ? 'Oferta expirada' : LOST_REASONS[0]); 
             setLostData({ sale, newStatus }); 
          } 
          else {
             await handleUpdateSale(sale.id, { 
               estatus: newStatus, 
               history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `Estatus: ${newStatus}`, user: 'Agente' }) 
             });
          }
        } catch(err) {
           console.error("Error al cambiar de estatus", err);
        }
      };

      const confirmAcceptOffer = async () => {
         if(!acceptOfferData) return;
         
         const montoInicialRespaldado = acceptOfferData.monto_original || acceptOfferData.monto_preaprobado;

         try {
           await handleUpdateSale(acceptOfferData.id, { 
             estatus: 'Acepta oferta', 
             monto_original: montoInicialRespaldado, 
             monto_preaprobado: Number(realAmount), 
             history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `OFERTA ACEPTADA: ${money(realAmount)} (Línea preaprobada: ${money(montoInicialRespaldado)})`, user: 'Agente' }) 
           });
           setAcceptOfferData(null);
         } catch(err) {
           console.error(err);
         }
      };

      const confirmLostStatus = async () => {
         if(!lostData) return;
         
         try {
           await handleUpdateSale(lostData.sale.id, {
              estatus: lostData.newStatus,
              motivo_perdida: lostReason, 
              fecha_resolucion: new Date().toISOString(), 
              history: firebase.firestore.FieldValue.arrayUnion({ 
                date: new Date().toISOString(), 
                action: `${lostData.newStatus} | Motivo: ${lostReason}`, 
                user: 'Agente' 
              })
           });
           setLostData(null);
         } catch(err) {
           console.error(err);
         }
      };

      const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
      const handleDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };

      const handleDrop = (e, targetStatus) => {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const saleId = e.dataTransfer.getData('saleId');
        const sale = allSales.find(s => s.id === saleId);
        if(sale) processStatusChange(sale, targetStatus);
      };

      const changePeriod = (dir) => {
        if(dir === 1) { if(currentQuincena === 1) setCurrentQuincena(2); else { setCurrentQuincena(1); setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1))); } } 
        else { if(currentQuincena === 2) setCurrentQuincena(1); else { setCurrentQuincena(2); setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1))); } }
      };

      return (
        <div className="flex flex-col h-full bg-slate-100">
          <div className="bg-slate-900 text-white p-3 flex flex-wrap justify-between items-center shadow-md z-10 gap-2">
            
            <div className="flex items-center gap-2 md:gap-4">
              <div className="flex flex-col hidden md:flex">
                 <h1 className="font-bold text-lg leading-tight">CRM</h1>
                 <span className="text-[10px] text-blue-400">{user.email ? user.email.split('@')[0] : 'Usuario'}</span>
              </div>
              <div className="flex items-center bg-slate-800 rounded px-1">
                <button onClick={() => changePeriod(-1)} className="p-2 hover:text-green-400"><i className="fas fa-chevron-left"></i></button>
                <div className="flex flex-col items-center w-36">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{new Intl.DateTimeFormat('es-MX', { month: 'short', year: 'numeric' }).format(currentDate)}</span>
                    <span className="text-sm font-black text-green-400">Q{currentQuincena}</span>
                </div>
                <button onClick={() => changePeriod(1)} className="p-2 hover:text-green-400"><i className="fas fa-chevron-right"></i></button>
              </div>
            </div>

            {/* SECCIÓN ESCRITORIO: KPIS NIVEL DIOS Y BUSCADOR */}
            <div className="hidden lg:flex flex-1 items-center justify-center gap-4 px-4">
               
               {/* KPI: TASA DE BATEO */}
               <div className="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded border border-slate-700 shadow-inner" title="Porcentaje de negocios ganados vs. los perdidos">
                   <i className="fas fa-bullseye text-slate-400 text-sm"></i>
                   <div className="flex flex-col">
                       <span className="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Tasa de Bateo</span>
                       <span className="text-sm font-black text-white leading-none">{winRate}%</span>
                   </div>
               </div>

               {/* KPI: RUN RATE (RITMO DIARIO) */}
               <div className={`flex items-center gap-2 px-3 py-1.5 rounded border shadow-inner ${
                   paceStatus === 'superado' ? 'bg-green-500/20 border-green-500/50' :
                   paceStatus === 'atrasado' ? 'bg-red-500/20 border-red-500/50' :
                   'bg-blue-500/20 border-blue-500/50'
               }`}>
                   <i className={`fas text-sm ${
                       paceStatus === 'superado' ? 'fa-trophy text-green-400' :
                       paceStatus === 'atrasado' ? 'fa-fire-alt text-red-400 animate-pulse' :
                       'fa-tachometer-alt text-blue-400'
                   }`}></i>
                   <div className="flex flex-col">
                       <span className={`text-[9px] uppercase font-bold tracking-wider ${
                           paceStatus === 'superado' ? 'text-green-400' : paceStatus === 'atrasado' ? 'text-red-400' : 'text-blue-400'
                       }`}>
                           {paceStatus === 'superado' ? '¡Meta Superada!' : 'Ritmo Diario Requerido'}
                       </span>
                       <span className="text-sm font-black text-white leading-none">
                           {paceStatus === 'superado' ? 'A BUSCAR EL BONO MAX' : `${money(requiredDaily)} / día`}
                       </span>
                   </div>
               </div>

               {/* BUSCADOR */}
               <div className="relative w-64 ml-4">
                 <i className="fas fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                 <input 
                   type="text" 
                   placeholder="Buscar por Folio o Cliente..." 
                   value={searchTerm} 
                   onChange={(e) => setSearchTerm(e.target.value)}
                   className="w-full pl-9 pr-3 py-1.5 rounded-full text-sm bg-slate-800 border border-slate-700 text-white outline-none focus:border-blue-500 focus:bg-slate-700 transition-colors"
                 />
                 {searchTerm && (
                   <button onClick={() => setSearchTerm('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-white">
                      <i className="fas fa-times text-sm"></i>
                   </button>
                 )}
               </div>
            </div>
            
            <div className="flex gap-2 items-center">
              <a href="reports.html" className="bg-blue-600 px-3 py-1.5 rounded text-sm font-bold hover:bg-blue-500 shadow-lg text-white"><i className="fas fa-table md:mr-2"></i><span className="hidden md:inline">Reportes</span></a>
              <button onClick={() => {setShowForm(true); setFormError('');}} className="bg-green-600 px-3 py-1.5 rounded text-sm font-bold hover:bg-green-500 shadow-lg"><i className="fas fa-plus md:mr-2"></i><span className="hidden md:inline">Lead</span></button>
              <button onClick={() => auth.signOut()} className="text-slate-400 hover:text-white px-2" title="Cerrar sesión"><i className="fas fa-sign-out-alt"></i></button>
            </div>
          </div>

          <MetricsHeader sales={filteredSales} metaData={metaData} businessData={businessData} onOpenPlanning={() => setIsPlanningOpen(true)} />

          <div className="flex-1 overflow-x-auto p-4 flex gap-4 pipeline-scroll items-start">
             {PIPELINE_STATUSES.map(status => (
               <div 
                 key={status} 
                 onDragOver={handleDragOver}
                 onDragLeave={handleDragLeave}
                 onDrop={(e) => handleDrop(e, status)}
                 className="min-w-[280px] w-[280px] flex flex-col h-full bg-slate-200/60 rounded-xl pipeline-col border border-transparent transition-colors duration-200"
               >
                 <div className="p-3 font-bold text-slate-600 text-sm flex justify-between bg-slate-100 rounded-t-xl border border-slate-300 border-b-0">
                   {status}
                   <span className="bg-white px-2 rounded-full text-xs shadow-sm">{filteredSales.filter(s => s.estatus === status).length}</span>
                 </div>
                 <div className="flex-1 overflow-y-auto p-2 border border-slate-300 border-t-0 rounded-b-xl pb-20">
                   {filteredSales.filter(s => s.estatus === status).map(sale => (
                     <SaleCard 
                       key={sale.id} 
                       sale={sale} 
                       updateSale={handleUpdateSale} 
                       deleteSale={handleDeleteSale} 
                       onStatusChange={processStatusChange} 
                       onEdit={(saleToEdit) => { setEditSaleData(saleToEdit); setFormError(''); }}
                     />
                   ))}
                   {searchTerm && filteredSales.filter(s => s.estatus === status).length === 0 && (
                     <p className="text-center text-xs text-slate-400 mt-4">Sin resultados</p>
                   )}
                 </div>
               </div>
             ))}
          </div>

          {/* MODAL: CONFIRMAR MONTO EN "ACEPTA OFERTA" */}
          {acceptOfferData && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-5 rounded-lg shadow-xl w-full max-w-sm border-t-4 border-blue-500">
                <h3 className="font-bold text-lg mb-2 text-blue-700">Oferta Aceptada</h3>
                <p className="text-xs text-slate-500 mb-4">El cliente <strong>{acceptOfferData.nombre_cliente}</strong> aceptó. La línea preaprobada original era de <strong>{money(acceptOfferData.monto_original || acceptOfferData.monto_preaprobado)}</strong>. ¿Por qué monto se cerró finalmente?</p>
                <input type="number" value={realAmount} onChange={(e) => setRealAmount(e.target.value)} className="w-full border-2 border-blue-400 rounded p-2 text-xl font-bold mb-4 focus:outline-none" autoFocus />
                <div className="flex gap-2">
                  <button onClick={confirmAcceptOffer} className="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-500 transition-colors">Confirmar Cierre</button>
                  <button onClick={() => setAcceptOfferData(null)} className="flex-1 bg-slate-200 py-2 rounded font-bold hover:bg-slate-300 transition-colors">Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {lostData && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-5 rounded-lg shadow-xl w-full max-w-sm border-t-4 border-red-500">
                <h3 className="font-bold text-lg mb-2 text-red-600">Mover a {lostData.newStatus}</h3>
                <p className="text-xs text-slate-500 mb-4">Para mantener la base de datos limpia, por favor indica por qué se perdió esta oportunidad.</p>
                
                <label className="block text-xs font-bold text-slate-700 mb-1">Motivo Principal:</label>
                <select 
                  value={lostReason} 
                  onChange={(e) => setLostReason(e.target.value)}
                  className="w-full border-2 border-slate-300 rounded p-2 mb-6 focus:outline-none focus:border-red-500 font-medium"
                >
                  {LOST_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                </select>

                <div className="flex gap-2">
                  <button onClick={confirmLostStatus} className="flex-1 bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700 transition-colors">Guardar</button>
                  <button onClick={() => setLostData(null)} className="flex-1 bg-slate-200 py-2 rounded font-bold hover:bg-slate-300 transition-colors">Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: NUEVO LEAD */}
          {showForm && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <form onSubmit={handleAddSale} className="bg-white rounded-lg shadow-xl w-full max-w-sm p-5 space-y-4">
                 <h2 className="font-bold text-lg border-b pb-2">Nuevo Lead</h2>
                 
                 {formError && <div className="bg-red-100 text-red-700 p-2 rounded text-xs font-bold border border-red-200"><i className="fas fa-exclamation-circle mr-1"></i>{formError}</div>}

                 <input name="folio" required placeholder="Número de Folio" className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 font-mono" />
                 <input name="client" required placeholder="Nombre Cliente" className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
                 <input name="amount" type="number" required placeholder="Monto Preaprobado ($)" className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
                 <input name="phone" placeholder="Teléfono" className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
                 <input name="url" placeholder="Enlace a Hubspot" className="w-full border p-2 rounded focus:outline-none focus:border-blue-500" />
                 
                 <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-md flex items-center gap-3 mt-2 hover:bg-indigo-100 transition-colors">
                    <input type="checkbox" id="isUpper" name="isUpper" className="w-5 h-5 cursor-pointer accent-indigo-600" />
                    <label htmlFor="isUpper" className="text-sm font-bold text-indigo-900 cursor-pointer select-none">
                       Asignación "UPPER" 
                       <span className="block text-[10px] text-indigo-600 font-normal mt-0.5">Etiquetar lead como campaña UPPER.</span>
                    </label>
                 </div>
                 
                 <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 transition-colors">Guardar</button>
                    <button type="button" onClick={() => setShowForm(false)} className="flex-1 bg-slate-200 py-2 rounded font-bold hover:bg-slate-300">Cancelar</button>
                 </div>
              </form>
            </div>
          )}

          {/* MODAL: EDITAR LEAD */}
          {editSaleData && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <form onSubmit={handleEditSubmit} className="bg-white rounded-lg shadow-xl w-full max-w-sm p-5 space-y-4 border-t-4 border-slate-700">
                 <h2 className="font-bold text-lg border-b pb-2 text-slate-700">Editar Tarjeta</h2>
                 
                 {formError && <div className="bg-red-100 text-red-700 p-2 rounded text-xs font-bold border border-red-200"><i className="fas fa-exclamation-circle mr-1"></i>{formError}</div>}

                 <div><label className="text-[10px] font-bold text-slate-500 uppercase">Folio</label>
                 <input name="folio" defaultValue={editSaleData.folio} required className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 font-mono text-sm" /></div>
                 
                 <div><label className="text-[10px] font-bold text-slate-500 uppercase">Cliente</label>
                 <input name="client" defaultValue={editSaleData.nombre_cliente} required className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 text-sm" /></div>
                 
                 <div><label className="text-[10px] font-bold text-slate-500 uppercase">Monto Preaprobado</label>
                 <input name="amount" type="number" defaultValue={editSaleData.monto_preaprobado} required className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 text-sm" /></div>
                 
                 <div><label className="text-[10px] font-bold text-slate-500 uppercase">Teléfono</label>
                 <input name="phone" defaultValue={editSaleData.telefono} className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 text-sm" /></div>
                 
                 <div><label className="text-[10px] font-bold text-slate-500 uppercase">Enlace a Hubspot</label>
                 <input name="url" defaultValue={editSaleData.url} className="w-full border p-2 rounded focus:outline-none focus:border-blue-500 text-sm" /></div>
                 
                 <div className="flex gap-2 pt-4">
                    <button type="submit" className="flex-1 bg-slate-800 text-white py-2 rounded font-bold hover:bg-slate-700 transition-colors">Actualizar</button>
                    <button type="button" onClick={() => setEditSaleData(null)} className="flex-1 bg-slate-200 py-2 rounded font-bold hover:bg-slate-300">Cancelar</button>
                 </div>
              </form>
            </div>
          )}

          <PlanningModal isOpen={isPlanningOpen} onClose={() => setIsPlanningOpen(false)} metaData={metaData} setMetaData={saveMeta} businessData={businessData} year={currentDate.getFullYear()} month={currentDate.getMonth()} quincena={currentQuincena} />
        </div>
      );
    };

    const MainWrapper = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoadingAuth(false);
        });
      }, []);

      if (loadingAuth) return (
        <div className="h-screen bg-slate-900 flex flex-col justify-center items-center text-white">
          <div className="loader mb-4"></div>
          <p className="font-bold text-slate-400">Verificando seguridad...</p>
        </div>
      );
      
      if (!user) return <Login />;
      return <App user={user} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainWrapper />);
  </script>
</body>
</html>
