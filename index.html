  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --ios-bg: #F2F2F7;
      --ios-sep: #E5E5EA;
      --ios-blue: #007AFF;
    }
    html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }
    .pipeline-scroll { scroll-snap-type: x mandatory; }
    .pipeline-col { scroll-snap-align: start; min-height: 60vh; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,128,0.26); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(120,120,128,0.45); }
    .glass-modal { background: rgba(0,0,0,0.28); backdrop-filter: blur(12px) saturate(120%); -webkit-backdrop-filter: blur(12px) saturate(120%); }
    .glass-nav { background: rgba(255,255,255,0.72); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); }
    .loader { border: 3px solid rgba(120,120,128,0.2); border-top: 3px solid var(--ios-blue); border-radius: 50%; width: 38px; height: 38px; animation: spin 0.9s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .dragging { opacity: 0.4; transform: scale(0.97); }
    .drag-over { background-color: rgba(0,122,255,0.06) !important; box-shadow: inset 0 0 0 2px rgba(0,122,255,0.35); }
    .ios-card { transition: transform .18s ease, box-shadow .2s ease; }
    .ios-card:active { transform: scale(0.992); }

    /* ===== Barra de tracking — dinamismo ===== */
    @keyframes trackShine { 0% { background-position: 220% 0; } 100% { background-position: -220% 0; } }
    .track-shine { background-image: linear-gradient(100deg, transparent 25%, rgba(255,255,255,0.55) 50%, transparent 75%); background-size: 220% 100%; animation: trackShine 2.4s linear infinite; }
    @keyframes trackStripes { from { background-position: 0 0; } to { background-position: 44px 0; } }
    .track-stripes { background-image: linear-gradient(45deg, rgba(255,255,255,0.20) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.20) 50%, rgba(255,255,255,0.20) 75%, transparent 75%); background-size: 22px 22px; animation: trackStripes 0.9s linear infinite; }
    @keyframes trackGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.13); } }
    .track-glow { animation: trackGlow 2s ease-in-out infinite; }
    @keyframes trackPop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* ===================== MUNDIAL 2026 — BORRAR AL FINALIZAR ===================== */
    @keyframes mundialRoll { from { transform: translate(-50%,-50%) rotate(0deg); } to { transform: translate(-50%,-50%) rotate(360deg); } }
    .mundial-ball { animation: mundialRoll 1.1s linear infinite; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
    /* Balón SVG realista de la barra: rueda lento hacia la derecha */
    .mundial-ball-svg { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); animation: ballRoll 2.4s linear infinite; }
    @keyframes ballRoll { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    /* Césped de la barra (pasto cortado en franjas) */
    .mundial-grass { background-color: #2f9147; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 16px, rgba(0,0,0,.07) 16px 32px); }
    @keyframes mundialBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .mundial-bounce { animation: mundialBounce 1.4s ease-in-out infinite; display: inline-block; }
    @keyframes mundialWave { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .mundial-banner { background: linear-gradient(90deg,#006847,#ffffff,#ce1126,#006847); background-size: 200% 100%; animation: mundialWave 6s linear infinite; }
    @keyframes mundialPop { 0% { transform: scale(0.6); opacity: 0; } 50% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    .mundial-gol { animation: mundialPop .5s ease-out; }
    @keyframes mundialConfetti { 0% { transform: translateY(-8px) rotate(0deg); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(18px) rotate(220deg); opacity: 0; } }
    .mundial-confetti span { position: absolute; top: 0; font-size: 10px; animation: mundialConfetti 1.5s ease-in infinite; }
    /* =================== FIN MUNDIAL 2026 =================== */

    /* ===================== CELEBRACIÓN DISPERSADO — confeti a pantalla completa ===================== */
    .celebra-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; }
    .celebra-piece { position: absolute; top: -28px; will-change: transform, opacity; animation-name: celebraFall; animation-timing-function: cubic-bezier(.28,.62,.5,1); animation-fill-mode: forwards; }
    @keyframes celebraFall {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(var(--drift), 104vh) rotate(var(--rot)); opacity: .9; }
    }
    .celebra-banner { position: absolute; top: 34%; left: 50%; transform: translate(-50%,-50%); text-align: center; animation: celebraPop .55s cubic-bezier(.2,1.5,.5,1) forwards, celebraFade .5s ease 2.7s forwards; }
    @keyframes celebraPop { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; } 60% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }
    @keyframes celebraFade { to { opacity: 0; transform: translate(-50%,-58%) scale(.96); } }
    .celebra-banner .emojis { font-size: 52px; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.25)); animation: mundialBounce 1s ease-in-out infinite; }
    .celebra-banner .titulo { font-size: 40px; font-weight: 900; letter-spacing: -.02em; color: #34C759; text-shadow: 0 2px 12px rgba(52,199,89,.35); margin-top: 6px; }
    .celebra-banner .monto { font-size: 26px; font-weight: 800; color: #1C1C1E; margin-top: 2px; }
    .celebra-banner .sub { font-size: 14px; font-weight: 700; color: #ce1126; text-transform: uppercase; letter-spacing: .06em; margin-top: 8px; }
    .celebra-banner .box { background: rgba(255,255,255,.82); backdrop-filter: blur(4px); border-radius: 26px; padding: 20px 40px; box-shadow: 0 12px 40px rgba(0,0,0,.16); border: 2px solid rgba(52,199,89,.3); }
    /* =================== FIN CELEBRACIÓN DISPERSADO =================== */
  </style>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAAETou6DhYIJJ8cxI13BU1p_l3yGPMilA",
      authDomain: "ventas-ebd49.firebaseapp.com",
      projectId: "ventas-ebd49",
      storageBucket: "ventas-ebd49.firebasestorage.app",
      messagingSenderId: "907042495792",

    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const PIPELINE_STATUSES = ["Con oferta", "Acepta oferta", "Long track", "Dispersado", "Rechazado", "Cancelado", "Expirado"];
    
    const LOST_REASONS = [
      "No contesta / Inlocalizable",
      "Oferta expirada",
      "Tasa/Condiciones no favorables",
      "Se fue con la competencia",
      "No cumple requisitos / Buro",
      "Cliente se arrepintió",
      "Otro motivo"
    ];

    const parseDate = (input) => {
      if (!input) return new Date();
      if (input.toDate) return input.toDate();
      const d = new Date(input);
      return isNaN(d) ? new Date() : d;
    };

    // en-US + MXN muestra "MX$" (peso inequívoco), evitando confundir con dólar.
    const money = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val || 0);
    // Las COMISIONES se pagan en dólares (USD).
    const moneyUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val || 0);

    // === Tipo de cambio USD oficial (API gratis, sin llave). Caché 12h => ~2 veces al día. ===
    const FX_TTL_MS = 12 * 60 * 60 * 1000;
    const FX_URLS = [
      'https://open.er-api.com/v6/latest/MXN',                 // gratis, sin llave, CORS
      'https://api.frankfurter.app/latest?from=MXN&to=USD',    // respaldo
    ];
    const useTipoCambioUSD = () => {
      const leerCache = () => { try { return JSON.parse(localStorage.getItem('fx_mxn_usd') || 'null'); } catch (e) { return null; } };
      const [fx, setFx] = useState(() => { const c = leerCache(); return c && c.rate ? c : null; });
      useEffect(() => {
        let activo = true;
        const cargar = async () => {
          const c = leerCache();
          if (c && c.rate && (Date.now() - c.ts) < FX_TTL_MS) { if (activo) setFx(c); return; }
          for (const url of FX_URLS) {
            try {
              const r = await fetch(url);
              if (!r.ok) continue;
              const d = await r.json();
              const val = d && d.rates && Number(d.rates.USD);
              if (val && val > 0) {
                const nuevo = { rate: val, ts: Date.now() };
                if (activo) setFx(nuevo);
                try { localStorage.setItem('fx_mxn_usd', JSON.stringify(nuevo)); } catch (e) {}
                return;
              }
            } catch (e) { /* intenta la siguiente fuente */ }
          }
        };
        cargar();
        const id = setInterval(cargar, FX_TTL_MS);
        return () => { activo = false; clearInterval(id); };
      }, []);
      return fx; // { rate: USD por 1 MXN, ts } o null
    };

    // Comisiones FIJAS (en dólares USD) por nivel de cumplimiento de meta.
    const COMISIONES = { bono80: 115, bono100: 240, bono120: 320, bono140: 500 };
    const NIVELES_COMISION = [
      { pct: 80,  bono: COMISIONES.bono80  },
      { pct: 100, bono: COMISIONES.bono100 },
      { pct: 120, bono: COMISIONES.bono120 },
      { pct: 140, bono: COMISIONES.bono140 },
    ];

    /* =====================================================================
       🏆 MUNDIAL 2026 — Decoración TEMPORAL (fácil de quitar).
       Para APAGAR todo al terminar el mundial: cambia enabled a false.
       Para BORRARLO por completo: elimina este objeto, el bloque CSS
       marcado "MUNDIAL 2026" y los bloques JSX marcados "MUNDIAL 2026".
       ===================================================================== */
    const MUNDIAL = {
      enabled: true,
      titulo: "Mundial 2026",
      ball: "⚽",
      trophy: "🏆",
      goal: "🥅",
      gol: "¡GOOOL! 🎉",
    };

    // Balón de fútbol vectorial (clásico Telstar). Nítido en cualquier navegador,
    // sin depender de fuentes de emoji. Parte del decorado MUNDIAL 2026.

      <svg viewBox="0 0 64 64" width={size} height={size} className={className} aria-hidden="true">

          <radialGradient id="balonShade" cx="37%" cy="30%" r="80%">

            <stop offset="100%" stopColor="#c4c8ce" />
          </radialGradient>
          <clipPath id="balonClip"><circle cx="32" cy="32" r="30" /></clipPath>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#balonShade)" stroke="#242527" strokeWidth="2.5" />
        <g clipPath="url(#balonClip)">
          <g stroke="#242527" strokeWidth="1.7" strokeLinecap="round">
            <line x1="32" y1="23" x2="32" y2="4" />
            <line x1="40.56" y1="29.22" x2="59.58" y2="23.04" />
            <line x1="37.29" y1="39.28" x2="49.05" y2="55.46" />
            <line x1="26.71" y1="39.28" x2="14.95" y2="55.46" />
            <line x1="23.44" y1="29.22" x2="4.42" y2="23.04" />
          </g>
          <g fill="#1b1c1e" stroke="#1b1c1e" strokeWidth="0.6" strokeLinejoin="round">
            <polygon points="32,23 40.56,29.22 37.29,39.28 26.71,39.28 23.44,29.22" />
            <polygon points="49.04,8.54 51.95,17.48 44.34,23.01 36.73,17.48 39.64,8.54" />
            <polygon points="59.58,40.96 51.97,46.49 44.36,40.96 47.27,32.02 56.67,32.02" />
            <polygon points="32,61 24.39,55.47 27.3,46.53 36.7,46.53 39.61,55.47" />
            <polygon points="4.42,40.96 7.33,32.02 16.73,32.02 19.64,40.96 12.03,46.49" />

          </g>
        </g>
        <ellipse cx="23" cy="19" rx="9" ry="5.5" fill="#ffffff" opacity="0.35" />
      </svg>
    );

    // Figura de futbolista pateando (silueta), al inicio de la barra. Decorado MUNDIAL 2026.
    const Pateador = ({ h = 46 }) => (
      <svg viewBox="0 0 48 60" width={h * 0.8} height={h} aria-hidden="true">
        <ellipse cx="20" cy="57" rx="15" ry="2.5" fill="rgba(0,0,0,0.18)" />
        <g stroke="#1b1c1e" fill="none" strokeLinecap="round" strokeLinejoin="round">
          <line x1="21" y1="34" x2="25" y2="16" strokeWidth="6.5" />
          <line x1="24" y1="20" x2="15" y2="26" strokeWidth="4" />
          <line x1="24" y1="20" x2="33" y2="13" strokeWidth="4" />
          <line x1="21" y1="34" x2="16" y2="54" strokeWidth="5.5" />
          <line x1="16" y1="54" x2="11" y2="56" strokeWidth="5.5" />
          {/* pierna de pateo (rota alrededor de la cadera) */}
          <g strokeWidth="5.5">
            <animateTransform attributeName="transform" attributeType="XML" type="rotate"
              values="22 21 34; -24 21 34; 22 21 34" keyTimes="0;0.4;1"
              dur="1.1s" calcMode="spline" keySplines="0.5 0 0.2 1; 0.3 0 0.4 1" repeatCount="indefinite" />
            <line x1="21" y1="34" x2="33" y2="38" />
            <line x1="33" y1="38" x2="44" y2="30" />
          </g>
        </g>
        <circle cx="26" cy="10" r="5.4" fill="#1b1c1e" />
      </svg>
    );

    /* =====================================================================
       🎉 CELEBRACIÓN AL DISPERSAR — confeti a pantalla completa.
       Se dispara cuando una venta pasa a "Dispersado".
       Para apagarla: cambia CELEBRA_DISPERSADO a false.
       ===================================================================== */
    const CELEBRA_DISPERSADO = true;
    const CELEBRA_DURACION_MS = 3400;

    // Overlay de confeti a pantalla completa + banner de "¡DISPERSADO!".
    const ConfettiDispersado = ({ monto }) => {
      const piezas = React.useMemo(() => {
        const colores = ['#34C759', '#007AFF', '#FF9500', '#FF3B30', '#5856D6', '#AF52DE', '#FFCC00', '#00C7BE', '#ce1126', '#006847'];
        const emojis = ['🎉', '⚽', '🥅', '💵', '💰', '🔥', '⭐', '🏆'];
        const arr = [];
        for (let i = 0; i < 150; i++) {
          const esEmoji = Math.random() < 0.16;
          const size = 8 + Math.random() * 9;
          arr.push({
            left: Math.random() * 100,
            delay: Math.random() * 0.7,
            dur: 2.6 + Math.random() * 2.0,
            drift: (Math.random() * 2 - 1) * 180,
            rot: Math.random() * 900 - 450,
            size,
            color: colores[Math.floor(Math.random() * colores.length)],
            emoji: esEmoji ? emojis[Math.floor(Math.random() * emojis.length)] : null,
            redondo: Math.random() < 0.5,
          });
        }
        return arr;
      }, []);

      return (
        <div className="celebra-overlay">
          <div className="celebra-banner">
            <div className="box">
              <div className="emojis">⚽ 🎉 🥅</div>
              <p className="titulo">¡DISPERSADO!</p>
              {monto > 0 && <p className="monto">{money(monto)}</p>}
              <p className="sub">¡GOOOL de venta! 🔥</p>
            </div>
          </div>
          {piezas.map((p, i) => (
            <span
              key={i}
              className="celebra-piece"
              style={{
                left: `${p.left}%`,
                width: p.emoji ? undefined : `${p.size}px`,
                height: p.emoji ? undefined : `${p.size * 1.5}px`,
                background: p.emoji ? undefined : p.color,
                borderRadius: p.redondo ? '50%' : '2px',
                fontSize: p.emoji ? `${p.size + 12}px` : undefined,
                animationDuration: `${p.dur}s`,
                animationDelay: `${p.delay}s`,
                '--drift': `${p.drift}px`,
                '--rot': `${p.rot}deg`,
              }}
            >{p.emoji || ''}</span>
          ))}
        </div>
      );
    };

    const formatDate = (input) => new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', hour:'2-digit', minute:'2-digit' }).format(parseDate(input));
    const formatTime = (input) => new Intl.DateTimeFormat('es-MX', { hour:'2-digit', minute:'2-digit' }).format(parseDate(input));

    const getQuincena = (date) => date.getDate() <= 15 ? 1 : 2;

    const getBusinessDaysQuincena = (targetDate, quincena) => {
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();
      const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
      const startDay = quincena === 1 ? 1 : 16;
      const endDay = quincena === 1 ? 15 : lastDayOfMonth;
      let totalBusinessDays = 0, remainingDays = 0;
      
      const today = new Date();
      today.setHours(0,0,0,0);

      for (let d = startDay; d <= endDay; d++) {
        const dateCheck = new Date(year, month, d);
        if (dateCheck.getDay() !== 0 && dateCheck.getDay() !== 6) { 
          totalBusinessDays++;
          if (dateCheck >= today) remainingDays++;
        }
      }
      return { totalBusinessDays, remainingDays, startDay, endDay };
    };

    const Login = () => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [error, setError] = useState('');

      const handleGoogleLogin = () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => setError("Error con Google: " + err.message));
      };

      const handleEmailAuth = (e) => {
        e.preventDefault();
        setError('');
        if (isRegistering) {
          auth.createUserWithEmailAndPassword(email, password)
            .catch(err => setError(err.code === 'auth/email-already-in-use' ? 'El correo ya está registrado.' : err.message));
        } else {
          auth.signInWithEmailAndPassword(email, password)
            .catch(err => setError(err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' ? 'Datos incorrectos.' : err.message));
        }
      };

      return (
        <div className="flex-1 flex flex-col items-center justify-center bg-[#F2F2F7] text-[#1C1C1E] p-4">

            <img src="https://raw.githubusercontent.com/jarodlopez/Ventas-MM/refs/heads/main/1779060689439.jpg" alt="MultiMoney" className="w-16 h-16 rounded-2xl object-cover mb-4 shadow-[0_8px_24px_rgba(0,0,0,0.18)]" />
            <h1 className="text-2xl font-semibold tracking-tight mb-1">CRM Ventas</h1>
            <p className="text-sm text-[#8E8E93] mb-7">{isRegistering ? 'Crear cuenta' : 'Ingreso Agentes'}</p>

            {error && <div className="w-full bg-[#FF3B30]/10 text-[#FF3B30] p-3 rounded-xl text-xs font-semibold text-center mb-4">{error}</div>}

            <form onSubmit={handleEmailAuth} className="w-full flex flex-col gap-2.5 mb-5">
              <input type="email" placeholder="Correo" required value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-3 rounded-xl text-[15px] focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
              <input type="password" placeholder="Contraseña" required value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-3 rounded-xl text-[15px] focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
              <button type="submit" className="w-full bg-[#007AFF] text-white font-semibold py-3 rounded-xl hover:bg-[#0070E0] active:scale-[0.98] transition-all mt-1">{isRegistering ? 'Registrarse' : 'Iniciar Sesión'}</button>
            </form>

            <div className="w-full flex items-center gap-3 mb-5"><div className="h-px bg-[#E5E5EA] flex-1"></div><span className="text-[11px] text-[#AEAEB2] font-medium uppercase tracking-wide">O entra con</span><div className="h-px bg-[#E5E5EA] flex-1"></div></div>

    const MetricsHeader = ({ sales, metaData, businessData, onOpenPlanning, usdRate }) => {

      const soldHoy = dispersados.filter(s => parseDate(s.fecha_dispersion || s.fecha).toDateString() === hoyKey).reduce((a, s) => a + (Number(s.monto_dispersado) || 0), 0);
      const soldSemana = dispersados.filter(s => parseDate(s.fecha_dispersion || s.fecha) >= iniSemana).reduce((a, s) => a + (Number(s.monto_dispersado) || 0), 0);
      const pctHoy = metaDiaria > 0 ? Math.min(100, (soldHoy / metaDiaria) * 100) : 0;
      const pctSemana = metaSemanal > 0 ? Math.min(100, (soldSemana / metaSemanal) * 100) : 0;

      let currentBonus = 0;
      let nextBonusLvl = "";
      let nextPercent = 0;
      let missingForNext = 0;
      let nextBonus = 0;

      if (percent >= 140) { currentBonus = COMISIONES.bono140; nextBonusLvl = "MAX"; }
      else if (percent >= 120) { currentBonus = COMISIONES.bono120; nextBonusLvl = "140%"; nextPercent = 140; missingForNext = (meta * 1.4) - sold; nextBonus = COMISIONES.bono140; }
      else if (percent >= 100) { currentBonus = COMISIONES.bono100; nextBonusLvl = "120%"; nextPercent = 120; missingForNext = (meta * 1.2) - sold; nextBonus = COMISIONES.bono120; }
      else if (percent >= 80) { currentBonus = COMISIONES.bono80; nextBonusLvl = "100%"; nextPercent = 100; missingForNext = meta - sold; nextBonus = COMISIONES.bono100; }
      else { nextBonusLvl = "80%"; nextPercent = 80; missingForNext = (meta * 0.8) - sold; nextBonus = COMISIONES.bono80; }

      // Progreso dinámico hacia el siguiente nivel de comisión (0-100%).
      let prevMark = 0;
      if (percent >= 120) prevMark = 120; else if (percent >= 100) prevMark = 100; else if (percent >= 80) prevMark = 80;
      const nextBonusProgress = nextPercent > 0
        ? Math.max(0, Math.min(100, ((percent - prevMark) / (nextPercent - prevMark)) * 100))
        : 100;

      const maxVisualScale = 150; 
      const fillVisualWidth = Math.min((percent / maxVisualScale) * 100, 100);

      return (

                   {meta > 0 && metaData.origen === 'global' && <span className="text-[9px] font-bold text-[#007AFF] bg-[#007AFF]/10 px-1.5 py-0.5 rounded-full normal-case">global</span>}

                 <p className="text-3xl font-black text-[#3A3A3C] leading-none tracking-tight">{money(meta)}</p>
                 {usd && <p className="text-[11px] text-[#AEAEB2] font-medium mt-1.5 tracking-wide">≈ {moneyUSD(meta * usd)} USD</p>}

                       <div className="mt-2 w-full bg-[#34C759]/15 rounded-full h-1.5"><div className="h-full rounded-full bg-[#34C759] transition-all duration-700" style={{ width: `${nextBonusProgress}%` }}></div></div>
                   </div>
                 ) : (
                   <div className="text-[11px] font-semibold text-[#AF52DE] ml-1.5 hidden md:block border-l border-[#34C759]/20 pl-3">MÁX 🚀</div>
                 )}
              </div>

              {/* Metas diaria / semanal (según 100% quincenal) */}
              {meta > 0 && (<>
              <div className="hidden lg:block w-px h-12 bg-[#E5E5EA]"></div>
              <div className="hidden lg:flex flex-col gap-3 min-w-[200px]">
                 <div>
                    <div className="flex justify-between items-baseline gap-2"><span className="text-[11px] font-medium text-[#8E8E93] uppercase tracking-wide">Meta diaria</span><span className="text-base font-bold text-[#3A3A3C] leading-none">{money(metaDiaria)}</span></div>
                    <div className="w-full bg-[#E5E5EA] rounded-full h-1.5 mt-1.5"><div className={`h-1.5 rounded-full transition-all duration-700 ${pctHoy >= 100 ? 'bg-[#34C759]' : 'bg-[#007AFF]'}`} style={{ width: `${pctHoy}%` }}></div></div>
                    <span className="text-[10px] text-[#AEAEB2] font-medium">hoy {money(soldHoy)} · {pctHoy.toFixed(0)}%</span>

                 <p className="text-[11px] font-medium text-[#8E8E93] uppercase tracking-wide"><i className="far fa-clock mr-1"></i>Restante</p>
                 <p className="text-2xl font-black text-[#3A3A3C] leading-none tracking-tight">{businessData.remainingDays} días</p>
              </div>
            </div>

            {/* Derecha: tipo de cambio + Ajustar Plan */}
            <div className="flex flex-col items-end gap-2">
              {usd && (

                  <i className="fas fa-arrow-right-arrow-left mr-1.5 text-[#34C759]"></i>1 USD ≈ <b className="text-[#3A3A3C]">{money(1 / usd)}</b>
                </span>
              )}
              <button onClick={onOpenPlanning} className="bg-[#F2F2F7] text-[#1C1C1E] border border-[#E5E5EA] px-5 py-2.5 rounded-full text-sm font-semibold hover:bg-[#E5E5EA] active:scale-[0.98] transition-all whitespace-nowrap">
                <i className="fas fa-sliders-h mr-2 text-[#8E8E93]"></i>Ajustar Plan
              </button>
            </div>
          </div>

          {/* ===== Fila 2: barra de progreso a todo el ancho ===== */}
          <div className="w-full">
             <div className="flex justify-between items-end mb-2">
                 <p className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide flex items-center gap-1.5">
                     Progreso Total

                       <span className="mundial-gol text-[9px] font-bold text-[#ce1126] bg-[#ce1126]/10 px-1.5 py-0.5 rounded-full normal-case tracking-normal">{MUNDIAL.gol}</span>
                     )}
                     {/* ===== FIN MUNDIAL 2026 ===== */}
                 </p>
                 <p className={`text-3xl font-black leading-none tracking-tight transition-colors duration-500 ${percent >= 140 ? 'text-[#AF52DE]' : percent >= 120 ? 'text-[#5856D6]' : percent >= 100 ? 'text-[#34C759]' : percent >= 80 ? 'text-[#007AFF]' : 'text-[#FF9500]'}`}>{percent.toFixed(1)}%</p>
             </div>

             <div className={`relative w-full rounded-full h-5 mb-12 shadow-inner ${MUNDIAL.enabled ? 'mundial-grass mt-6' : 'bg-[#E5E5EA] mt-1'}`}>
                <div
                  className={`absolute top-0 left-0 h-full rounded-full overflow-hidden transition-all duration-1000 track-glow bg-gradient-to-r ${percent >= 140 ? 'from-[#9B3FD1] to-[#C77DFF]' : percent >= 120 ? 'from-[#4B49C9] to-[#7B79E8]' : percent >= 100 ? 'from-[#2DB14E] to-[#6EE7A0]' : percent >= 80 ? 'from-[#007AFF] to-[#4DA3FF]' : 'from-[#F08000] to-[#FFB84D]'}`}
                  style={{ width: `${fillVisualWidth}%`, boxShadow: '0 2px 12px rgba(0,0,0,0.14)' }}
                >
                  <div className="absolute inset-0 track-stripes"></div>
                  <div className="absolute inset-0 track-shine"></div>
                </div>

                {[80, 100, 120, 140].map(mark => {
                    const montoDeEstaMarca = meta * (mark / 100);
                    const faltaParaEstaMarca = montoDeEstaMarca - sold;
                    const bonoDeEstaMarca = COMISIONES['bono' + mark] || 0;
                    const alcanzada = percent >= mark;
                    const tooltipText = faltaParaEstaMarca > 0
                        ? `Te faltan ${money(faltaParaEstaMarca)} para el ${mark}% → comisión ${moneyUSD(bonoDeEstaMarca)}`
                        : `¡${mark}% alcanzado! Comisión ${moneyUSD(bonoDeEstaMarca)} liberada`;
                    return (
                        <div key={mark} className="absolute top-0 bottom-0 border-l-2 border-white/80 z-10 group cursor-help" style={{ left: `${(mark / maxVisualScale) * 100}%` }} title={tooltipText}>
                            <span className={`absolute top-[27px] -translate-x-1/2 text-[10px] font-bold whitespace-nowrap transition-colors ${alcanzada ? 'text-[#3A3A3C]' : 'text-[#AEAEB2] group-hover:text-[#007AFF]'}`}>{mark}%</span>
                            <span className={`absolute top-[40px] -translate-x-1/2 text-[9px] font-bold whitespace-nowrap transition-colors ${alcanzada ? 'text-[#34C759] track-pop' : 'text-[#C7C7CC] group-hover:text-[#34C759]'}`}>{moneyUSD(bonoDeEstaMarca)}</span>
                        </div>
                    )
                })}

                {/* ===== MUNDIAL 2026: pateador + pelota que avanza + portería (eliminar al terminar) ===== */}
                {MUNDIAL.enabled && (
                  <>
                    <div className="absolute top-1/2 z-30 pointer-events-none" style={{ left: '-6px', transform: 'translateY(-60%)' }} title="¡A meter goles de venta!"><Pateador h={46} /></div>
                    <div className="absolute top-1/2 z-20 pointer-events-none" style={{ left: `${fillVisualWidth}%`, transform: 'translate(-50%,-50%)', transition: 'left 1s ease' }} title={`Vas al ${percent.toFixed(1)}% — ¡mete gol de venta!`}><BalonFutbol size={30} className="mundial-ball-svg" /></div>
                    <div className="absolute top-1/2 -translate-y-1/2 right-[-16px] z-20 pointer-events-none text-lg leading-none" title="Meta máxima"><span className="mundial-bounce">{percent >= 140 ? MUNDIAL.trophy : MUNDIAL.goal}</span></div>

                        <span style={{ left: '45%', animationDelay: '.3s' }}>⚪</span>
                        <span style={{ left: '65%', animationDelay: '.6s' }}>🟢</span>
                        <span style={{ left: '85%', animationDelay: '.9s' }}>🟡</span>
                      </div>
                    )}
                  </>
                )}
                {/* ===== FIN MUNDIAL 2026 ===== */}
             </div>

             <div className="-mt-1">
                 {nextPercent > 0 ? (
                     <p className="text-[11px] text-[#8E8E93] font-medium">
                         🎯 Faltan <span className="font-semibold text-[#3A3A3C]">{money(missingForNext)}</span> para el {nextPercent}% y liberar <span className="font-semibold text-[#34C759]">{moneyUSD(nextBonus)}</span>
                     </p>
                 ) : (
                     <p className="text-[11px] text-[#AF52DE] font-semibold">

      const [isDraggable, setIsDraggable] = useState(false);

        e.preventDefault();
        if(!comment.trim()) return;
        updateSale(sale.id, { history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `Nota: ${comment}`, user: 'Agente' }) });
        setComment('');
      };

      const handleDragStart = (e) => {
        e.dataTransfer.setData('saleId', sale.id);
        setTimeout(() => e.target.classList.add('dragging'), 0);
      };
      
      const handleDragEnd = (e) => {
        e.target.classList.remove('dragging');
        setIsDraggable(false); 
      };

      const getBorderColor = () => {
        if(sale.estatus === 'Dispersado') return 'bg-[#34C759]';
        if(sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') return 'bg-[#FF3B30]';
        return 'bg-[#007AFF]';
      }

      const lastUpdate = sale.history && sale.history.length > 0
            ? new Date(sale.history[sale.history.length - 1].date)
            : parseDate(sale.fecha);
      
      const today = new Date();
      const msPerDay = 1000 * 60 * 60 * 24;
      const daysStale = Math.floor((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - new Date(lastUpdate.getFullYear(), lastUpdate.getMonth(), lastUpdate.getDate())) / msPerDay);
      
      const isStale = ['Con oferta', 'Acepta oferta'].includes(sale.estatus) && daysStale >= 3;

      return (
        <div
          draggable={isDraggable}
          onDragStart={handleDragStart}
          onDragEnd={handleDragEnd}
          className={`ios-card bg-white p-3 rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.06)] border border-[#ECECEE] mb-2.5 relative group hover:shadow-[0_6px_20px_rgba(0,0,0,0.08)] ${isDraggable ? 'cursor-grab' : ''}`}
        >
          <div className={`absolute left-0 top-2 bottom-2 w-1 rounded-full ${getBorderColor()}`}></div>
          <div className="pl-2.5">

            <div className="flex justify-between items-start">
              <div className="flex items-center gap-1.5 flex-wrap">
                <div
                  onMouseEnter={() => setIsDraggable(true)}
                  onMouseLeave={() => setIsDraggable(false)}
                  className="text-[#C7C7CC] hover:text-[#007AFF] cursor-grab pr-0.5"
                  title="Arrastrar tarjeta"
                >
                  <i className="fas fa-grip-vertical text-sm"></i>
                </div>
                <span className="text-xs font-semibold text-[#3A3A3C] font-mono select-text">{sale.folio}</span>

                {sale.isCarryOver && (
                  <span className="bg-[#FF9500]/10 text-[#FF9500] text-[9px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" title="Este lead viene de un periodo anterior">
                    <i className="fas fa-history text-[8px]"></i> CARRY
                  </span>
                )}

                {sale.canal === 'UPPER' && (
                  <span className="bg-[#5856D6]/10 text-[#5856D6] text-[9px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" title="Lead de campañas UPPER">
                    <i className="fas fa-bolt text-[8px]"></i> UPPER
                  </span>
                )}

                {isStale && (
                  <span className="bg-[#32ADE6]/10 text-[#32ADE6] text-[9px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse" title={`Lleva ${daysStale} días sin movimiento. ¡Llámale!`}>
                    <i className="fas fa-snowflake text-[8px]"></i> {daysStale} DÍAS FRÍO
                  </span>
                )}

              </div>
              <div className="flex">
                <button onClick={() => onEdit(sale)} className="text-[#C7C7CC] hover:text-[#007AFF] px-1.5" title="Editar"><i className="fas fa-pencil-alt text-xs"></i></button>
                <button onClick={() => setShowDeleteModal(true)} className="text-[#C7C7CC] hover:text-[#FF3B30] px-1.5" title="Eliminar"><i className="fas fa-trash-alt text-xs"></i></button>
              </div>
            </div>

            <h3 className="font-semibold text-[15px] text-[#1C1C1E] truncate mt-1.5 select-text">{sale.nombre_cliente}</h3>

            {(sale.curp || sale.rfc) && (
              <div className="flex flex-wrap gap-x-3 gap-y-0.5 mt-0.5 text-[9px] text-[#AEAEB2] font-mono select-text">
                {sale.curp && <span><span className="text-[#C7C7CC] mr-0.5">CURP</span>{sale.curp}</span>}
                {sale.rfc && <span><span className="text-[#C7C7CC] mr-0.5">RFC</span>{sale.rfc}</span>}
              </div>
            )}

            <div className="flex justify-between items-end mt-2.5 bg-[#F2F2F7] p-2.5 rounded-xl">
               <div className="flex flex-col gap-1">
                  {sale.monto_original ? (
                     <>
                        <div>
                          <span className="text-[9px] text-[#AEAEB2] uppercase font-medium block leading-none mb-0.5 tracking-wide">Línea Preaprobada</span>
                          <span className={`font-medium text-[10px] ${sale.monto_original !== sale.monto_preaprobado ? 'text-[#AEAEB2] line-through' : 'text-[#8E8E93]'}`}>
                            {money(sale.monto_original)}
                          </span>
                        </div>
                        <div>
                          <span className="text-[9px] text-[#007AFF] uppercase font-medium block leading-none mb-0.5 tracking-wide">Oferta Aceptada</span>
                          <span className="font-semibold text-[#007AFF] text-[13px]">{money(sale.monto_preaprobado)}</span>
                        </div>
                     </>
                  ) : (
                     <div>
                       <span className="text-[10px] text-[#AEAEB2] uppercase font-medium block leading-none mb-0.5 tracking-wide">Preaprobado</span>
                       <span className="font-semibold text-[#3A3A3C] text-[13px]">{money(sale.monto_preaprobado)}</span>
                     </div>
                  )}
               </div>

               {sale.estatus === 'Dispersado' && (
                 <div className="flex flex-col text-right">
                     <span className="text-[10px] text-[#34C759] font-medium uppercase block leading-none mb-0.5 tracking-wide">Dispersado</span>
                     <span className="font-semibold text-[#34C759] text-sm">{money(sale.monto_dispersado)}</span>
                 </div>
               )}

               {(sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') && sale.motivo_perdida && (
                 <div className="flex flex-col text-right">
                     <span className="text-[10px] text-[#FF3B30] font-medium uppercase block leading-none mb-0.5 tracking-wide">Motivo</span>
                     <span className="font-semibold text-[#FF3B30] text-[10px] truncate max-w-[90px]" title={sale.motivo_perdida}>{sale.motivo_perdida}</span>
                 </div>
               )}
            </div>

            <div className="mt-2.5 flex flex-wrap gap-1.5 border-t border-[#F2F2F7] pt-2.5 items-center">
               {sale.telefono && (
                 <a
                   href={`tel:${sale.telefono}`}
                   className="px-2 py-1 rounded-full bg-[#F2F2F7] text-[#8E8E93] text-[10px] flex items-center font-medium hover:bg-[#007AFF]/10 hover:text-[#007AFF] transition-colors select-text"
                 >
                   <i className="fas fa-phone mr-1"></i> {sale.telefono}
                 </a>
               )}
               {sale.correo && (
                 <a
                   href={`mailto:${sale.correo}`}
                   title={sale.correo}
                   className="px-2 py-1 rounded-full bg-[#F2F2F7] text-[#8E8E93] text-[10px] flex items-center font-medium hover:bg-[#007AFF]/10 hover:text-[#007AFF] transition-colors select-text max-w-[140px]"
                 >
                   <i className="fas fa-envelope mr-1"></i> <span className="truncate">{sale.correo}</span>
                 </a>
               )}
               {sale.url && <a href={sale.url} target="_blank" rel="noopener noreferrer" className="w-6 h-6 rounded-full bg-[#F2F2F7] flex items-center justify-center text-[#8E8E93] hover:text-[#007AFF] hover:bg-[#007AFF]/10 transition-colors" title="Ver en Hubspot"><i className="fas fa-link text-[10px]"></i></a>}
               <button onClick={() => setShowHistory(!showHistory)} className="ml-auto text-[10px] text-[#007AFF] font-medium">{showHistory ? 'Ocultar' : 'Bitácora'}</button>
            </div>

            {showHistory && (
              <div className="bg-[#F2F2F7] p-2.5 mt-2 rounded-xl text-[10px]">
                 <div className="max-h-32 overflow-y-auto pr-1">
                   {sale.history && sale.history.slice().reverse().map((h, i) => (
                     <div key={`hist-${i}`} className="border-b border-[#E5E5EA] pb-1 mb-1 last:border-0 last:mb-0"><span className="font-semibold text-[#8E8E93] block">{formatDate(h.date)}</span><span className="break-words text-[#3A3A3C] select-text">{h.action}</span></div>
                   ))}
                 </div>
                 <form onSubmit={addComment} className="flex gap-1.5 mt-2 border-t border-[#E5E5EA] pt-2">
                   <input type="text" value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Comentar..." className="flex-1 bg-white border border-[#E5E5EA] rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-[#007AFF]" />
                   <button type="submit" className="bg-[#007AFF] text-white w-8 rounded-lg flex items-center justify-center"><i className="fas fa-paper-plane text-xs"></i></button>
                 </form>
              </div>
            )}

            <div className="relative mt-2.5">
              <select value={sale.estatus} onChange={(e) => onStatusChange(sale, e.target.value)} className="w-full text-xs font-medium bg-[#F2F2F7] border border-transparent rounded-xl px-3 py-2 pr-8 outline-none focus:bg-white focus:border-[#007AFF] cursor-pointer appearance-none transition-colors">
                 {PIPELINE_STATUSES.map(s => (<option key={s} value={s}>{s}</option>))}
              </select>
              <i className="fas fa-chevron-down text-[#C7C7CC] text-[10px] absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </div>
          </div>

          {showDeleteModal && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-5 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] w-full max-w-sm cursor-default">
                <h3 className="font-semibold text-lg mb-1 text-[#FF3B30]">Eliminar Registro</h3>
                <p className="text-xs text-[#8E8E93] mb-3">Ingresa el PIN para confirmar.</p>
                <input type="password" placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-3 rounded-xl mb-3 text-center text-lg tracking-widest focus:outline-none focus:bg-white focus:border-[#FF3B30] transition-colors" />
                <div className="flex gap-2"><button onClick={() => { if(pin === '2398') deleteSale(sale.id); }} className="flex-1 bg-[#FF3B30] text-white py-2.5 rounded-xl font-semibold active:scale-[0.98] transition-transform">Eliminar</button><button onClick={() => {setShowDeleteModal(false); setPin('');}} className="flex-1 bg-[#E5E5EA] text-[#1C1C1E] py-2.5 rounded-xl font-medium active:scale-[0.98] transition-transform">Cancelar</button></div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = ({ user }) => {
      const [currentDate, setCurrentDate] = useState(new Date());
      const [currentQuincena, setCurrentQuincena] = useState(new Date().getDate() <= 15 ? 1 : 2);
      
      const [allSales, setAllSales] = useState([]);
      const [isPlanningOpen, setIsPlanningOpen] = useState(false);

      // Metas: propia (auto-editable), por categoría y global (fijadas por admin).
      const [selfMeta, setSelfMeta] = useState(null);         // metas/{uid_period}
      const [catMetaDoc, setCatMetaDoc] = useState(null);     // metas_categoria/{period}
      const [globalMetaDoc, setGlobalMetaDoc] = useState(null); // metas_globales/{period}
      const [miCategoria, setMiCategoria] = useState('');     // agentes/{uid}.categoria

      const [showForm, setShowForm] = useState(false);
      const [formError, setFormError] = useState(''); 
      const [searchTerm, setSearchTerm] = useState('');

      const [acceptOfferData, setAcceptOfferData] = useState(null); 
      const [realAmount, setRealAmount] = useState('');
      
      const [lostData, setLostData] = useState(null);
      const [lostReason, setLostReason] = useState(LOST_REASONS[0]);
      
      const [editSaleData, setEditSaleData] = useState(null);

      // Celebración de confeti al pasar una venta a "Dispersado".
      const [celebracion, setCelebracion] = useState(null); // { id, monto } | null
      const prevEstatusRef = useRef(null);                  // { [saleId]: estatus } del snapshot anterior
      const celebraTimerRef = useRef(null);
      const celebraSeqRef = useRef(0);

      const usdRate = useTipoCambioUSD();
      const periodOnly = `${currentDate.getFullYear()}-${currentDate.getMonth()}-${currentQuincena}`;
      const periodKey = `${user.uid}_${periodOnly}`;

      const dispararCelebracion = (monto) => {
        if (!CELEBRA_DISPERSADO) return;
        const id = ++celebraSeqRef.current;
        setCelebracion({ id, monto: Number(monto) || 0 });
        if (celebraTimerRef.current) clearTimeout(celebraTimerRef.current);
        celebraTimerRef.current = setTimeout(() => {
          setCelebracion(prev => (prev && prev.id === id ? null : prev));
        }, CELEBRA_DURACION_MS);
      };
      useEffect(() => () => { if (celebraTimerRef.current) clearTimeout(celebraTimerRef.current); }, []);

      useEffect(() => {
        const unsub = db.collection('sales')
          .where('userId', '==', user.uid)
          .onSnapshot(snap => {
             const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
             docs.sort((a, b) => parseDate(b.fecha).getTime() - parseDate(a.fecha).getTime());

             // Detecta transiciones a "Dispersado" (no en la carga inicial) para el confeti.
             const prev = prevEstatusRef.current;
             if (prev) {
               const recienDispersada = docs.find(d => d.estatus === 'Dispersado' && prev[d.id] && prev[d.id] !== 'Dispersado');
               if (recienDispersada) dispararCelebracion(recienDispersada.monto_dispersado);
             }
             prevEstatusRef.current = Object.fromEntries(docs.map(d => [d.id, d.estatus]));

             setAllSales(docs);
          });
        return () => unsub();
      }, [user.uid]);

      // Registro del agente + control de baja (desactivación) + su categoría.
      useEffect(() => {
        const ref = db.collection('agentes').doc(user.uid);
        ref.set({ email: user.email || '', nombre: (user.email || '').split('@')[0], ultimoAcceso: new Date().toISOString() }, { merge: true }).catch(() => {});
        const unsub = ref.onSnapshot(doc => {
          const d = doc.exists ? doc.data() : {};
          if (d.activo === false) { alert('Tu cuenta fue desactivada. Contacta a tu supervisor.'); auth.signOut(); return; }
          setMiCategoria(d.categoria || '');
        }, () => {});
        return () => unsub();
      }, [user.uid]);

      // Meta propia (la que el usuario edita en "Ajustar Plan").
      useEffect(() => {
        const unsub = db.collection('metas').doc(periodKey).onSnapshot(doc => {
          setSelfMeta(doc.exists ? doc.data() : null);
        }, () => {});
        return () => unsub();
      }, [periodKey]);

      // Metas fijadas por admin: por categoría y global (respaldo).
      useEffect(() => {
        const u1 = db.collection('metas_categoria').doc(periodOnly).onSnapshot(doc => setCatMetaDoc(doc.exists ? doc.data() : null), () => {});
        const u2 = db.collection('metas_globales').doc(periodOnly).onSnapshot(doc => setGlobalMetaDoc(doc.exists ? doc.data() : null), () => {});
        return () => { u1(); u2(); };
      }, [periodOnly]);

      // Resolución de la meta: PROPIA manda; si no, la de su CATEGORÍA; si no, la GLOBAL.
      const metaData = useMemo(() => {
        const tcCat = catMetaDoc && Number(catMetaDoc.tipoCambio);
        const tcGlobal = globalMetaDoc && Number(globalMetaDoc.tipoCambio);
        const tc = (selfMeta && Number(selfMeta.tipoCambio)) || tcCat || tcGlobal || 18;
        if (selfMeta && Number(selfMeta.monto) > 0) return { monto: Number(selfMeta.monto), tipoCambio: Number(selfMeta.tipoCambio) || tc, origen: 'propia' };
        const catMonto = catMetaDoc && catMetaDoc.cats && miCategoria ? Number(catMetaDoc.cats[miCategoria]) : 0;
        if (catMonto > 0) return { monto: catMonto, tipoCambio: tcCat || tc, origen: 'categoria' };
        const gMonto = globalMetaDoc ? Number(globalMetaDoc.monto) : 0;
        if (gMonto > 0) return { monto: gMonto, tipoCambio: tcGlobal || tc, origen: 'global' };
        return { monto: (selfMeta && Number(selfMeta.monto)) || 0, tipoCambio: tc, origen: 'propia' };
      }, [selfMeta, catMetaDoc, globalMetaDoc, miCategoria]);

      const saveMeta = (dataObj) => db.collection('metas').doc(periodKey).set({ ...dataObj, userId: user.uid }, { merge: true });

      const filteredSales = useMemo(() => {
        const viewYear = currentDate.getFullYear();
        const viewMonth = currentDate.getMonth();
        const viewQ = currentQuincena;

        const lastDayOfMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const endDay = viewQ === 1 ? 15 : lastDayOfMonth;
        const viewEnd = new Date(viewYear, viewMonth, endDay, 23, 59, 59);

        let results = allSales.filter(sale => {
          if(!sale.fecha) return false;
          if (sale.estatus === 'Dispersado') {
             const d = parseDate(sale.fecha_dispersion || sale.fecha);
             return d.getFullYear() === viewYear && d.getMonth() === viewMonth && getQuincena(d) === viewQ;
          } 
          else if (sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' || sale.estatus === 'Expirado') {
             const d = parseDate(sale.fecha_resolucion || sale.fecha);
             return d.getFullYear() === viewYear && d.getMonth() === viewMonth && getQuincena(d) === viewQ;
          } 
          else {
             const creationDate = parseDate(sale.fecha);
             return creationDate <= viewEnd;
          }
        }).map(sale => {
             const cDate = parseDate(sale.fecha);
             const cYear = cDate.getFullYear();
             const cMonth = cDate.getMonth();
             const cQ = getQuincena(cDate);
             let isCarry = false;
             if (cYear < viewYear) isCarry = true;
             else if (cYear === viewYear && cMonth < viewMonth) isCarry = true;
             else if (cYear === viewYear && cMonth === viewMonth && cQ < viewQ) isCarry = true;
             return { ...sale, isCarryOver: isCarry };
        });

        if (searchTerm.trim() !== '') {
            const term = searchTerm.toLowerCase();
            results = results.filter(s => 
                (s.folio && s.folio.toLowerCase().includes(term)) || 
                (s.nombre_cliente && s.nombre_cliente.toLowerCase().includes(term))
            );
        }

        return results;

      }, [allSales, currentDate, currentQuincena, searchTerm]);

      // === Leads que necesitan atención (todas las quincenas) ===
      const businessData = getBusinessDaysQuincena(currentDate, currentQuincena);

      const wonCount = filteredSales.filter(s => s.estatus === 'Dispersado').length;
      const lostCount = filteredSales.filter(s => ['Rechazado', 'Cancelado', 'Expirado'].includes(s.estatus)).length;
      const winRate = (wonCount + lostCount) > 0 ? ((wonCount / (wonCount + lostCount)) * 100).toFixed(0) : 0;

      const meta = Number(metaData.monto) || 0;
      const soldAmount = filteredSales.filter(s => s.estatus === 'Dispersado').reduce((acc, curr) => acc + (Number(curr.monto_dispersado) || 0), 0);
      const remainingToMeta = Math.max(0, meta - soldAmount);
      
      const requiredDaily = businessData.remainingDays > 0 ? (remainingToMeta / businessData.remainingDays) : remainingToMeta;
      const originalDailyGoal = businessData.totalBusinessDays > 0 ? (meta / businessData.totalBusinessDays) : 0;
      
      const paceStatus = remainingToMeta === 0 ? 'superado' : (requiredDaily > originalDailyGoal ? 'atrasado' : 'excelente');

      const handleAddSale = async (e) => {
        e.preventDefault();
        const form = e.target;
        const newFolio = form.folio.value.trim();
        const newPhone = form.phone.value.trim();
        const clientName = form.client.value;
        const amount = Number(form.amount.value);
        const newCurp = (form.curp.value || '').trim().toUpperCase();
        const newRfc = (form.rfc.value || '').trim().toUpperCase();
        const newCorreo = (form.correo.value || '').trim();
        const isUpper = form.elements['isUpper']?.checked || false; 

        const isFolioDup = allSales.some(s => s.folio && s.folio.toLowerCase() === newFolio.toLowerCase());
        if (isFolioDup) return setFormError('Error: Este Folio ya existe en tu pipeline.');

        if (newPhone) {
           const isPhoneDup = allSales.some(s => s.telefono === newPhone);
           if (isPhoneDup) return setFormError('Error: Este teléfono ya pertenece a otro cliente.');
        }

        setFormError(''); 

        const saleData = {
          userId: user.uid, 
          agentEmail: user.email,
          folio: newFolio, 
          nombre_cliente: clientName,
          curp: newCurp,
          rfc: newRfc,
          correo: newCorreo,
          monto_preaprobado: amount,
          monto_dispersado: 0,
          estatus: 'Con oferta',
          telefono: newPhone,
          url: form.url.value,
          canal: isUpper ? 'UPPER' : 'Normal',
          fecha: new Date().toISOString(),
          history: [{ date: new Date().toISOString(), action: isUpper ? 'Lead UPPER Creado' : 'Lead Creado', user: 'Agente' }]
        };

        try {
          await db.collection('sales').add(saleData);
          setShowForm(false);
        } catch(err) {
          setFormError('Error al guardar: ' + err.message);
        }
      };

      // === NUEVO: Pegado inteligente — reparte una fila (separada por tabuladores) en sus campos ===
      // Orden esperado de columnas: NOMBRE, CURP, RFC, NUM. FOLIO, TELEFONO, CORREO
      const handleLeadPaste = (e) => {
        const form = e.target.form;
        if (!form) return;
        const lines = e.target.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (!lines.length) return;

        // Ignorar la fila de encabezados si se pegó junto con los datos
        const headerHints = ['nombre', 'curp', 'rfc', 'folio', 'telefono', 'teléfono', 'correo'];
        const dataLine = lines.find(l => {
          const lower = l.toLowerCase();
          return headerHints.filter(h => lower.includes(h)).length < 3;
        }) || lines[0];

        const cols = dataLine.split('\t').map(c => c.trim());
        if (cols.length < 2) return; // no parece el formato por tabuladores

        const [nombre = '', curp = '', rfc = '', folio = '', telefono = '', correo = ''] = cols;
        const setField = (name, value) => { if (form.elements[name] && value !== '') form.elements[name].value = value; };
        setField('folio', folio);
        setField('client', nombre);
        setField('curp', curp.toUpperCase());
        setField('rfc', rfc.toUpperCase());
        setField('phone', telefono);
        setField('correo', correo);
      };

      const handleEditSubmit = async (e) => {
        e.preventDefault();
        const form = e.target;
        const editedFolio = form.folio.value.trim();
        const editedPhone = form.phone.value.trim();

        const isFolioDup = allSales.some(s => s.folio && s.folio.toLowerCase() === editedFolio.toLowerCase() && s.id !== editSaleData.id);
        if (isFolioDup) return setFormError('Error: Ese Folio ya lo tiene otra tarjeta.');

        setFormError('');

        try {
          await db.collection('sales').doc(editSaleData.id).update({
              folio: editedFolio,
              nombre_cliente: form.client.value,
              curp: (form.curp.value || '').trim().toUpperCase(),
              rfc: (form.rfc.value || '').trim().toUpperCase(),
              correo: (form.correo.value || '').trim(),
              monto_preaprobado: Number(form.amount.value), 
              telefono: editedPhone,
              url: form.url.value,
              history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: 'Datos de tarjeta editados', user: 'Agente' })
          });
          setEditSaleData(null);
        } catch(err) {
          setFormError('Error al actualizar: ' + err.message);
        }
      };

      const handleUpdateSale = (id, data) => db.collection('sales').doc(id).update(data).catch(console.error);
      const handleDeleteSale = (id) => db.collection('sales').doc(id).delete().catch(console.error);

      const processStatusChange = async (sale, newStatus) => {
        if (sale.estatus === newStatus) return; 
        
        try {
          if (newStatus === 'Acepta oferta') {
             setRealAmount(sale.monto_preaprobado);
             setAcceptOfferData(sale); 
          } 
          else if (newStatus === 'Dispersado') {
             await handleUpdateSale(sale.id, { 
               estatus: 'Dispersado', 
               monto_dispersado: Number(sale.monto_preaprobado), 
               fecha_dispersion: new Date().toISOString(),
               history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `DISPERSADO AUTOMÁTICO: ${money(sale.monto_preaprobado)}`, user: 'Agente' })
             });
          } 
          else if (newStatus === 'Rechazado' || newStatus === 'Cancelado' || newStatus === 'Expirado') {
             setLostReason(newStatus === 'Expirado' ? 'Oferta expirada' : LOST_REASONS[0]); 
             setLostData({ sale, newStatus }); 
          } 
          else {
             await handleUpdateSale(sale.id, { 
               estatus: newStatus, 
               history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `Estatus: ${newStatus}`, user: 'Agente' }) 
             });
          }
        } catch(err) {
           console.error("Error al cambiar de estatus", err);
        }
      };

      const confirmAcceptOffer = async () => {
         if(!acceptOfferData) return;
         
         const montoInicialRespaldado = acceptOfferData.monto_original || acceptOfferData.monto_preaprobado;

         try {
           await handleUpdateSale(acceptOfferData.id, { 
             estatus: 'Acepta oferta', 
             monto_original: montoInicialRespaldado, 
             monto_preaprobado: Number(realAmount), 
             history: firebase.firestore.FieldValue.arrayUnion({ date: new Date().toISOString(), action: `OFERTA ACEPTADA: ${money(realAmount)} (Línea preaprobada: ${money(montoInicialRespaldado)})`, user: 'Agente' }) 
           });
           setAcceptOfferData(null);
         } catch(err) {
           console.error(err);
         }
      };

      const confirmLostStatus = async () => {
         if(!lostData) return;
         
         try {
           await handleUpdateSale(lostData.sale.id, {
              estatus: lostData.newStatus,
              motivo_perdida: lostReason, 
              fecha_resolucion: new Date().toISOString(),
              history: firebase.firestore.FieldValue.arrayUnion({
                date: new Date().toISOString(), 
                action: `${lostData.newStatus} | Motivo: ${lostReason}`, 
                user: 'Agente' 
              })
           });
           setLostData(null);
         } catch(err) {
           console.error(err);
         }
      };

      const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
      const handleDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };

      const handleDrop = (e, targetStatus) => {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const saleId = e.dataTransfer.getData('saleId');
        const sale = allSales.find(s => s.id === saleId);
        if(sale) processStatusChange(sale, targetStatus);
      };

      const changePeriod = (dir) => {
        if(dir === 1) { if(currentQuincena === 1) setCurrentQuincena(2); else { setCurrentQuincena(1); const d = new Date(currentDate); d.setMonth(d.getMonth() + 1); setCurrentDate(d); } }
        else { if(currentQuincena === 2) setCurrentQuincena(1); else { setCurrentQuincena(2); const d = new Date(currentDate); d.setMonth(d.getMonth() - 1); setCurrentDate(d); } }
      };

      return (
        <div className="flex flex-col h-full bg-[#F2F2F7] relative">

          {/* ===== FIN CELEBRACIÓN ===== */}
          {/* ===== MUNDIAL 2026: franja tricolor animada (eliminar al terminar) ===== */}
          {MUNDIAL.enabled && <div className="mundial-banner h-1 w-full shrink-0"></div>}
          {/* ===== FIN MUNDIAL 2026 ===== */}
          <div className="glass-nav border-b border-[#E5E5EA] text-[#1C1C1E] p-3 flex flex-wrap justify-between items-center z-10 gap-2">

            <div className="flex items-center gap-2 md:gap-4">
              <div className="flex items-center gap-2.5">
                <img src="https://raw.githubusercontent.com/jarodlopez/Ventas-MM/refs/heads/main/1779060689439.jpg" alt="MultiMoney" className="w-9 h-9 rounded-xl object-cover shadow-[0_1px_3px_rgba(0,0,0,0.15)]" />

                   <span className="text-[10px] text-[#8E8E93]">{user.email ? user.email.split('@')[0] : 'Usuario'}</span>
                </div>
              </div>
              {/* ===== MUNDIAL 2026: badge del título (eliminar al terminar) ===== */}
              {MUNDIAL.enabled && (
                <span className="hidden sm:inline-flex items-center gap-1 text-[10px] font-bold text-[#006847] bg-[#34C759]/10 border border-[#34C759]/20 px-2 py-1 rounded-full whitespace-nowrap">
                  <span className="mundial-bounce">{MUNDIAL.trophy}</span>{MUNDIAL.titulo}<span className="mundial-bounce">{MUNDIAL.ball}</span>
                </span>
              )}
              {/* ===== FIN MUNDIAL 2026 ===== */}
              <div className="flex items-center bg-[#F2F2F7] rounded-xl p-0.5">
                <button onClick={() => changePeriod(-1)} className="w-8 h-8 flex items-center justify-center rounded-lg text-[#8E8E93] hover:bg-white hover:text-[#007AFF] transition-colors"><i className="fas fa-chevron-left text-xs"></i></button>
                <div className="flex flex-col items-center w-32">
                    <span className="text-[10px] font-medium uppercase tracking-wide text-[#8E8E93]">{new Intl.DateTimeFormat('es-MX', { month: 'short', year: 'numeric' }).format(currentDate)}</span>
                    <span className="text-sm font-semibold text-[#007AFF]">Q{currentQuincena}</span>
                </div>
                <button onClick={() => changePeriod(1)} className="w-8 h-8 flex items-center justify-center rounded-lg text-[#8E8E93] hover:bg-white hover:text-[#007AFF] transition-colors"><i className="fas fa-chevron-right text-xs"></i></button>
              </div>
            </div>

            <div className="hidden lg:flex flex-1 items-center justify-center gap-3 px-4">

               <div className="flex items-center gap-2 bg-[#F2F2F7] px-3 py-1.5 rounded-xl" title="Porcentaje de negocios ganados vs. los perdidos">
                   <i className="fas fa-bullseye text-[#8E8E93] text-sm"></i>
                   <div className="flex flex-col">
                       <span className="text-[9px] uppercase font-medium text-[#8E8E93] tracking-wide">Tasa de Bateo</span>
                       <span className="text-sm font-semibold text-[#1C1C1E] leading-none">{winRate}%</span>
                   </div>
               </div>

               <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl ${
                   paceStatus === 'superado' ? 'bg-[#34C759]/10' :
                   paceStatus === 'atrasado' ? 'bg-[#FF3B30]/10' :
                   'bg-[#007AFF]/10'
               }`}>
                   <i className={`fas text-sm ${
                       paceStatus === 'superado' ? 'fa-trophy text-[#34C759]' :
                       paceStatus === 'atrasado' ? 'fa-fire-alt text-[#FF3B30] animate-pulse' :
                       'fa-tachometer-alt text-[#007AFF]'

                   <div className="flex flex-col">
                       <span className={`text-[9px] uppercase font-medium tracking-wide ${
                           paceStatus === 'superado' ? 'text-[#34C759]' : paceStatus === 'atrasado' ? 'text-[#FF3B30]' : 'text-[#007AFF]'

                   onChange={(e) => setSearchTerm(e.target.value)}

                      <i className="fas fa-times-circle text-sm"></i>
                   </button>
                 )}
               </div>
            </div>

            <div className="flex gap-2 items-center">
              <a href="reports.html" className="bg-[#007AFF] text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-[#0070E0] active:scale-[0.97] transition-all"><i className="fas fa-table md:mr-2"></i><span className="hidden md:inline">Reportes</span></a>

          <div className="flex-1 overflow-x-auto p-4 flex gap-4 pipeline-scroll items-start">
             {PIPELINE_STATUSES.map(status => {
               const statusSales = filteredSales.filter(s => s.estatus === status);
               const statusTotal = statusSales.reduce((acc, s) => acc + (Number(status === 'Dispersado' ? s.monto_dispersado : s.monto_preaprobado) || 0), 0);
               return (
               <div
                 key={status}
                 onDragOver={handleDragOver}
                 onDragLeave={handleDragLeave}
                 onDrop={(e) => handleDrop(e, status)}

               >
                 <div className="px-4 py-3 flex justify-between items-start gap-2">
                   <div className="flex flex-col min-w-0">
                     <span className="font-semibold text-[#3A3A3C] text-sm leading-tight truncate">{status}</span>
                     <span className="text-[11px] text-[#8E8E93] font-medium mt-0.5">{money(statusTotal)}</span>
                   </div>
                   <span className="bg-white text-[#8E8E93] px-2 py-0.5 rounded-full text-xs font-medium shadow-[0_1px_2px_rgba(0,0,0,0.06)] shrink-0">{statusSales.length}</span>
                 </div>
                 <div className="flex-1 overflow-y-auto px-2 pb-20">
                   {statusSales.map(sale => (
                     <SaleCard
                       key={sale.id}
                       sale={sale}
                       updateSale={handleUpdateSale}
                       deleteSale={handleDeleteSale}
                       onStatusChange={processStatusChange}
                       onEdit={(saleToEdit) => { setEditSaleData(saleToEdit); setFormError(''); }}
                     />
                   ))}
                   {searchTerm && statusSales.length === 0 && (
                     <p className="text-center text-xs text-[#AEAEB2] mt-4">Sin resultados</p>
                   )}
                 </div>
               </div>
               );
             })}
          </div>

          {acceptOfferData && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] w-full max-w-sm">
                <h3 className="font-semibold text-lg mb-1 text-[#007AFF]">Oferta Aceptada</h3>
                <p className="text-xs text-[#8E8E93] mb-4 leading-relaxed">El cliente <strong className="text-[#3A3A3C]">{acceptOfferData.nombre_cliente}</strong> aceptó. La línea preaprobada original era de <strong className="text-[#3A3A3C]">{money(acceptOfferData.monto_original || acceptOfferData.monto_preaprobado)}</strong>. ¿Por qué monto se cerró finalmente?</p>
                <input type="number" value={realAmount} onChange={(e) => setRealAmount(e.target.value)} className="w-full bg-[#F2F2F7] border border-transparent rounded-xl px-4 py-3 text-xl font-semibold mb-4 focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" autoFocus />
                <div className="flex gap-2">
                  <button onClick={confirmAcceptOffer} className="flex-1 bg-[#007AFF] text-white py-2.5 rounded-xl font-semibold hover:bg-[#0070E0] active:scale-[0.98] transition-all">Confirmar Cierre</button>
                  <button onClick={() => setAcceptOfferData(null)} className="flex-1 bg-[#E5E5EA] text-[#1C1C1E] py-2.5 rounded-xl font-medium hover:bg-[#D1D1D6] active:scale-[0.98] transition-all">Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {lostData && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] w-full max-w-sm">
                <h3 className="font-semibold text-lg mb-1 text-[#FF3B30]">Mover a {lostData.newStatus}</h3>
                <p className="text-xs text-[#8E8E93] mb-4 leading-relaxed">Para mantener la base de datos limpia, por favor indica por qué se perdió esta oportunidad.</p>

                <label className="block text-[11px] font-medium text-[#8E8E93] mb-1">Motivo Principal</label>
                <div className="relative mb-6">
                  <select
                    value={lostReason}
                    onChange={(e) => setLostReason(e.target.value)}
                    className="w-full bg-[#F2F2F7] border border-transparent rounded-xl px-4 py-3 pr-9 outline-none focus:bg-white focus:border-[#FF3B30] font-medium appearance-none transition-colors"
                  >
                    {LOST_REASONS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <i className="fas fa-chevron-down text-[#C7C7CC] text-xs absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                </div>

                <div className="flex gap-2">
                  <button onClick={confirmLostStatus} className="flex-1 bg-[#FF3B30] text-white py-2.5 rounded-xl font-semibold hover:bg-[#E0352B] active:scale-[0.98] transition-all">Guardar</button>
                  <button onClick={() => setLostData(null)} className="flex-1 bg-[#E5E5EA] text-[#1C1C1E] py-2.5 rounded-xl font-medium hover:bg-[#D1D1D6] active:scale-[0.98] transition-all">Cancelar</button>
                </div>
              </div>
            </div>
          )}

          {showForm && (
            <div className="fixed inset-0 glass-modal z-50 flex items-center justify-center p-4">
              <form onSubmit={handleAddSale} className="bg-white rounded-3xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] w-full max-w-sm p-6 space-y-3 max-h-[90vh] overflow-y-auto">
                 <h2 className="font-semibold text-xl tracking-tight">Nuevo Lead</h2>

                 {formError && <div className="bg-[#FF3B30]/10 text-[#FF3B30] p-3 rounded-xl text-xs font-semibold"><i className="fas fa-exclamation-circle mr-1"></i>{formError}</div>}

                 {/* === Pegado rápido desde Excel/Sheets === */}
                 <div className="bg-[#34C759]/10 rounded-2xl p-3">
                    <label className="text-[11px] font-semibold text-[#2E9E4F] flex items-center gap-1.5 mb-1.5">
                      <i className="fas fa-bolt"></i> Pegado rápido
                    </label>
                    <textarea
                      onChange={handleLeadPaste}
                      rows={2}
                      placeholder="Pega aquí la fila copiada y los campos se llenan solos."
                      className="w-full bg-white border border-[#34C759]/20 rounded-xl p-2.5 text-xs font-mono focus:outline-none focus:border-[#34C759] resize-none"
                    />
                    <p className="text-[10px] text-[#2E9E4F] mt-1.5 leading-tight">
                      Orden: NOMBRE · CURP · RFC · FOLIO · TELÉFONO · CORREO (separados por tabulador). El monto y el enlace de Hubspot se capturan a mano.
                    </p>
                 </div>

                 <input name="folio" required placeholder="Número de Folio" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] font-mono transition-colors" />
                 <input name="client" required placeholder="Nombre Cliente" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
                 <div className="grid grid-cols-2 gap-2">
                    <input name="curp" placeholder="CURP" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] font-mono text-xs uppercase transition-colors" />
                    <input name="rfc" placeholder="RFC" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] font-mono text-xs uppercase transition-colors" />
                 </div>
                 <input name="phone" placeholder="Teléfono" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
                 <input name="correo" type="email" placeholder="Correo" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
                 <input name="amount" type="number" required placeholder="Monto Preaprobado ($)" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />
                 <input name="url" placeholder="Enlace a Hubspot" className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl focus:outline-none focus:bg-white focus:border-[#007AFF] transition-colors" />

                 <label htmlFor="isUpper" className="bg-[#5856D6]/10 p-3 rounded-2xl flex items-center gap-3 cursor-pointer hover:bg-[#5856D6]/15 transition-colors">

                 <div><label className="text-[10px] font-medium text-[#8E8E93] uppercase tracking-wide">Teléfono</label>
                 <input name="phone" defaultValue={editSaleData.telefono} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl mt-1 focus:outline-none focus:bg-white focus:border-[#007AFF] text-sm transition-colors" /></div>

                 <div><label className="text-[10px] font-medium text-[#8E8E93] uppercase tracking-wide">Correo</label>
                 <input name="correo" type="email" defaultValue={editSaleData.correo || ''} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl mt-1 focus:outline-none focus:bg-white focus:border-[#007AFF] text-sm transition-colors" /></div>

                 <div><label className="text-[10px] font-medium text-[#8E8E93] uppercase tracking-wide">Enlace a Hubspot</label>
                 <input name="url" defaultValue={editSaleData.url} className="w-full bg-[#F2F2F7] border border-transparent px-4 py-2.5 rounded-xl mt-1 focus:outline-none focus:bg-white focus:border-[#007AFF] text-sm transition-colors" /></div>

                 <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 bg-[#007AFF] text-white py-3 rounded-xl font-semibold hover:bg-[#0070E0] active:scale-[0.98] transition-all">Actualizar</button>
                    <button type="button" onClick={() => setEditSaleData(null)} className="flex-1 bg-[#E5E5EA] text-[#1C1C1E] py-3 rounded-xl font-medium hover:bg-[#D1D1D6] active:scale-[0.98] transition-all">Cancelar</button>
                 </div>
              </form>
            </div>
          )}

          <PlanningModal isOpen={isPlanningOpen} onClose={() => setIsPlanningOpen(false)} metaData={metaData} setMetaData={saveMeta} businessData={businessData} year={currentDate.getFullYear()} month={currentDate.getMonth()} quincena={currentQuincena} />
        </div>
      );
    };

    const MainWrapper = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          setUser(u);
          setLoadingAuth(false);
        });
      }, []);

      if (loadingAuth) return (
        <div className="h-screen bg-[#F2F2F7] flex flex-col justify-center items-center text-[#1C1C1E]">
          <div className="loader mb-4"></div>
          <p className="font-medium text-[#8E8E93]">Verificando seguridad...</p>
        </div>
      );
      
      if (!user) return <Login />;
      return <App user={user} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainWrapper />);
  </script>
</body>
</html>
