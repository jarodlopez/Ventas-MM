<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM - Panel de BI y Supervisión</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #8b5cf6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">
  
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAAETou6DhYIJJ8cxI13BU1p_l3yGPMilA",
      authDomain: "ventas-ebd49.firebaseapp.com",
      projectId: "ventas-ebd49",
      storageBucket: "ventas-ebd49.firebasestorage.app",
      messagingSenderId: "907042495792",
      appId: "1:907042495792:web:6827da0b73333496f6bcf5"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const parseDate = (input) => {
      if (!input) return new Date();
      if (input.toDate) return input.toDate();
      return new Date(input);
    };

    const money = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val);
    const formatDate = (input) => new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }).format(parseDate(input));

    // Función segura para sacar el nombre del Agente
    const getAgentName = (sale) => {
       if (sale.agentEmail) return sale.agentEmail.split('@')[0];
       if (sale.userId) return 'Agente_' + String(sale.userId).substring(0, 4);
       return 'Sin Asignar';
    };

    const CATS_DEFAULT = ["Vendedor", "Closer", "Depurador"];

    // ===== Panel de Administración: usuarios, categorías/roles y metas =====
    const AdminPanel = ({ allSales, vista }) => {
      const [agentes, setAgentes] = useState([]);
      const [categorias, setCategorias] = useState(CATS_DEFAULT);
      const [nuevaCat, setNuevaCat] = useState('');
      const [metaMonth, setMetaMonth] = useState(new Date());
      const [metaQ, setMetaQ] = useState(new Date().getDate() <= 15 ? 1 : 2);
      const [globalMeta, setGlobalMeta] = useState(null);
      const [catMeta, setCatMeta] = useState(null);
      const [form, setForm] = useState({ tipoCambio: 18, global: '', cats: {} });

      const metaPeriod = `${metaMonth.getFullYear()}-${metaMonth.getMonth()}-${metaQ}`;

      useEffect(() => db.collection('agentes').onSnapshot(s => setAgentes(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => {}), []);
      useEffect(() => {
        const ref = db.collection('config').doc('categorias');
        return ref.onSnapshot(doc => {
          if (doc.exists && Array.isArray(doc.data().lista)) setCategorias(doc.data().lista);
          else ref.set({ lista: CATS_DEFAULT }, { merge: true }).catch(() => {});
        }, () => {});
      }, []);
      useEffect(() => {
        const u1 = db.collection('metas_globales').doc(metaPeriod).onSnapshot(d => setGlobalMeta(d.exists ? d.data() : null), () => {});
        const u2 = db.collection('metas_categoria').doc(metaPeriod).onSnapshot(d => setCatMeta(d.exists ? d.data() : null), () => {});
        return () => { u1(); u2(); };
      }, [metaPeriod]);
      useEffect(() => {
        setForm({
          tipoCambio: (globalMeta && globalMeta.tipoCambio) || (catMeta && catMeta.tipoCambio) || 18,
          global: globalMeta && globalMeta.monto ? String(globalMeta.monto) : '',
          cats: (catMeta && catMeta.cats) ? { ...catMeta.cats } : {},
        });
      }, [metaPeriod, globalMeta, catMeta]);

      if (vista !== 'admin') return null;

      const agentesMap = {};
      agentes.forEach(a => { agentesMap[a.id] = { ...a }; });
      allSales.forEach(s => { if (s.userId && !agentesMap[s.userId]) agentesMap[s.userId] = { id: s.userId, email: s.agentEmail || '', nombre: getAgentName(s) }; });
      const listaAgentes = Object.values(agentesMap).sort((a, b) => (a.email || '').localeCompare(b.email || ''));

      const ultimaActividad = (uid) => {
        const f = allSales.filter(s => s.userId === uid).map(s => parseDate(s.fecha).getTime());
        return f.length ? new Date(Math.max.apply(null, f)) : null;
      };

      const setCategoria = (a, cat) => db.collection('agentes').doc(a.id).set({ email: a.email || '', categoria: cat }, { merge: true });
      const toggleActivo = (a) => db.collection('agentes').doc(a.id).set({ email: a.email || '', activo: a.activo === false }, { merge: true });
      const addCat = () => { const c = nuevaCat.trim(); if (!c || categorias.includes(c)) { setNuevaCat(''); return; } db.collection('config').doc('categorias').set({ lista: firebase.firestore.FieldValue.arrayUnion(c) }, { merge: true }); setNuevaCat(''); };
      const removeCat = (c) => db.collection('config').doc('categorias').set({ lista: firebase.firestore.FieldValue.arrayRemove(c) }, { merge: true });
      const guardarMetas = () => {
        const tc = Number(form.tipoCambio) || 18;
        db.collection('metas_globales').doc(metaPeriod).set({ monto: Number(form.global) || 0, tipoCambio: tc }, { merge: true });
        const cats = {};
        categorias.forEach(c => { cats[c] = Number(form.cats[c]) || 0; });
        db.collection('metas_categoria').doc(metaPeriod).set({ cats, tipoCambio: tc }, { merge: true });
        alert('Metas guardadas para ' + metaPeriod);
      };
      const cambiarPeriodo = (dir) => {
        if (dir === 1) { if (metaQ === 1) setMetaQ(2); else { setMetaQ(1); const d = new Date(metaMonth); d.setMonth(d.getMonth() + 1); setMetaMonth(d); } }
        else { if (metaQ === 2) setMetaQ(1); else { setMetaQ(2); const d = new Date(metaMonth); d.setMonth(d.getMonth() - 1); setMetaMonth(d); } }
      };

      return (
        <div className="flex-1 overflow-y-auto p-6 flex flex-col gap-6 max-w-6xl mx-auto w-full">
          {/* METAS */}
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm">
            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center flex-wrap gap-3">
              <h2 className="font-bold text-slate-700"><i className="fas fa-bullseye mr-2 text-purple-500"></i>Metas del periodo</h2>
              <div className="flex items-center gap-2">
                <button onClick={() => cambiarPeriodo(-1)} className="w-8 h-8 rounded bg-slate-100 hover:bg-slate-200 text-slate-600"><i className="fas fa-chevron-left"></i></button>
                <span className="font-bold text-sm text-slate-700 w-44 text-center capitalize">{new Intl.DateTimeFormat('es-MX', { month: 'long', year: 'numeric' }).format(metaMonth)} · Q{metaQ}</span>
                <button onClick={() => cambiarPeriodo(1)} className="w-8 h-8 rounded bg-slate-100 hover:bg-slate-200 text-slate-600"><i className="fas fa-chevron-right"></i></button>
              </div>
            </div>
            <div className="p-4 grid md:grid-cols-2 gap-6">
              <div>
                <label className="text-xs font-bold text-slate-500 uppercase">Meta Global (MXN)</label>
                <input type="number" value={form.global} onChange={e => setForm({ ...form, global: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2 mt-1 outline-none focus:border-purple-500" placeholder="0" />
                <label className="text-xs font-bold text-slate-500 uppercase mt-3 block">Tipo de cambio (MXN/USD)</label>
                <input type="number" step="0.01" value={form.tipoCambio} onChange={e => setForm({ ...form, tipoCambio: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2 mt-1 outline-none focus:border-purple-500" />
                <p className="text-[11px] text-slate-400 mt-2">La meta global aplica como respaldo a quien no tenga meta propia ni de categoría.</p>
              </div>
              <div>
                <label className="text-xs font-bold text-slate-500 uppercase">Meta por categoría (MXN)</label>
                <div className="mt-1 flex flex-col gap-2">
                  {categorias.map(c => (
                    <div key={c} className="flex items-center gap-2">
                      <span className="text-sm font-semibold text-slate-700 w-28 truncate">{c}</span>
                      <input type="number" value={form.cats[c] || ''} onChange={e => setForm({ ...form, cats: { ...form.cats, [c]: e.target.value } })} className="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:border-purple-500" placeholder="0" />
                    </div>
                  ))}
                  {categorias.length === 0 && <p className="text-slate-400 text-sm">Agrega categorías abajo.</p>}
                </div>
              </div>
            </div>
            <div className="p-4 border-t border-slate-200 flex justify-end">
              <button onClick={guardarMetas} className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2 rounded-lg transition-colors"><i className="fas fa-save mr-2"></i>Guardar metas del periodo</button>
            </div>
          </div>

          {/* CATEGORÍAS */}
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm">
            <div className="p-4 border-b border-slate-200 bg-slate-50"><h2 className="font-bold text-slate-700"><i className="fas fa-tags mr-2 text-purple-500"></i>Categorías / Roles</h2></div>
            <div className="p-4 flex flex-wrap gap-2 items-center">
              {categorias.map(c => (
                <span key={c} className="inline-flex items-center gap-2 bg-purple-50 text-purple-700 border border-purple-200 rounded-full px-3 py-1 text-sm font-bold">
                  {c}<button onClick={() => removeCat(c)} className="text-purple-400 hover:text-red-500"><i className="fas fa-times"></i></button>
                </span>
              ))}
              <div className="flex items-center gap-2 ml-2">
                <input value={nuevaCat} onChange={e => setNuevaCat(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addCat(); }} placeholder="Nueva categoría" className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-purple-500" />
                <button onClick={addCat} className="bg-slate-800 hover:bg-slate-700 text-white rounded-lg px-3 py-1.5 text-sm font-bold"><i className="fas fa-plus"></i></button>
              </div>
            </div>
          </div>

          {/* USUARIOS */}
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm">
            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
              <h2 className="font-bold text-slate-700"><i className="fas fa-users mr-2 text-purple-500"></i>Usuarios</h2>
              <span className="text-xs font-bold bg-purple-100 text-purple-700 px-3 py-1 rounded-full">{listaAgentes.length}</span>
            </div>
            <div className="overflow-auto">
              <table className="w-full text-left min-w-max">
                <thead className="bg-white border-b"><tr>
                  <th className="py-2 px-4 text-xs font-bold text-slate-500 uppercase">Usuario</th>
                  <th className="py-2 px-4 text-xs font-bold text-slate-500 uppercase">Categoría</th>
                  <th className="py-2 px-4 text-xs font-bold text-slate-500 uppercase">Última actividad</th>
                  <th className="py-2 px-4 text-xs font-bold text-slate-500 uppercase text-center">Estado</th>
                  <th className="py-2 px-4 text-xs font-bold text-slate-500 uppercase text-right">Acción</th>
                </tr></thead>
                <tbody className="divide-y divide-slate-100">
                  {listaAgentes.map(a => {
                    const act = a.activo !== false;
                    const ult = ultimaActividad(a.id);
                    return (
                      <tr key={a.id} className={act ? '' : 'bg-red-50/60'}>
                        <td className="py-2 px-4"><div className="font-bold text-sm text-slate-800">{a.nombre || (a.email || '').split('@')[0] || 'Sin nombre'}</div><div className="text-[11px] text-slate-400">{a.email}</div></td>
                        <td className="py-2 px-4">
                          <select value={a.categoria || ''} onChange={e => setCategoria(a, e.target.value)} className="border border-slate-300 rounded-lg px-2 py-1 text-sm outline-none focus:border-purple-500">
                            <option value="">— sin categoría —</option>
                            {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </td>
                        <td className="py-2 px-4 text-xs text-slate-500">{ult ? formatDate(ult) : 'Sin ventas'}</td>
                        <td className="py-2 px-4 text-center"><span className={`text-[10px] font-bold px-2 py-1 rounded-full ${act ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{act ? 'Activo' : 'Inactivo'}</span></td>
                        <td className="py-2 px-4 text-right">
                          <button onClick={() => toggleActivo(a)} className={`text-xs font-bold px-3 py-1.5 rounded-lg transition-colors ${act ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-green-100 text-green-700 hover:bg-green-200'}`}>{act ? 'Dar de baja' : 'Reactivar'}</button>
                        </td>
                      </tr>
                    );
                  })}
                  {listaAgentes.length === 0 && <tr><td colSpan="5" className="py-8 text-center text-slate-400 font-bold">Sin usuarios aún.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ user }) => {
      const [allSales, setAllSales] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isAdmin, setIsAdmin] = useState(true); 
      
      const [selectedAgent, setSelectedAgent] = useState('Todos');
      const [vista, setVista] = useState('bi'); // 'bi' | 'admin'

      useEffect(() => {
        const unsub = db.collection('sales')
          .orderBy('fecha', 'desc')
          .onSnapshot(
            snap => {
               const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
               setAllSales(docs);
               setLoading(false);
            },
            error => {
               console.error("Error de permisos:", error);
               setIsAdmin(false);
               setLoading(false);
            }
          );
        return () => unsub();
      }, []);

      const agentList = useMemo(() => {
        const names = allSales.map(getAgentName);
        return ['Todos', ...new Set(names)].sort();
      }, [allSales]);

      const filteredSales = useMemo(() => {
        if (selectedAgent === 'Todos') return allSales;
        return allSales.filter(s => getAgentName(s) === selectedAgent);
      }, [allSales, selectedAgent]);

      const totalDispersed = filteredSales.filter(s => s.estatus === 'Dispersado').reduce((acc, s) => acc + (Number(s.monto_dispersado) || 0), 0);
      const totalPipeline = filteredSales.filter(s => !['Dispersado','Rechazado','Cancelado'].includes(s.estatus)).reduce((acc, s) => acc + (Number(s.monto_preaprobado) || 0), 0);
      const totalActiveLeads = filteredSales.filter(s => !['Dispersado','Rechazado','Cancelado'].includes(s.estatus)).length;

      // Data para Gráfico Nativo de Estatus
      const chartStatusData = useMemo(() => {
         const counts = {};
         filteredSales.forEach(s => {
            counts[s.estatus || 'Sin Estatus'] = (counts[s.estatus || 'Sin Estatus'] || 0) + 1;
         });
         return Object.keys(counts).map(key => ({ name: key, Leads: counts[key] })).sort((a,b) => b.Leads - a.Leads);
      }, [filteredSales]);
      const maxStatusLeads = Math.max(...chartStatusData.map(d => d.Leads), 1);

      // Data para Gráfico Nativo de Agentes
      const chartAgentData = useMemo(() => {
         const totals = {};
         allSales.filter(s => s.estatus === 'Dispersado').forEach(s => {
            const name = getAgentName(s);
            totals[name] = (totals[name] || 0) + (Number(s.monto_dispersado) || 0);
         });
         return Object.keys(totals).map(key => ({ name: key, value: totals[key] })).sort((a,b) => b.value - a.value);
      }, [allSales]);
      const maxAgentMonto = Math.max(...chartAgentData.map(d => d.value), 1);

      const COLORS = ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#64748b'];

      const exportToCSV = () => {
         const headers = ["Fecha", "Folio", "Cliente", "Telefono", "Agente", "Estatus", "Preaprobado", "Dispersado", "Motivo Perdida"];
         const rows = filteredSales.map(s => [
            formatDate(s.fecha).replace(',', ''),
            s.folio || 'N/A', 
            `"${s.nombre_cliente || ''}"`, 
            s.telefono || '', 
            getAgentName(s),
            s.estatus || '', 
            s.monto_preaprobado || 0, 
            s.monto_dispersado || 0,
            s.motivo_perdida || ''
         ]);
         const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
         const encodedUri = encodeURI(csvContent);
         const link = document.createElement("a");
         link.setAttribute("href", encodedUri);
         link.setAttribute("download", `Data_Ventas_${selectedAgent}_${new Date().getTime()}.csv`);
         document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      if (!isAdmin) {
         return (
            <div className="h-screen flex flex-col items-center justify-center bg-slate-900 text-white p-6 text-center">
               <i className="fas fa-lock text-6xl text-red-500 mb-4"></i>
               <h1 className="text-3xl font-bold mb-2">Acceso Denegado</h1>
               <p className="text-slate-400 max-w-md">No tienes los privilegios de Supervisor.</p>
               <button onClick={() => window.location.replace("index.html")} className="mt-6 bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-700">Volver al Tablero</button>
            </div>
         );
      }

      if (loading) return <div className="h-screen flex justify-center items-center font-bold text-slate-400 bg-slate-900"><div className="loader mr-4"></div> Generando BI Dashboard...</div>;

      return (
        <div className="flex flex-col h-full bg-slate-50">
          
          <div className="bg-purple-900 text-white p-4 flex flex-wrap justify-between items-center shadow z-10 shrink-0 gap-4">
            <div className="flex items-center gap-3">
              <i className="fas fa-chart-pie text-purple-400 text-3xl"></i>
              <div>
                 <h1 className="font-bold text-xl leading-none">Panel de Supervisor</h1>
                 <span className="text-xs text-purple-300">MultiMoney</span>
              </div>
              <div className="flex items-center gap-1 bg-purple-800 rounded-lg p-1 ml-2">
                 <button onClick={() => setVista('bi')} className={`px-3 py-1.5 rounded text-sm font-bold transition-colors ${vista === 'bi' ? 'bg-white text-purple-900' : 'text-purple-200 hover:bg-purple-700'}`}><i className="fas fa-chart-pie md:mr-1.5"></i><span className="hidden md:inline">BI</span></button>
                 <button onClick={() => setVista('admin')} className={`px-3 py-1.5 rounded text-sm font-bold transition-colors ${vista === 'admin' ? 'bg-white text-purple-900' : 'text-purple-200 hover:bg-purple-700'}`}><i className="fas fa-users-gear md:mr-1.5"></i><span className="hidden md:inline">Administración</span></button>
              </div>
            </div>

            {vista === 'bi' && (
            <div className="flex items-center gap-4 bg-purple-800 p-2 rounded-lg border border-purple-700">
               <div className="flex items-center gap-2">
                 <i className="fas fa-filter text-purple-300"></i>
                 <select
                   value={selectedAgent}
                   onChange={e => setSelectedAgent(e.target.value)}
                   className="bg-white text-slate-800 text-sm font-bold px-3 py-1.5 rounded outline-none w-48"
                 >
                   {agentList.map(agent => <option key={agent} value={agent}>{agent === 'Todos' ? 'Empresa Global' : agent}</option>)}
                 </select>
               </div>
            </div>
            )}

            <div className="flex gap-2">
               {vista === 'bi' && (
               <button onClick={exportToCSV} className="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-bold flex items-center transition-colors shadow-lg">
                 <i className="fas fa-file-excel mr-2"></i><span className="hidden md:inline">Descargar CSV</span>
               </button>
               )}
               <button onClick={() => window.location.replace("index.html")} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded text-sm font-bold flex items-center transition-colors shadow-lg">
                 <i className="fas fa-arrow-left md:mr-2"></i><span className="hidden md:inline">Salir</span>
               </button>
            </div>
          </div>

          <div className={`flex-1 overflow-y-auto p-6 flex flex-col gap-6 max-w-7xl mx-auto w-full ${vista === 'bi' ? '' : 'hidden'}`}>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
               <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-green-500">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Volumen Dispersado</p>
                  <p className="text-3xl font-black text-green-600">{money(totalDispersed)}</p>
               </div>
               <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-blue-500">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Pipeline Vivo</p>
                  <p className="text-3xl font-black text-blue-600">{money(totalPipeline)}</p>
               </div>
               <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-purple-500">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Leads en Gestión</p>
                  <p className="text-3xl font-black text-purple-700">{totalActiveLeads}</p>
               </div>
            </div>

            {/* GRÁFICOS NATIVOS A PRUEBA DE CRASHES */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 shrink-0">
              
              {/* Gráfico de Estatus */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                 <h2 className="font-bold text-slate-700 mb-4 text-sm"><i className="fas fa-chart-bar mr-2 text-blue-500"></i>Concentración de Leads por Estatus</h2>
                 <div className="flex flex-col gap-3">
                   {chartStatusData.map((data, i) => (
                     <div key={data.name}>
                       <div className="flex justify-between text-xs mb-1">
                         <span className="font-bold text-slate-700 uppercase">{data.name}</span>
                         <span className="text-slate-500 font-bold">{data.Leads} Leads</span>
                       </div>
                       <div className="w-full bg-slate-100 rounded-full h-3">
                         <div className="h-3 rounded-full transition-all duration-1000" style={{ width: `${(data.Leads / maxStatusLeads) * 100}%`, backgroundColor: COLORS[i % COLORS.length] }}></div>
                       </div>
                     </div>
                   ))}
                   {chartStatusData.length === 0 && <p className="text-slate-400 text-sm text-center py-4">Sin datos de estatus</p>}
                 </div>
              </div>

              {/* Gráfico de Agentes */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative">
                 <h2 className="font-bold text-slate-700 mb-4 text-sm"><i className="fas fa-trophy mr-2 text-yellow-500"></i>Top Dispersión por Agente</h2>
                 {selectedAgent !== 'Todos' ? (
                    <div className="absolute inset-0 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-xl z-10">
                       <p className="text-slate-600 font-bold text-sm bg-white px-5 py-2 rounded-full shadow border"><i className="fas fa-info-circle mr-2 text-blue-500"></i>Filtra por "Empresa Global" para ver el ranking</p>
                    </div>
                 ) : null}
                 
                 <div className="flex flex-col gap-3">
                   {chartAgentData.map((data, i) => (
                     <div key={data.name}>
                       <div className="flex justify-between text-xs mb-1">
                         <span className="font-bold text-slate-700">{data.name}</span>
                         <span className="text-green-600 font-bold">{money(data.value)}</span>
                       </div>
                       <div className="w-full bg-slate-100 rounded-full h-3">
                         <div className="h-3 rounded-full transition-all duration-1000" style={{ width: `${(data.value / maxAgentMonto) * 100}%`, backgroundColor: '#10b981' }}></div>
                       </div>
                     </div>
                   ))}
                   {chartAgentData.length === 0 && <p className="text-slate-400 text-sm text-center py-4">Nadie ha dispersado aún</p>}
                 </div>
              </div>

            </div>

            <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex-1 flex flex-col min-h-[400px]">
               <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                  <h2 className="font-bold text-slate-700"><i className="fas fa-table mr-2 text-slate-500"></i>Tabla de Datos Filtrada</h2>
                  <span className="text-xs font-bold bg-purple-100 text-purple-700 px-3 py-1 rounded-full">{filteredSales.length} Registros</span>
               </div>
               <div className="overflow-auto flex-1">
                 <table className="w-full text-left border-collapse min-w-max">
                   <thead className="bg-white sticky top-0 z-10 shadow-sm">
                     <tr>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase border-b">Fecha / Folio</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase border-b">Cliente</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase border-b">Agente</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase border-b">Estatus</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right border-b">Preaprobado</th>
                     </tr>
                   </thead>
                   <tbody className="divide-y divide-slate-100">
                     {filteredSales.map(sale => (
                       <tr key={sale.id} className="hover:bg-slate-50 transition-colors">
                         <td className="py-3 px-4">
                           <div className="font-mono text-xs font-bold text-slate-700">{sale.folio || 'Sin Folio'}</div>
                           <div className="text-[10px] text-slate-400">{formatDate(sale.fecha)}</div>
                         </td>
                         <td className="py-3 px-4">
                           <div className="font-bold text-sm text-slate-800">{sale.nombre_cliente}</div>
                           {sale.telefono && <div className="text-[10px] text-slate-500 mt-1"><i className="fas fa-phone mr-1"></i>{sale.telefono}</div>}
                         </td>
                         <td className="py-3 px-4">
                           <span className="text-xs font-bold text-purple-700 bg-purple-50 px-2 py-1 rounded-md border border-purple-100">
                             {getAgentName(sale)}
                           </span>
                         </td>
                         <td className="py-3 px-4">
                           <span className={`px-2 py-1 rounded text-[10px] font-bold uppercase ${sale.estatus === 'Dispersado' ? 'bg-green-100 text-green-700' : sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                             {sale.estatus || 'Sin estatus'}
                           </span>
                           {sale.motivo_perdida && <div className="text-[10px] text-red-500 mt-1 font-medium truncate max-w-[120px]" title={sale.motivo_perdida}>{sale.motivo_perdida}</div>}
                         </td>
                         <td className="py-3 px-4 text-right font-bold text-sm text-slate-600">
                           {money(sale.monto_preaprobado)}
                           {sale.estatus === 'Dispersado' && <div className="text-[10px] text-green-600 mt-1">Disp: {money(sale.monto_dispersado)}</div>}
                         </td>
                       </tr>
                     ))}
                     {filteredSales.length === 0 && (
                        <tr><td colSpan="5" className="py-8 text-center text-slate-400 font-bold">No hay registros para este filtro.</td></tr>
                     )}
                   </tbody>
                 </table>
               </div>
            </div>

          </div>

          <AdminPanel allSales={allSales} vista={vista} />
        </div>
      );
    };

    const MainWrapper = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          if (!u) window.location.replace("index.html");
          else { setUser(u); setLoadingAuth(false); }
        });
      }, []);

      if (loadingAuth) return <div className="h-screen bg-slate-900 flex justify-center items-center text-white font-bold"><div className="loader mr-4"></div>Verificando seguridad...</div>;
      
      return <AdminDashboard user={user} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainWrapper />);
  </script>
</body>
</html>
