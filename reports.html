<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Ventas - Reportes Multi-Agente</title>
  <link rel="icon" href="https://raw.githubusercontent.com/jarodlopez/Ventas-MM/refs/heads/main/1779060689439.jpg" type="image/jpeg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">
  
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAAETou6DhYIJJ8cxI13BU1p_l3yGPMilA",
      authDomain: "ventas-ebd49.firebaseapp.com",
      projectId: "ventas-ebd49",
      storageBucket: "ventas-ebd49.firebasestorage.app",
      messagingSenderId: "907042495792",
      appId: "1:907042495792:web:6827da0b73333496f6bcf5"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const PIPELINE_STATUSES = ["Con oferta", "Acepta oferta", "Long track", "Dispersado", "Rechazado", "Cancelado"];

    const parseDate = (input) => {
      if (!input) return new Date();
      if (input.toDate) return input.toDate();
      return new Date(input);
    };

    const money = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(val);
    const formatDate = (input) => new Intl.DateTimeFormat('es-MX', { day: '2-digit', month: 'short', year: 'numeric', hour:'2-digit', minute:'2-digit' }).format(parseDate(input));

    // Función segura para comparar fechas ignorando la zona horaria (evita que el 1 de marzo se lea como 28 de febrero)
    const getFilterDate = (dateString) => {
        if (!dateString) return null;
        const [year, month, day] = dateString.split('-');
        return new Date(year, month - 1, day);
    };

    const App = ({ user }) => {
      const [allSales, setAllSales] = useState([]);
      const [loading, setLoading] = useState(true);

      const [searchTerm, setSearchTerm] = useState("");
      const [statusFilter, setStatusFilter] = useState("Todos");
      const [dateStart, setDateStart] = useState("");
      const [dateEnd, setDateEnd] = useState("");

      useEffect(() => {
        const unsub = db.collection('sales')
          .where('userId', '==', user.uid) // Filtro de seguridad: Solo trae LO TUYO
          .onSnapshot(snap => {
             const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
             docs.sort((a, b) => parseDate(b.fecha).getTime() - parseDate(a.fecha).getTime());
             setAllSales(docs);
             setLoading(false);
          });
        return () => unsub();
      }, [user.uid]);

      const filteredSales = useMemo(() => {
        return allSales.filter(sale => {
          // Filtro de Estatus
          if (statusFilter !== "Todos" && sale.estatus !== statusFilter) return false;
          
          // Filtro de Búsqueda
          if (searchTerm) {
             const term = searchTerm.toLowerCase();
             const matchesName = sale.nombre_cliente?.toLowerCase().includes(term);
             const matchesFolio = sale.folio?.toLowerCase().includes(term);
             if (!matchesName && !matchesFolio) return false;
          }
          
          // Filtro de Fechas (INTELIGENTE)
          if (dateStart || dateEnd) {
             // Determinar qué fecha usar según el estatus
             let dateToUse = sale.fecha; // Por defecto: creación
             if (sale.estatus === 'Dispersado' && sale.fecha_dispersion) {
                 dateToUse = sale.fecha_dispersion;
             } else if ((sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado') && sale.fecha_resolucion) {
                 dateToUse = sale.fecha_resolucion;
             }

             const saleDate = parseDate(dateToUse);
             saleDate.setHours(0,0,0,0);
             
             if (dateStart) { 
                 const start = getFilterDate(dateStart); 
                 if (saleDate < start) return false; 
             }
             if (dateEnd) { 
                 const end = getFilterDate(dateEnd); 
                 if (saleDate > end) return false; 
             }
          }
          return true;
        });
      }, [allSales, searchTerm, statusFilter, dateStart, dateEnd]);

      // SUMAS MATEMÁTICAS ESTRICTAS (Se fuerza parseFloat para evitar concatenación de textos)
      const totalPreapproved = filteredSales.reduce((sum, s) => sum + (parseFloat(s.monto_preaprobado) || 0), 0);
      const totalDisbursed = filteredSales.filter(s => s.estatus === 'Dispersado').reduce((sum, s) => sum + (parseFloat(s.monto_dispersado) || 0), 0);

      const exportToCSV = () => {
         const headers = ["Folio", "Fecha Creacion", "Fecha Cierre", "Cliente", "Telefono", "Estatus", "Linea Preaprobada", "Oferta Aceptada", "Dispersado"];
         const rows = filteredSales.map(s => [
             s.folio, 
             formatDate(s.fecha).replace(',', ''), 
             (s.fecha_dispersion || s.fecha_resolucion) ? formatDate(s.fecha_dispersion || s.fecha_resolucion).replace(',', '') : 'N/A',
             `"${s.nombre_cliente}"`, 
             s.telefono || '', 
             s.estatus, 
             parseFloat(s.monto_original || s.monto_preaprobado) || 0, // Línea Original
             parseFloat(s.monto_preaprobado) || 0,                     // Monto actual
             parseFloat(s.monto_dispersado) || 0                       // Dispersado final
         ]);
         const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
         const encodedUri = encodeURI(csvContent);
         const link = document.createElement("a");
         link.setAttribute("href", encodedUri);
         link.setAttribute("download", `reporte_ventas_${new Date().getTime()}.csv`);
         document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      if (loading) return <div className="h-full flex justify-center items-center font-bold text-slate-400">Cargando Reportes...</div>;

      return (
        <div className="flex flex-col h-full bg-slate-50">
          <div className="bg-slate-900 text-white p-4 flex justify-between items-center shadow z-10">
            <div className="flex items-center gap-3">
              <a href="index.html" className="text-slate-400 hover:text-white transition-colors mr-2"><i className="fas fa-arrow-left text-xl"></i></a>
              <div className="flex flex-col">
                 <h1 className="font-bold text-xl leading-none">Reportes Financieros</h1>
                 <span className="text-xs text-blue-400">{user.email ? user.email.split('@')[0] : 'Agente'}</span>
              </div>
            </div>
            <a href="index.html" className="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm font-bold hidden sm:flex items-center transition-colors">
              <i className="fas fa-columns mr-2"></i>Ir al Pipeline
            </a>
          </div>

          <div className="flex-1 p-6 overflow-hidden flex flex-col gap-6 max-w-7xl mx-auto w-full">
            
            {/* PANELES DE MÉTRICAS */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 shrink-0">
               <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                  <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Volumen Filtrado</p>
                  <p className="text-3xl font-black text-slate-800">{filteredSales.length} <span className="text-sm text-slate-400 font-medium">leads</span></p>
               </div>
               <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-blue-500">
                  <p className="text-xs font-bold text-blue-500 uppercase tracking-wider mb-1">Monto en Proceso / Aceptado</p>
                  <p className="text-3xl font-black text-blue-700">{money(totalPreapproved)}</p>
               </div>
               <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-green-500">
                  <p className="text-xs font-bold text-green-500 uppercase tracking-wider mb-1">Monto Dispersado Real</p>
                  <p className="text-3xl font-black text-green-600">{money(totalDisbursed)}</p>
               </div>
            </div>

            {/* BARRA DE FILTROS */}
            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm shrink-0 flex flex-wrap gap-4 items-end">
               <div className="flex-1 min-w-[200px]">
                  <label className="block text-xs font-bold text-slate-500 mb-1">Buscar Cliente o Folio</label>
                  <div className="relative">
                     <i className="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                     <input type="text" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Ej. Juan Perez..." className="w-full pl-9 pr-3 py-2 border rounded focus:border-blue-500 text-sm outline-none" />
                  </div>
               </div>
               <div className="w-48">
                  <label className="block text-xs font-bold text-slate-500 mb-1">Estatus</label>
                  <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="w-full px-3 py-2 border rounded focus:border-blue-500 text-sm outline-none bg-white font-medium text-slate-700">
                     <option value="Todos">Todos los estatus</option>
                     {PIPELINE_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
               </div>
               <div className="w-40"><label className="block text-xs font-bold text-slate-500 mb-1">Desde Fecha</label><input type="date" value={dateStart} onChange={e => setDateStart(e.target.value)} className="w-full px-3 py-2 border rounded text-sm text-slate-600 focus:border-blue-500 outline-none" /></div>
               <div className="w-40"><label className="block text-xs font-bold text-slate-500 mb-1">Hasta Fecha</label><input type="date" value={dateEnd} onChange={e => setDateEnd(e.target.value)} className="w-full px-3 py-2 border rounded text-sm text-slate-600 focus:border-blue-500 outline-none" /></div>
               <button onClick={exportToCSV} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold flex items-center transition-colors shadow"><i className="fas fa-file-excel mr-2"></i>CSV</button>
            </div>

            {/* TABLA DE RESULTADOS */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm flex-1 overflow-hidden flex flex-col">
               <div className="overflow-auto flex-1">
                 <table className="w-full text-left border-collapse min-w-max">
                   <thead className="bg-slate-50 sticky top-0 z-10 shadow-sm border-b border-slate-200">
                     <tr>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase">Información</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase">Cliente</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase">Estatus</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right">Preaprobado</th>
                       <th className="py-3 px-4 text-xs font-bold text-slate-500 uppercase text-right">Dispersado</th>
                     </tr>
                   </thead>
                   <tbody className="divide-y divide-slate-100">
                     {filteredSales.map(sale => (
                       <tr key={sale.id} className="hover:bg-slate-50 transition-colors">
                         <td className="py-3 px-4">
                            <div className="font-mono text-xs font-bold text-slate-600 bg-slate-100 inline-block px-1 rounded">{sale.folio}</div>
                            {/* Fecha Inteligente: Muestra la relevante */}
                            <div className="text-[10px] text-slate-400 mt-1">
                               {sale.estatus === 'Dispersado' && sale.fecha_dispersion ? (
                                   <span><i className="fas fa-check-circle text-green-500 mr-1"></i>Cierre: {formatDate(sale.fecha_dispersion)}</span>
                               ) : (sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado') && sale.fecha_resolucion ? (
                                   <span><i className="fas fa-times-circle text-red-400 mr-1"></i>Resol.: {formatDate(sale.fecha_resolucion)}</span>
                               ) : (
                                   <span><i className="fas fa-calendar-plus text-slate-300 mr-1"></i>Creación: {formatDate(sale.fecha)}</span>
                               )}
                            </div>
                         </td>
                         <td className="py-3 px-4">
                           <div className="font-bold text-sm text-slate-800">{sale.nombre_cliente}</div>
                           <div className="flex gap-2 mt-0.5">{sale.telefono && <span className="text-[10px] text-slate-400 font-medium"><i className="fas fa-phone mr-1"></i>{sale.telefono}</span>}</div>
                         </td>
                         <td className="py-3 px-4">
                            <span className={`px-2 py-1 rounded text-[10px] font-bold uppercase ${sale.estatus === 'Dispersado' ? 'bg-green-100 text-green-700 border border-green-200' : sale.estatus === 'Rechazado' || sale.estatus === 'Cancelado' ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-blue-50 text-blue-700 border border-blue-100'}`}>
                               {sale.estatus}
                            </span>
                         </td>
                         <td className="py-3 px-4 text-right">
                            {/* MEMORIA FINANCIERA EN TABLA */}
                            {sale.monto_original ? (
                                <div className="flex flex-col items-end leading-none">
                                    <span className={`text-[10px] ${sale.monto_original !== sale.monto_preaprobado ? 'text-slate-400 line-through' : 'text-slate-400'}`} title="Línea Preaprobada Inicial">
                                        {money(sale.monto_original)}
                                    </span>
                                    <span className="font-bold text-sm text-blue-600 mt-0.5" title="Oferta Aceptada">
                                        {money(sale.monto_preaprobado)}
                                    </span>
                                </div>
                            ) : (
                                <span className="font-bold text-sm text-slate-600">{money(sale.monto_preaprobado)}</span>
                            )}
                         </td>
                         <td className="py-3 px-4 text-right font-bold text-sm">
                            {sale.estatus === 'Dispersado' ? (
                                <span className="text-green-600 bg-green-50 px-2 py-1 rounded">{money(sale.monto_dispersado)}</span>
                            ) : (
                                <span className="text-slate-300">-</span>
                            )}
                         </td>
                       </tr>
                     ))}
                     {filteredSales.length === 0 && (
                       <tr><td colSpan="5" className="py-10 text-center text-slate-400 font-bold bg-slate-50/50"><i className="fas fa-inbox text-3xl mb-3 text-slate-300 block"></i>No se encontraron registros con estos filtros en las fechas seleccionadas.</td></tr>
                     )}
                   </tbody>
                 </table>
               </div>
            </div>
          </div>
        </div>
      );
    };

    const MainWrapper = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);

      useEffect(() => {
        return auth.onAuthStateChanged((u) => {
          if (!u) {
             window.location.replace("index.html");
          } else {
             setUser(u);
             setLoadingAuth(false);
          }
        });
      }, []);

      if (loadingAuth) return <div className="h-screen bg-slate-900 flex justify-center items-center text-white font-bold">Verificando seguridad...</div>;
      
      return <App user={user} />;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainWrapper />);
  </script>
</body>
</html>
