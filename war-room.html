<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>War Room · Ventas en Vivo</title>

  <link rel="icon" href="https://raw.githubusercontent.com/jarodlopez/Ventas-MM/refs/heads/main/1779060689439.jpg" type="image/jpeg" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
    .loader { border: 4px solid #1e293b; border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .live-dot { animation: pulseDot 1.2s ease-in-out infinite; }
    .bar-fill { transition: width .8s cubic-bezier(.22,.61,.36,1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyAAETou6DhYIJJ8cxI13BU1p_l3yGPMilA",
      authDomain: "ventas-ebd49.firebaseapp.com",
      projectId: "ventas-ebd49",
      storageBucket: "ventas-ebd49.firebasestorage.app",
      messagingSenderId: "907042495792",
      appId: "1:907042495792:web:6827da0b73333496f6bcf5"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // ---- Config de alertas (ajustable) ----
    const ALERTAS = {
      frioDias: 3,          // lead activo sin actividad => "frío"
      ofertaVenceDias: 7,   // lead "Con oferta" con esta antigüedad => "por vencer"

      // --- Envío a Slack (vía relay serverless api/slack-alert.js) ---
      // "" = desactivado (solo se muestran en pantalla). Deja "/api/slack-alert" para activar.
      slackEndpoint: "/api/slack-alert",
      slackMinSeveridad: 3, // 3 = solo críticas (meta en riesgo / oferta por vencer). 2 = también leads fríos.
      slackReavisoHrs: 6,   // no repetir la misma alerta a Slack antes de estas horas.
      // Para evitar que cada pantalla abierta mande duplicados, SOLO envía la que abras
      // con ?alertas=1 en la URL (ej. la TV del piso: war-room.html?alertas=1).

      // A quién etiquetar en la alerta de EQUIPO (meta en riesgo). Ej: "<!here>" o "<@U0SUPERVISOR>". "" = nadie.
      mencionEquipo: "",
    };
    const ENVIA_SLACK = (() => { try { return new URLSearchParams(location.search).get('alertas') === '1'; } catch (e) { return false; } })();

    // Modo prueba: ?prueba=60 envía una alerta de prueba a Slack cada 60s (mín 10). Quita el parámetro para detener.
    const PRUEBA_SLACK_SEG = (() => { try { const v = new URLSearchParams(location.search).get('prueba'); if (v === null) return 0; const n = parseInt(v, 10); return n >= 10 ? n : 60; } catch (e) { return 0; } })();

    // Mapa correo del agente (agentEmail) -> Member ID de Slack (U0XXXX). Para @etiquetar al dueño del lead.
    // Cómo obtener el ID: en Slack, perfil de la persona -> ⋮ Más -> Copiar Member ID.
    const AGENTES_SLACK = {
      // "ana@multimoney.com": "U0123ABC",
      // "beto@multimoney.com": "U0456DEF",
    };
    const mencionSlack = (s) => {
      const id = s && s.agentEmail && AGENTES_SLACK[String(s.agentEmail).toLowerCase()];
      return id ? ` <@${id}>` : '';
    };

    const ACTIVE_STATUSES = ["Con oferta", "Acepta oferta", "Long track"];
    const LOST_STATUSES = ["Rechazado", "Cancelado", "Expirado"];
    const FUNNEL_STAGES = ["Con oferta", "Long track", "Acepta oferta", "Dispersado"];

    const parseDate = (input) => { if (!input) return new Date(); if (input.toDate) return input.toDate(); const d = new Date(input); return isNaN(d) ? new Date() : d; };
    const money = (v) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(v || 0);
    const moneyUSD = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v || 0);
    const nDays = (ms) => ms / 86400000;
    const avg = (arr) => { const c = arr.filter(x => typeof x === 'number' && isFinite(x) && x >= 0); return c.length ? c.reduce((a, b) => a + b, 0) / c.length : 0; };
    const fmtDays = (d) => `${d.toFixed(1)} d`;

    const getAgentName = (s) => s.agentEmail ? s.agentEmail.split('@')[0] : (s.userId ? 'Agente_' + String(s.userId).substring(0, 4) : 'Sin Asignar');
    const getQuincena = (date) => date.getDate() <= 15 ? 1 : 2;
    const getBusinessDays = (targetDate, quincena) => {
      const year = targetDate.getFullYear(), month = targetDate.getMonth();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const startDay = quincena === 1 ? 1 : 16;
      const endDay = quincena === 1 ? 15 : lastDay;
      let total = 0, remaining = 0;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      for (let d = startDay; d <= endDay; d++) {
        const dc = new Date(year, month, d);
        if (dc.getDay() !== 0 && dc.getDay() !== 6) { total++; if (dc >= today) remaining++; }
      }
      return { total, remaining, startDay, endDay };
    };

    // ---------- Presentacionales ----------
    const Panel = ({ title, icon, children, className = "" }) => (
      <div className={`bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col overflow-hidden ${className}`}>
        <div className="px-4 py-2.5 border-b border-slate-800 flex items-center gap-2 shrink-0">
          <i className={`fas ${icon} text-slate-500 text-sm`}></i>
          <span className="text-[11px] font-bold uppercase tracking-widest text-slate-400">{title}</span>
        </div>
        <div className="flex-1 overflow-y-auto p-4">{children}</div>
      </div>
    );

    const Kpi = ({ label, value, sub, color = "text-slate-100", icon }) => (
      <div className="bg-slate-900/70 border border-slate-800 rounded-2xl px-4 py-3 flex flex-col justify-center">
        <p className="text-[10px] font-semibold uppercase tracking-widest text-slate-500 flex items-center gap-1.5">
          {icon && <i className={`fas ${icon}`}></i>}{label}
        </p>
        <p className={`text-3xl font-black leading-tight tracking-tight ${color}`}>{value}</p>
        {sub && <p className="text-[11px] font-medium text-slate-400 mt-0.5">{sub}</p>}
      </div>
    );

    const BarRow = ({ label, right, pct, color = "bg-emerald-500", sub }) => (
      <div className="mb-2.5">
        <div className="flex justify-between items-baseline mb-1">
          <span className="text-sm font-semibold text-slate-200 truncate mr-2">{label}</span>
          <span className="text-sm font-bold text-slate-100 whitespace-nowrap">{right}</span>
        </div>
        <div className="w-full bg-slate-800 rounded-full h-2">
          <div className={`bar-fill h-2 rounded-full ${color}`} style={{ width: `${Math.max(2, Math.min(100, pct))}%` }}></div>
        </div>
        {sub && <p className="text-[10px] text-slate-500 mt-0.5">{sub}</p>}
      </div>
    );

    // ---------- Dashboard ----------
    const WarRoom = ({ user }) => {
      const [allSales, setAllSales] = useState([]);
      const [metas, setMetas] = useState([]);
      const [now, setNow] = useState(new Date());
      const [loading, setLoading] = useState(true);
      const [denied, setDenied] = useState(false);
      const [view, setView] = useState(() => ({ date: new Date(), q: getQuincena(new Date()) }));

      const changePeriod = (dir) => setView(v => {
        const d = new Date(v.date);
        if (dir === 1) {
          if (v.q === 1) return { date: v.date, q: 2 };
          d.setMonth(d.getMonth() + 1); return { date: d, q: 1 };
        }
        if (v.q === 2) return { date: v.date, q: 1 };
        d.setMonth(d.getMonth() - 1); return { date: d, q: 2 };
      });
      const irHoy = () => setView({ date: new Date(), q: getQuincena(new Date()) });

      // Prueba manual del webhook de Slack (verifica War Room -> relay -> Slack).
      const [test, setTest] = useState({ estado: 'idle', msg: '' });
      const probarSlack = async () => {
        if (!ALERTAS.slackEndpoint) { setTest({ estado: 'err', msg: 'slackEndpoint no está configurado en el código.' }); return; }
        setTest({ estado: 'sending', msg: '' });
        try {
          const r = await fetch(ALERTAS.slackEndpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alerts: [{ tipo: '🔔 Prueba de conexión', txt: 'Si ves esto en Slack, el webhook del War Room funciona.', meta: new Date().toLocaleString('es-MX'), sev: 3 }] }),
          });
          const data = await r.json().catch(() => ({}));
          if (r.ok && data.ok) setTest({ estado: 'ok', msg: `Slack aceptó la petición (${data.tipo || 'webhook'}). Revisa el canal.` });
          else setTest({ estado: 'err', msg: data.error ? data.error : `Slack respondió ${data.status || r.status}${data.slack ? ' → ' + data.slack : ''}` });
        } catch (e) {
          setTest({ estado: 'err', msg: 'No se pudo contactar /api/slack-alert. ¿Está desplegado en Vercel?' });
        }
      };

      // Modo prueba: envía una alerta a Slack cada PRUEBA_SLACK_SEG segundos (?prueba=60).
      useEffect(() => {
        if (!PRUEBA_SLACK_SEG || !ALERTAS.slackEndpoint) return;
        let n = 0;
        const enviar = () => {
          n++;
          const num = n;
          fetch(ALERTAS.slackEndpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alerts: [{ tipo: `🧪 Prueba automática #${num}`, txt: 'Pulso de prueba del War Room', meta: new Date().toLocaleTimeString('es-MX'), sev: 3 }] }),
          }).then(r => r.json().catch(() => ({}))).then(d => {
            setTest(d && d.ok
              ? { estado: 'ok', msg: `Prueba #${num} enviada ✓ (${new Date().toLocaleTimeString('es-MX')})` }
              : { estado: 'err', msg: `Prueba #${num} falló: ${(d && (d.error || d.slack)) || 'error'}` });
          }).catch(() => setTest({ estado: 'err', msg: `Prueba #${num}: no se pudo contactar el endpoint` }));
        };
        enviar();
        const t = setInterval(enviar, PRUEBA_SLACK_SEG * 1000);
        return () => clearInterval(t);
      }, []);

      useEffect(() => {
        const unsub = db.collection('sales').onSnapshot(
          snap => { setAllSales(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
          err => { console.error(err); setDenied(true); setLoading(false); }
        );
        return () => unsub();
      }, []);

      useEffect(() => {
        const unsub = db.collection('metas').onSnapshot(
          snap => setMetas(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
          err => console.error('metas', err)
        );
        return () => unsub();
      }, []);

      // Reloj + recálculo de alertas por tiempo (cada 30s)
      useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);

      const D = useMemo(() => {
        const vDate = view.date, q = view.q;
        const year = vDate.getFullYear(), month = vDate.getMonth();
        const esPeriodoActual = (year === now.getFullYear() && month === now.getMonth() && q === getQuincena(now));
        const biz = getBusinessDays(vDate, q);
        const lastDay = new Date(year, month + 1, 0).getDate();
        const pStart = new Date(year, month, q === 1 ? 1 : 16, 0, 0, 0);
        const pEnd = new Date(year, month, q === 1 ? 15 : lastDay, 23, 59, 59);
        const inPeriod = (d) => { const x = parseDate(d); return x >= pStart && x <= pEnd; };

        // Metas del periodo actual (doc id = `${uid}_${year}-${month}-${q}`, month 0-indexado)
        const suffix = `_${year}-${month}-${q}`;
        const metaByUser = {};
        let tc = 18;
        metas.filter(m => m.id.endsWith(suffix)).forEach(m => {
          if (m.userId) metaByUser[m.userId] = Number(m.monto) || 0;
          if (m.tipoCambio) tc = Number(m.tipoCambio) || tc;
        });
        const metaTeam = Object.values(metaByUser).reduce((a, b) => a + b, 0);

        const dispQ = allSales.filter(s => s.estatus === 'Dispersado' && inPeriod(s.fecha_dispersion || s.fecha));
        const lostQ = allSales.filter(s => LOST_STATUSES.includes(s.estatus) && inPeriod(s.fecha_resolucion || s.fecha));
        // Pipeline activo del periodo: leads no terminales creados hasta el fin del periodo (incluye arrastre).
        const active = allSales.filter(s => ACTIVE_STATUSES.includes(s.estatus) && parseDate(s.fecha) <= pEnd);

        const soldTeam = dispQ.reduce((a, s) => a + (Number(s.monto_dispersado) || 0), 0);
        const pipelineTeam = active.reduce((a, s) => a + (Number(s.monto_preaprobado) || 0), 0);
        const pct = metaTeam > 0 ? (soldTeam / metaTeam) * 100 : 0;
        const winRate = (dispQ.length + lostQ.length) > 0 ? (dispQ.length / (dispQ.length + lostQ.length)) * 100 : 0;

        const originalDaily = biz.total > 0 ? metaTeam / biz.total : 0;
        const elapsed = Math.max(0, biz.total - biz.remaining);
        const dailyRate = elapsed > 0 ? soldTeam / elapsed : 0;
        const forecast = elapsed > 0 ? dailyRate * biz.total : soldTeam;
        const forecastPct = metaTeam > 0 ? (forecast / metaTeam) * 100 : 0;
        const remaining = Math.max(0, metaTeam - soldTeam);
        const requiredDaily = biz.remaining > 0 ? remaining / biz.remaining : remaining;

        // Leaderboard por agente
        const byAgent = {};
        allSales.forEach(s => {
          const name = getAgentName(s);
          const a = byAgent[name] || (byAgent[name] = { name, userId: s.userId, disp: 0, dispCount: 0, pipeline: 0, lost: 0 });
          if (s.estatus === 'Dispersado' && inPeriod(s.fecha_dispersion || s.fecha)) { a.disp += Number(s.monto_dispersado) || 0; a.dispCount++; }
          if (ACTIVE_STATUSES.includes(s.estatus)) a.pipeline += Number(s.monto_preaprobado) || 0;
          if (LOST_STATUSES.includes(s.estatus) && inPeriod(s.fecha_resolucion || s.fecha)) a.lost++;
        });
        const leaderboard = Object.values(byAgent)
          .map(a => ({ ...a, meta: metaByUser[a.userId] || 0, winRate: (a.dispCount + a.lost) > 0 ? (a.dispCount / (a.dispCount + a.lost)) * 100 : 0 }))
          .sort((x, y) => y.disp - x.disp);
        const maxDisp = Math.max(1, ...leaderboard.map(a => a.disp));

        // Funnel (pipeline vivo + dispersados del periodo)
        const funnel = FUNNEL_STAGES.map(stage => {
          if (stage === 'Dispersado') return { stage, count: dispQ.length, monto: soldTeam };
          const arr = active.filter(s => s.estatus === stage);
          return { stage, count: arr.length, monto: arr.reduce((a, s) => a + (Number(s.monto_preaprobado) || 0), 0) };
        });
        const funnelMax = Math.max(1, ...funnel.map(f => f.count));

        // Velocidad
        const firstHist = (s, re) => { const h = (s.history || []).filter(e => re.test(e.action || '')).map(e => parseDate(e.date)).sort((a, b) => a - b); return h[0] || null; };
        const cycle = [], tAccept = [], tDisperse = [];
        dispQ.forEach(s => {
          const created = parseDate(s.fecha), disp = parseDate(s.fecha_dispersion || s.fecha);
          cycle.push(nDays(disp - created));
          const acc = firstHist(s, /ACEPTA|ACEPTADA/i);
          if (acc) { tAccept.push(nDays(acc - created)); tDisperse.push(nDays(disp - acc)); }
        });
        const avgActiveAge = avg(active.map(s => nDays(now - parseDate(s.fecha))));

        // Motivos de pérdida
        const lostMap = {};
        lostQ.forEach(s => { const r = s.motivo_perdida || 'Sin motivo'; lostMap[r] = (lostMap[r] || 0) + 1; });
        const lostReasons = Object.entries(lostMap).map(([motivo, count]) => ({ motivo, count })).sort((a, b) => b.count - a.count);

        // Alertas en vivo (solo aplican al periodo actual; en periodos pasados es histórico).
        const lastActivity = (s) => { const ds = [parseDate(s.fecha).getTime(), ...(s.history || []).map(e => parseDate(e.date).getTime())]; return new Date(Math.max.apply(null, ds)); };
        const alerts = [];
        if (esPeriodoActual) {
          active.forEach(s => {
            const d = nDays(now - lastActivity(s));
            if (d >= ALERTAS.frioDias) alerts.push({ sev: 2, tipo: 'Lead frío', icon: 'fa-snowflake', txt: `${s.nombre_cliente || s.folio} · ${getAgentName(s)}${mencionSlack(s)}`, meta: `${Math.floor(d)}d sin actividad`, key: 'frio' + s.id });
          });
          active.filter(s => s.estatus === 'Con oferta').forEach(s => {
            const age = nDays(now - parseDate(s.fecha));
            if (age >= ALERTAS.ofertaVenceDias) alerts.push({ sev: 3, tipo: 'Oferta por vencer', icon: 'fa-hourglass-half', txt: `${s.nombre_cliente || s.folio} · ${getAgentName(s)}${mencionSlack(s)}`, meta: `oferta de ${Math.floor(age)}d`, key: 'vence' + s.id });
          });
          if (metaTeam > 0 && biz.remaining > 0 && forecastPct < 100) {
            alerts.push({ sev: 3, tipo: 'Meta en riesgo', icon: 'fa-triangle-exclamation', txt: `Proyección ${forecastPct.toFixed(0)}% de la meta${ALERTAS.mencionEquipo ? ' ' + ALERTAS.mencionEquipo : ''}`, meta: `faltan ${money(remaining)} en ${biz.remaining}d`, key: 'meta' });
          }
          alerts.sort((a, b) => b.sev - a.sev);
        }

        // Comparativa: quincena anterior vs actual (datos reales)
        const resumen = (y, m, qq) => {
          const ld2 = new Date(y, m + 1, 0).getDate();
          const s2 = new Date(y, m, qq === 1 ? 1 : 16, 0, 0, 0);
          const e2 = new Date(y, m, qq === 1 ? 15 : ld2, 23, 59, 59);
          const inP2 = (d) => { const x = parseDate(d); return x >= s2 && x <= e2; };
          const suf2 = `_${y}-${m}-${qq}`;
          const metaP = metas.filter(mm => mm.id.endsWith(suf2)).reduce((a, mm) => a + (Number(mm.monto) || 0), 0);
          const dispP = allSales.filter(x => x.estatus === 'Dispersado' && inP2(x.fecha_dispersion || x.fecha));
          const lostP = allSales.filter(x => LOST_STATUSES.includes(x.estatus) && inP2(x.fecha_resolucion || x.fecha));
          const soldP = dispP.reduce((a, x) => a + (Number(x.monto_dispersado) || 0), 0);
          return { sold: soldP, meta: metaP, pct: metaP > 0 ? (soldP / metaP) * 100 : 0, dispCount: dispP.length, winRate: (dispP.length + lostP.length) > 0 ? (dispP.length / (dispP.length + lostP.length)) * 100 : 0 };
        };
        let pY = year, pM = month, pQ = 1;
        if (q === 1) { pQ = 2; pM = month - 1; if (pM < 0) { pM = 11; pY = year - 1; } }
        const comp = {
          actual: { sold: soldTeam, meta: metaTeam, pct, dispCount: dispQ.length, winRate },
          prev: resumen(pY, pM, pQ),
          prevLabel: new Intl.DateTimeFormat('es-MX', { month: 'short' }).format(new Date(pY, pM, 1)) + ' Q' + pQ,
        };

        return {
          year, month, q, esPeriodoActual, comp, biz, metaTeam, tc, soldTeam, pipelineTeam, pct, winRate, forecast, forecastPct,
          originalDaily, requiredDaily, remaining, elapsed, dispQ, lostQ, active,
          leaderboard, maxDisp, funnel, funnelMax,
          avgCycle: avg(cycle), avgAccept: avg(tAccept), avgDisperse: avg(tDisperse), avgActiveAge,
          lostReasons, alerts,
        };
      }, [allSales, metas, now, view]);

      // Envío de alertas a Slack (solo la pantalla abierta con ?alertas=1, con dedup por localStorage).
      useEffect(() => {
        if (!ENVIA_SLACK || !ALERTAS.slackEndpoint || !D.alerts.length) return;
        const min = ALERTAS.slackMinSeveridad || 3;
        const cooldown = (ALERTAS.slackReavisoHrs || 6) * 3600000;
        const ahora = Date.now();
        let sent = {};
        try { sent = JSON.parse(localStorage.getItem('wr_slack_sent') || '{}'); } catch (e) {}
        const nuevas = D.alerts.filter(a => a.sev >= min && (!sent[a.key] || ahora - sent[a.key] > cooldown));
        if (!nuevas.length) return;
        nuevas.forEach(a => { sent[a.key] = ahora; });
        Object.keys(sent).forEach(k => { if (ahora - sent[k] > cooldown * 4) delete sent[k]; });
        try { localStorage.setItem('wr_slack_sent', JSON.stringify(sent)); } catch (e) {}
        fetch(ALERTAS.slackEndpoint, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ alerts: nuevas.map(a => ({ tipo: a.tipo, txt: a.txt, meta: a.meta, sev: a.sev })) }),
        }).catch(() => {});
      }, [D.alerts]);

      if (loading) return <div className="h-screen flex justify-center items-center"><div className="loader mr-4"></div><span className="text-slate-400 font-bold">Cargando datos…</span></div>;
      if (denied) return (
        <div className="h-screen flex flex-col justify-center items-center text-center px-6">
          <i className="fas fa-lock text-4xl text-rose-500 mb-4"></i>
          <h1 className="text-2xl font-black mb-2">Sin permisos para ver el equipo</h1>
          <p className="text-slate-400 max-w-md">Tu usuario no puede leer todos los registros (reglas de Firestore). Pide acceso de supervisor.</p>
          <a href="index.html" className="mt-6 bg-slate-800 hover:bg-slate-700 px-5 py-2 rounded-xl font-bold">Volver al tablero</a>
        </div>
      );

      const periodo = new Intl.DateTimeFormat('es-MX', { month: 'long', year: 'numeric' }).format(view.date);
      const hora = new Intl.DateTimeFormat('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
      const paceColor = D.forecastPct >= 100 ? 'text-emerald-400' : D.forecastPct >= 80 ? 'text-amber-400' : 'text-rose-400';
      const medal = ['🥇', '🥈', '🥉'];
      const cmpColor = (d) => d > 0 ? 'text-emerald-400' : d < 0 ? 'text-rose-400' : 'text-slate-500';
      const cmpIcon = (d) => d > 0 ? 'fa-arrow-up' : d < 0 ? 'fa-arrow-down' : 'fa-minus';

      return (
        <div className="h-full flex flex-col p-3 gap-3">
          {/* Header */}
          <div className="flex items-center justify-between shrink-0">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-500/15 flex items-center justify-center"><i className="fas fa-bolt text-emerald-400"></i></div>
              <div>
                <h1 className="text-xl font-black tracking-tight leading-none">War Room · Ventas</h1>
                <p className="text-[11px] text-slate-400 capitalize">{periodo} · Q{D.q}</p>
              </div>
              {/* Navegación de periodo */}
              <div className="ml-1 flex items-center bg-slate-900 border border-slate-800 rounded-xl p-0.5">
                <button onClick={() => changePeriod(-1)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><i className="fas fa-chevron-left text-xs"></i></button>
                <span className="px-2 text-xs font-bold text-slate-200 whitespace-nowrap capitalize">{new Intl.DateTimeFormat('es-MX', { month: 'short', year: '2-digit' }).format(view.date)} · Q{D.q}</span>
                <button onClick={() => changePeriod(1)} className="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors"><i className="fas fa-chevron-right text-xs"></i></button>
              </div>
              {D.esPeriodoActual
                ? <span className="flex items-center gap-1.5 text-[11px] font-bold text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded-full"><span className="live-dot w-2 h-2 rounded-full bg-rose-500"></span>EN VIVO</span>
                : <button onClick={irHoy} className="flex items-center gap-1.5 text-[11px] font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-full transition-colors"><i className="fas fa-clock-rotate-left"></i>Histórico · Ir a hoy</button>}
            </div>
            <div className="flex items-center gap-4">
              {PRUEBA_SLACK_SEG > 0 && (
                <span className="text-[11px] font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full whitespace-nowrap"><i className="fas fa-flask mr-1"></i>Prueba c/{PRUEBA_SLACK_SEG}s</span>
              )}
              {ALERTAS.slackEndpoint && (
                <button onClick={probarSlack} disabled={test.estado === 'sending'}
                  title={test.msg || 'Envía una alerta de prueba a Slack'}
                  className={`text-xs font-bold px-3 py-1.5 rounded-full transition-colors flex items-center gap-1.5 ${test.estado === 'ok' ? 'bg-emerald-500/15 text-emerald-400' : test.estado === 'err' ? 'bg-rose-500/15 text-rose-400' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}>
                  <i className={`fab fa-slack ${test.estado === 'sending' ? 'fa-fade' : ''}`}></i>
                  {test.estado === 'sending' ? 'Enviando…' : test.estado === 'ok' ? 'Enviado ✓' : test.estado === 'err' ? 'Falló ✗' : 'Probar Slack'}
                </button>
              )}
              <span className="font-mono text-lg font-bold text-slate-300 tabular-nums">{hora}</span>
              <a href="index.html" className="text-slate-400 hover:text-white text-sm font-semibold"><i className="fas fa-arrow-left mr-1.5"></i>Tablero</a>
            </div>
          </div>
          {test.msg && test.estado !== 'sending' && (
            <div className={`shrink-0 -mt-1 text-xs font-semibold px-3 py-1.5 rounded-lg ${test.estado === 'ok' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
              <i className={`fas ${test.estado === 'ok' ? 'fa-circle-check' : 'fa-circle-exclamation'} mr-1.5`}></i>{test.msg}
            </div>
          )}

          {/* KPIs */}
          <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3 shrink-0">
            <Kpi label="Dispersado" icon="fa-sack-dollar" color="text-emerald-400" value={money(D.soldTeam)} sub={`${moneyUSD(D.soldTeam / D.tc)} · ${D.dispQ.length} créditos`} />
            <Kpi label="Meta equipo" icon="fa-bullseye" value={D.metaTeam > 0 ? money(D.metaTeam) : '—'} sub={D.metaTeam > 0 ? `${D.pct.toFixed(1)}% cumplido` : 'sin meta definida'} color={D.pct >= 100 ? 'text-emerald-400' : 'text-slate-100'} />
            <Kpi label="Forecast quincena" icon="fa-chart-line" color={paceColor} value={D.metaTeam > 0 ? `${D.forecastPct.toFixed(0)}%` : '—'} sub={D.metaTeam > 0 ? money(D.forecast) : 'define meta'} />
            <Kpi label="Pipeline activo" icon="fa-fire" color="text-amber-400" value={money(D.pipelineTeam)} sub={`${D.active.length} leads vivos`} />
            <Kpi label="Tasa de conversión" icon="fa-percent" value={`${D.winRate.toFixed(0)}%`} sub={`${D.dispQ.length} ganados · ${D.lostQ.length} perdidos`} color={D.winRate >= 50 ? 'text-emerald-400' : 'text-slate-100'} />
            <Kpi label="Ciclo promedio" icon="fa-stopwatch" value={D.avgCycle > 0 ? fmtDays(D.avgCycle) : '—'} sub="creación → dispersión" />
          </div>

          {/* Main grid */}
          <div className="grid grid-cols-1 xl:grid-cols-12 gap-3 flex-1 min-h-0">
            {/* Leaderboard */}
            <Panel title="Leaderboard por agente" icon="fa-trophy" className="xl:col-span-5">
              {D.leaderboard.length === 0 && <p className="text-slate-500 text-sm">Sin datos aún.</p>}
              {D.leaderboard.map((a, i) => (
                <div key={a.name} className="mb-3">
                  <div className="flex justify-between items-baseline mb-1">
                    <span className="text-sm font-bold text-slate-100 truncate mr-2 capitalize">
                      <span className="inline-block w-6 text-center">{medal[i] || (i + 1)}</span>{a.name}
                    </span>
                    <span className="text-sm font-black text-emerald-400 whitespace-nowrap">{money(a.disp)}</span>
                  </div>
                  <div className="w-full bg-slate-800 rounded-full h-2.5">
                    <div className="bar-fill h-2.5 rounded-full bg-gradient-to-r from-emerald-600 to-emerald-400" style={{ width: `${Math.max(2, (a.disp / D.maxDisp) * 100)}%` }}></div>
                  </div>
                  <div className="flex gap-3 text-[10px] text-slate-500 mt-1">
                    <span><b className="text-slate-300">{a.dispCount}</b> disp.</span>
                    <span>pipeline <b className="text-slate-300">{money(a.pipeline)}</b></span>
                    <span>conv. <b className="text-slate-300">{a.winRate.toFixed(0)}%</b></span>
                    {a.meta > 0 && <span className={a.disp >= a.meta ? 'text-emerald-400' : ''}>{((a.disp / a.meta) * 100).toFixed(0)}% de meta</span>}
                  </div>
                </div>
              ))}
            </Panel>

            {/* Funnel + velocidad + pérdidas */}
            <div className="xl:col-span-4 flex flex-col gap-3 min-h-0">
              <Panel title="Funnel del pipeline" icon="fa-filter" className="flex-1">
                {D.funnel.map(f => (
                  <BarRow key={f.stage} label={f.stage} right={`${f.count}`} pct={(f.count / D.funnelMax) * 100}
                    color={f.stage === 'Dispersado' ? 'bg-emerald-500' : f.stage === 'Acepta oferta' ? 'bg-sky-500' : 'bg-slate-500'}
                    sub={money(f.monto)} />
                ))}
              </Panel>
              <Panel title="Velocidad" icon="fa-gauge-high" className="shrink-0">
                <div className="grid grid-cols-2 gap-3">
                  <div><p className="text-[10px] uppercase tracking-wider text-slate-500">A aceptar</p><p className="text-xl font-black text-slate-100">{D.avgAccept > 0 ? fmtDays(D.avgAccept) : '—'}</p></div>
                  <div><p className="text-[10px] uppercase tracking-wider text-slate-500">Aceptar → dispersar</p><p className="text-xl font-black text-slate-100">{D.avgDisperse > 0 ? fmtDays(D.avgDisperse) : '—'}</p></div>
                  <div><p className="text-[10px] uppercase tracking-wider text-slate-500">Ciclo total</p><p className="text-xl font-black text-emerald-400">{D.avgCycle > 0 ? fmtDays(D.avgCycle) : '—'}</p></div>
                  <div><p className="text-[10px] uppercase tracking-wider text-slate-500">Antigüedad pipeline</p><p className="text-xl font-black text-amber-400">{D.avgActiveAge > 0 ? fmtDays(D.avgActiveAge) : '—'}</p></div>
                </div>
              </Panel>
              <Panel title="Motivos de pérdida" icon="fa-heart-crack" className="shrink-0" >
                {D.lostReasons.length === 0 && <p className="text-slate-500 text-sm">Sin pérdidas esta quincena. 🎉</p>}
                {D.lostReasons.slice(0, 5).map(r => (
                  <BarRow key={r.motivo} label={r.motivo} right={`${r.count}`} pct={(r.count / D.lostReasons[0].count) * 100} color="bg-rose-500" />
                ))}
              </Panel>
            </div>

            {/* Pace + alertas */}
            <div className="xl:col-span-3 flex flex-col gap-3 min-h-0">
              <Panel title="Pace vs meta" icon="fa-flag-checkered" className="shrink-0">
                <div className="flex items-end justify-between mb-1">
                  <span className={`text-4xl font-black ${D.pct >= 100 ? 'text-emerald-400' : 'text-slate-100'}`}>{D.pct.toFixed(0)}%</span>
                  <span className="text-[11px] text-slate-400 text-right">forecast <b className={paceColor}>{D.metaTeam > 0 ? D.forecastPct.toFixed(0) + '%' : '—'}</b></span>
                </div>
                <div className="w-full bg-slate-800 rounded-full h-3 mb-3 relative overflow-hidden">
                  <div className={`bar-fill h-3 rounded-full ${D.pct >= 100 ? 'bg-emerald-500' : 'bg-sky-500'}`} style={{ width: `${Math.min(100, D.pct)}%` }}></div>
                </div>
                <div className="grid grid-cols-2 gap-2 text-center">
                  <div className="bg-slate-800/60 rounded-xl py-2"><p className="text-[9px] uppercase tracking-wider text-slate-500">Ritmo req./día</p><p className="text-base font-bold text-slate-100">{D.metaTeam > 0 ? money(D.requiredDaily) : '—'}</p></div>
                  <div className="bg-slate-800/60 rounded-xl py-2"><p className="text-[9px] uppercase tracking-wider text-slate-500">Días restantes</p><p className="text-base font-bold text-slate-100">{D.biz.remaining}</p></div>
                </div>
              </Panel>

              <Panel title={`Anterior (${D.comp.prevLabel}) → actual`} icon="fa-scale-balanced" className="shrink-0">
                {[
                  { label: 'Dispersado', a: D.comp.actual.sold, p: D.comp.prev.sold, fmt: 'money', mode: 'pct' },
                  { label: '% de meta', a: D.comp.actual.pct, p: D.comp.prev.pct, fmt: 'pct', mode: 'pts' },
                  { label: 'Créditos', a: D.comp.actual.dispCount, p: D.comp.prev.dispCount, fmt: 'num', mode: 'pct' },
                  { label: 'Conversión', a: D.comp.actual.winRate, p: D.comp.prev.winRate, fmt: 'pct', mode: 'pts' },
                ].map(r => {
                  const d = r.mode === 'pts' ? (r.a - r.p) : (r.p > 0 ? ((r.a - r.p) / r.p) * 100 : (r.a > 0 ? 100 : 0));
                  const fmtV = (v) => r.fmt === 'money' ? money(v) : r.fmt === 'pct' ? `${v.toFixed(0)}%` : `${v}`;
                  return (
                    <div key={r.label} className="flex items-center justify-between py-1.5 border-b border-slate-800 last:border-0">
                      <span className="text-sm font-semibold text-slate-300">{r.label}</span>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] text-slate-500">{fmtV(r.p)}</span>
                        <i className="fas fa-arrow-right-long text-slate-600 text-[10px]"></i>
                        <span className="text-sm font-bold text-slate-100">{fmtV(r.a)}</span>
                        <span className={`text-[11px] font-bold text-right w-14 ${cmpColor(d)}`}><i className={`fas ${cmpIcon(d)} mr-0.5`}></i>{`${d >= 0 ? '+' : ''}${d.toFixed(0)}${r.mode === 'pts' ? 'pts' : '%'}`}</span>
                      </div>
                    </div>
                  );
                })}
              </Panel>

              <Panel title={`Alertas en vivo · ${D.alerts.length}${ENVIA_SLACK ? ' · Slack ✓' : ''}`} icon="fa-bell" className="flex-1">
                {D.alerts.length === 0 && (D.esPeriodoActual
                  ? <p className="text-slate-500 text-sm flex items-center gap-2"><i className="fas fa-check-circle text-emerald-500"></i>Todo en orden.</p>
                  : <p className="text-slate-500 text-sm flex items-center gap-2"><i className="fas fa-clock-rotate-left"></i>Vista histórica · las alertas solo aplican al periodo actual.</p>)}
                {D.alerts.map(al => (
                  <div key={al.key} className={`mb-2 rounded-xl px-3 py-2 border ${al.sev >= 3 ? 'bg-rose-500/10 border-rose-500/25' : 'bg-amber-500/10 border-amber-500/25'}`}>
                    <p className={`text-[10px] font-bold uppercase tracking-wider flex items-center gap-1.5 ${al.sev >= 3 ? 'text-rose-400' : 'text-amber-400'}`}>
                      <i className={`fas ${al.icon}`}></i>{al.tipo}
                    </p>
                    <p className="text-sm font-semibold text-slate-100 leading-tight capitalize">{al.txt}</p>
                    <p className="text-[11px] text-slate-400">{al.meta}</p>
                  </div>
                ))}
              </Panel>
            </div>
          </div>
        </div>
      );
    };

    const MainWrapper = () => {
      const [user, setUser] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(true);
      useEffect(() => auth.onAuthStateChanged((u) => {
        if (!u) window.location.replace("index.html");
        else { setUser(u); setLoadingAuth(false); }
      }), []);
      if (loadingAuth) return <div className="h-screen flex justify-center items-center"><div className="loader mr-4"></div><span className="text-slate-400 font-bold">Verificando…</span></div>;
      return <WarRoom user={user} />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MainWrapper />);
  </script>
</body>
</html>
