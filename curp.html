  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>

      --ios-bg: #F2F2F7;
      --ios-sep: #E5E5EA;
      --ios-blue: #007AFF;
      --mm-green: #00B100;

    html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; background: var(--ios-bg); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,128,0.26); border-radius: 10px; }
    .ios-input { background:#F2F2F7; border:1px solid transparent; transition: background .15s, border-color .15s; }
    .ios-input:focus { outline:none; background:#fff; border-color: var(--ios-blue); }
    .seg-btn { transition: all .15s ease; }
    @keyframes popIn { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop-in { animation: popIn .28s cubic-bezier(.34,1.4,.64,1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    /* ============================================================
       Lógica de cálculo de la CURP (18 caracteres)
       Basada en el "Instructivo Normativo para la Asignación de la
       Clave Única de Registro de Población" (SEGOB / RENAPO).
       ============================================================ */
    const VOCALES = 'AEIOU';

    // Preposiciones, conjunciones y artículos que se ignoran en apellidos/nombres.
    const PARTICULAS = new Set(['DA','DAS','DE','DEL','DER','DI','DIE','DD','EL','LA','LOS','LAS','LE','LES','MAC','MC','VAN','VON','Y']);

    // Nombres "comunes" que se omiten cuando existe un segundo nombre de pila.
    const COMUNES = new Set(['MARIA','MA','JOSE','J']);

    // Palabras altisonantes: si las 4 primeras letras forman una, la 2ª se cambia por 'X'.
    const INCONVENIENTES = new Set(['BACA','BAKA','BUEI','BUEY','CACA','CACO','CAGA','CAGO','CAKA','CAKO','COGE','COGI','COJA','COJE','COJI','COJO','COLA','CULO','FALO','FETO','GETA','GUEI','GUEY','JETA','JOTO','KACA','KACO','KAGA','KAGO','KAKA','KAKO','KOGE','KOGI','KOJA','KOJE','KOJI','KOJO','KOLA','KULO','LILO','LOCA','LOCO','LOKA','LOKO','MAME','MAMO','MEAR','MEAS','MEON','MIAR','MION','MOCO','MOKO','MULA','MULO','NACA','NACO','PEDA','PEDO','PENE','PIPI','PITO','POPO','PUTA','PUTO','QULO','RATA','ROBA','ROBE','ROBO','RUIN','SENO','TETA','VACA','VAGA','VAGO','VAKA','VUEI','VUEY','WUEI','WUEY']);

    // Entidades de nacimiento y su clave de 2 letras.
    const ESTADOS = [
      { c:'AS', n:'Aguascalientes' }, { c:'BC', n:'Baja California' },
      { c:'BS', n:'Baja California Sur' }, { c:'CC', n:'Campeche' },
      { c:'CS', n:'Chiapas' }, { c:'CH', n:'Chihuahua' },
      { c:'CL', n:'Coahuila' }, { c:'CM', n:'Colima' },
      { c:'DF', n:'Ciudad de México' }, { c:'DG', n:'Durango' },
      { c:'GT', n:'Guanajuato' }, { c:'GR', n:'Guerrero' },
      { c:'HG', n:'Hidalgo' }, { c:'JC', n:'Jalisco' },
      { c:'MC', n:'México (Estado de)' }, { c:'MN', n:'Michoacán' },
      { c:'MS', n:'Morelos' }, { c:'NT', n:'Nayarit' },
      { c:'NL', n:'Nuevo León' }, { c:'OC', n:'Oaxaca' },
      { c:'PL', n:'Puebla' }, { c:'QT', n:'Querétaro' },
      { c:'QR', n:'Quintana Roo' }, { c:'SP', n:'San Luis Potosí' },
      { c:'SL', n:'Sinaloa' }, { c:'SR', n:'Sonora' },
      { c:'TC', n:'Tabasco' }, { c:'TS', n:'Tamaulipas' },
      { c:'TL', n:'Tlaxcala' }, { c:'VZ', n:'Veracruz' },
      { c:'YN', n:'Yucatán' }, { c:'ZS', n:'Zacatecas' },
      { c:'NE', n:'Nacido en el Extranjero' },
    ];

    // Normaliza: mayúsculas, Ñ→X, quita acentos y caracteres no alfabéticos.
    function limpiar(s) {
      if (!s) return '';
      s = s.toUpperCase().replace(/Ñ/g, 'X');
      s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
      s = s.replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
      return s;
    }

    // Quita partículas de un apellido y une lo restante en un solo bloque.
    function sinParticulas(s) {
      const parts = s.split(' ').filter(Boolean);
      const f = parts.filter(p => !PARTICULAS.has(p));
      return (f.length ? f : parts).join('');
    }

    // Elige el nombre de pila útil (omite MARIA/JOSE/etc. si hay un segundo nombre).
    function eligeNombre(s) {
      const parts = s.split(' ').filter(Boolean).filter(p => !PARTICULAS.has(p));
      if (parts.length >= 2 && COMUNES.has(parts[0])) return parts[1];
      return parts[0] || '';
    }

    const primeraLetra   = s => s.charAt(0) || 'X';
    const vocalInterna   = s => { for (let i=1;i<s.length;i++) if (VOCALES.includes(s[i])) return s[i]; return 'X'; };
    const consonInterna  = s => { for (let i=1;i<s.length;i++){ const c=s[i]; if (!VOCALES.includes(c) && /[A-Z]/.test(c)) return c; } return 'X'; };

    // Dígito verificador (posición 18).
    function digitoVerificador(c17) {
      const dicc = '0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
      let suma = 0;
      for (let i=0;i<17;i++) { const v = dicc.indexOf(c17[i]); suma += (v<0?0:v) * (18 - i); }
      const d = 10 - (suma % 10);
      return d === 10 ? '0' : String(d);
    }

    // Calcula la CURP completa y devuelve el desglose por segmentos.
    function calcularCurp({ ap1, ap2, nombre, fecha, sexo, estado }) {
      if (!ap1 || !nombre || !fecha || !sexo || !estado) return null;

      const p1  = sinParticulas(limpiar(ap1));
      const p2  = sinParticulas(limpiar(ap2));
      const nom = eligeNombre(limpiar(nombre));
      if (!p1 || !nom) return null;

      // Posiciones 1-4
      let iniciales = primeraLetra(p1) + vocalInterna(p1) + (p2 ? primeraLetra(p2) : 'X') + primeraLetra(nom);
      let altisonante = false;
      if (INCONVENIENTES.has(iniciales)) { iniciales = iniciales[0] + 'X' + iniciales.slice(2); altisonante = true; }

      // Posiciones 5-10 (fecha AAMMDD)
      const [yyyy, mm, dd] = fecha.split('-');
      const bloqueFecha = yyyy.slice(2) + mm + dd;

      // Posiciones 14-16 (consonantes internas)
      const consonantes = consonInterna(p1) + (p2 ? consonInterna(p2) : 'X') + consonInterna(nom);

      // Posición 17 (homoclave): dígito para <2000, letra para >=2000. La asigna RENAPO.
      const homoclave = Number(yyyy) < 2000 ? '0' : 'A';

      const c17 = iniciales + bloqueFecha + sexo + estado + consonantes + homoclave;
      const dv  = digitoVerificador(c17);

      return {
        curp: c17 + dv, altisonante,
        segmentos: [
          { label: 'Iniciales del nombre',        val: iniciales,   color: 'text-[#007AFF]' },
          { label: 'Fecha de nacimiento (AAMMDD)', val: bloqueFecha, color: 'text-[#34C759]' },
          { label: 'Sexo',                         val: sexo,        color: 'text-[#FF9500]' },
          { label: 'Entidad de nacimiento',        val: estado,      color: 'text-[#AF52DE]' },
          { label: 'Consonantes internas',         val: consonantes, color: 'text-[#FF2D55]' },
          { label: 'Homoclave',                    val: homoclave,   color: 'text-[#8E8E93]' },
          { label: 'Dígito verificador',           val: dv,          color: 'text-[#8E8E93]' },
        ],
      };
    }

    /* ===== Detección de datos pegados (formato "etiqueta : valor" de RENAPO/lead) ===== */
    const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    const DICT = {
      apellidos:'apellidos', apellido:'apellidos', apellido_paterno:'ap1', primer_apellido:'ap1', paterno:'ap1',
      apellido_materno:'ap2', segundo_apellido:'ap2', materno:'ap2',
      nombre:'nombre', nombres:'nombre', nombre_s:'nombre', primer_nombre:'nombre',
      ano_nacimiento:'anio', anio_nacimiento:'anio', ano:'anio', mes_nacimiento:'mes', dia_nacimiento:'dia',
      fecha_nacimiento:'fecha', fecha_de_nacimiento:'fecha', nacimiento:'fecha',
      estado:'estado', entidad:'estado', entidad_nacimiento:'estado', estado_nacimiento:'estado', entidad_de_nacimiento:'estado',
      sexo:'sexo', genero:'sexo',
    };
    const PART_AP = new Set(['DE','DEL','LA','LAS','LOS','Y','MC','MAC','VON','VAN','DI','DA']);
    const splitApellidos = (s) => {
      const toks = (s || '').trim().split(/\s+/).filter(Boolean);
      if (toks.length <= 1) return [toks[0] || '', ''];
      let i = 0; const a1 = [];
      while (i < toks.length - 1 && PART_AP.has(toks[i].toUpperCase())) { a1.push(toks[i]); i++; }
      a1.push(toks[i]); i++;
      return [a1.join(' '), toks.slice(i).join(' ')];
    };
    const matchEstado = (input) => {
      const n = norm(input);
      const alias = { cdmx:'DF', ciudad_de_mexico:'DF', distrito_federal:'DF', df:'DF', estado_de_mexico:'MC', edomex:'MC', mexico:'MC', coahuila_de_zaragoza:'CL', michoacan_de_ocampo:'MN', veracruz_de_ignacio_de_la_llave:'VZ', baja_california_norte:'BC', extranjero:'NE', nacido_en_el_extranjero:'NE' };
      if (alias[n]) return alias[n];
      const byCode = ESTADOS.find(e => e.c.toLowerCase() === n);
      if (byCode) return byCode.c;
      let f = ESTADOS.find(e => norm(e.n) === n);
      if (f) return f.c;
      f = ESTADOS.find(e => { const en = norm(e.n); return en.startsWith(n) || n.startsWith(en); });
      return f ? f.c : '';
    };
    const matchSexo = (input) => {
      const n = norm(input);
      if (['h','hombre','masculino','masc','varon'].includes(n) || n.startsWith('masc') || n.startsWith('hombre') || n.startsWith('varon')) return 'H';
      if (['m','f','mujer','femenino','fem'].includes(n) || n.startsWith('muj') || n.startsWith('fem')) return 'M';
      return '';
    };
    const NOM_FEM = new Set(['fatima','maria','ana','sofia','beatriz','isabel','raquel','ines','carmen','luz','flor','noemi','ruth','esther','judith','lourdes','rocio','soledad','dolores','mercedes','pilar','itzel','xochitl','citlali','ximena','miriam','abril','alejandra','fernanda','valeria','regina','renata','camila','ivonne','araceli']);
    const NOM_MASC = new Set(['jose','jesus','miguel','manuel','angel','daniel','gabriel','rafael','andres','luis','david','ivan','noe','uriel','emmanuel','israel','ismael','abel','joel','raul','saul','ruben','cesar','oscar','hector','nestor','victor','javier','jorge','felipe','enrique','vicente','matias','tobias','elias','isaias','josue','moises','nicolas','tadeo']);
    const NOM_AMBIG = new Set(['guadalupe','trinidad','cruz','refugio','reyes','concepcion','remedios']);
    const inferSexo = (nombre) => {
      const n = norm(nombre).split('_')[0];
      if (NOM_AMBIG.has(n)) return '';
      if (NOM_FEM.has(n)) return 'M';
      if (NOM_MASC.has(n)) return 'H';
      if (n.endsWith('a')) return 'M';
      if (n.endsWith('o')) return 'H';
      return '';
    };
    const pad2 = (v) => String(v).replace(/\D/g, '').padStart(2, '0').slice(-2);
    function parseDatosCurp(texto) {
      if (!texto) return { found: {}, count: 0 };
      const lines = texto.split(/\r?\n/);
      const pares = {};
      for (let i = 0; i < lines.length; i++) {
        const idx = lines[i].indexOf(':');
        if (idx === -1) continue;
        const key = norm(lines[i].slice(0, idx));
        if (!DICT[key]) continue;
        let val = lines[i].slice(idx + 1).trim();
        if (!val) {
          for (let j = i + 1; j < lines.length; j++) {
            if (lines[j].trim() === '') continue;
            const nidx = lines[j].indexOf(':');
            const nkey = nidx !== -1 ? norm(lines[j].slice(0, nidx)) : null;
            if (nkey && DICT[nkey]) break;
            val = lines[j].trim(); break;
          }
        }
        if (val) pares[DICT[key]] = val;
      }
      const out = {};
      if (pares.ap1) out.ap1 = pares.ap1;
      if (pares.ap2) out.ap2 = pares.ap2;
      if (pares.apellidos && !out.ap1) { const [a, b] = splitApellidos(pares.apellidos); if (a) out.ap1 = a; if (b) out.ap2 = b; }
      if (pares.nombre) out.nombre = pares.nombre;
      if (pares.fecha) { const m = pares.fecha.match(/(\d{1,4})\D+(\d{1,2})\D+(\d{1,4})/); if (m) { out.fecha = m[1].length === 4 ? m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]) : m[3].padStart(4, '20') + '-' + pad2(m[2]) + '-' + pad2(m[1]); } }
      else if (pares.anio && pares.mes && pares.dia) { out.fecha = pares.anio.replace(/\D/g, '') + '-' + pad2(pares.mes) + '-' + pad2(pares.dia); }
      if (pares.estado) { const c = matchEstado(pares.estado); if (c) out.estado = c; }
      if (pares.sexo) { const s = matchSexo(pares.sexo); if (s) out.sexo = s; }
      else if (out.nombre) { const s = inferSexo(out.nombre); if (s) out.sexo = s; }
      return { found: out, count: Object.keys(out).length };
    }

    /* ===== Cálculo de RFC (13 caracteres) — base + homoclave + dígito verificador (SAT) ===== */
    const RFC_HOMO = { ' ':'00','0':'00','1':'01','2':'02','3':'03','4':'04','5':'05','6':'06','7':'07','8':'08','9':'09','&':'10','A':'11','B':'12','C':'13','D':'14','E':'15','F':'16','G':'17','H':'18','I':'19','J':'21','K':'22','L':'23','M':'24','N':'25','O':'26','P':'27','Q':'28','R':'29','S':'32','T':'33','U':'34','V':'35','W':'36','X':'37','Y':'38','Z':'39','Ñ':'40' };
    const RFC_ALFA = '123456789ABCDEFGHIJKLMNPQRSTUVWXYZ';
    const RFC_DIC = '0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ';
    const rfcNombreLimpio = (s) => (s || '').toUpperCase().replace(/Á/g,'A').replace(/É/g,'E').replace(/Í/g,'I').replace(/Ó/g,'O').replace(/Ú/g,'U').replace(/Ü/g,'U').replace(/[^A-ZÑ& ]/g,' ').replace(/\s+/g,' ').trim();
    const rfcHomoclave = (ap1, ap2, nombre) => {
      const full = '0' + [rfcNombreLimpio(ap1), rfcNombreLimpio(ap2), rfcNombreLimpio(nombre)].filter(Boolean).join(' ');
      let num = ''; for (const ch of full) num += (RFC_HOMO[ch] !== undefined ? RFC_HOMO[ch] : '00');
      let suma = 0; for (let i = 0; i < num.length - 1; i++) suma += parseInt(num.substr(i, 2), 10) * parseInt(num.charAt(i + 1), 10);
      const y = suma % 1000; return RFC_ALFA[Math.floor(y / 34)] + RFC_ALFA[y % 34];
    };
    const rfcDigito = (r12) => {
      const val = (c) => { if (c === ' ') return 37; if (c === 'Ñ') return 38; const i = RFC_DIC.indexOf(c); return i < 0 ? 0 : i; };
      let s = 0; for (let i = 0; i < 12; i++) s += val(r12[i]) * (13 - i);
      const r = s % 11; if (r === 0) return '0'; const d = 11 - r; return d === 10 ? 'A' : String(d);
    };
    function calcularRfc({ ap1, ap2, nombre, fecha }) {
      if (!ap1 || !nombre || !fecha) return null;
      const p1 = sinParticulas(limpiar(ap1));
      const p2 = sinParticulas(limpiar(ap2));
      const nom = eligeNombre(limpiar(nombre));
      if (!p1 || !nom) return null;
      let letras;
      if (p1.length <= 2 && p2) letras = (p1[0] || 'X') + (p2[0] || 'X') + (nom[0] || 'X') + (nom[1] || 'X');
      else if (!p2) letras = (p1[0] || 'X') + vocalInterna(p1) + (nom[0] || 'X') + (nom[1] || 'X');
      else letras = (p1[0] || 'X') + vocalInterna(p1) + (p2[0] || 'X') + (nom[0] || 'X');
      if (INCONVENIENTES.has(letras)) letras = letras[0] + 'X' + letras.slice(2);
      const [yyyy, mm, dd] = fecha.split('-');
      const base = letras + yyyy.slice(2) + mm + dd;
      const homo = rfcHomoclave(ap1, ap2, nombre);
      return base + homo + rfcDigito(base + homo);
    }

    /* ============================================================
       Interfaz
       ============================================================ */
    function Campo({ label, children }) {
      return (
        <label className="block">
          <span className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide">{label}</span>
          <div className="mt-1">{children}</div>
        </label>
      );
    }

    function App() {
      const [form, setForm] = useState({ ap1:'', ap2:'', nombre:'', fecha:'', sexo:'', estado:'' });
      const [copiado, setCopiado] = useState(false);
      const [copiadoRfc, setCopiadoRfc] = useState(false);
      const [detectados, setDetectados] = useState(0);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
      const pegar = (e) => {
        const { found, count } = parseDatosCurp(e.target.value);
        if (count) { setForm(f => ({ ...f, ...found })); setDetectados(count); }
      };

      const resultado = useMemo(() => calcularCurp(form), [form]);
      const rfc = useMemo(() => calcularRfc(form), [form]);

      const copiarTexto = (texto, setter) => {
        if (!texto) return;
        navigator.clipboard.writeText(texto).then(() => {
          setter(true);
          setTimeout(() => setter(false), 1800);
        });
      };
      const copiar = () => copiarTexto(resultado && resultado.curp, setCopiado);
      const copiarRfc = () => copiarTexto(rfc, setCopiadoRfc);

      const inputCls = "w-full ios-input px-4 py-2.5 rounded-xl text-[15px] text-[#1C1C1E]";

      return (
        <div className="min-h-screen">
          {/* Encabezado */}
          <div className="max-w-2xl mx-auto px-4 pt-6 pb-3 flex items-center justify-between gap-3">
            <a href="index.html" className="inline-flex items-center gap-2 text-sm font-semibold text-white bg-[#00B100] hover:bg-[#009a00] active:scale-[0.97] px-4 py-2.5 rounded-full transition-all">
              <i className="fas fa-chevron-left text-xs"></i> Volver al Panel
            </a>
            <div className="text-right">
              <h1 className="text-lg font-bold text-[#1C1C1E] leading-tight">Calculadora de CURP y RFC</h1>
              <p className="text-[11px] text-[#8E8E93]">Clave Única de Registro de Población · Registro Federal de Contribuyentes</p>
            </div>
          </div>

          {/* Formulario */}
          <div className="max-w-2xl mx-auto px-4 pb-24">
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5EA] space-y-4">
              <div className="bg-[#AF52DE]/[0.08] rounded-2xl p-3.5">
                <label className="text-[12px] font-semibold text-[#AF52DE] flex items-center gap-1.5 mb-2">
                  <i className="fas fa-wand-magic-sparkles"></i> Pegar datos (RENAPO / lead) — llenado automático
                </label>
                <textarea onChange={pegar} rows={3}
                  placeholder="Pega aquí el bloque de datos con formato «etiqueta : valor» (apellidos, nombre, año/mes/día de nacimiento, estado…) y los campos se llenan solos."
                  className="w-full bg-white border border-[#AF52DE]/25 rounded-xl p-3 text-xs focus:outline-none focus:border-[#AF52DE] resize-none" />
                {detectados > 0 && (
                  <p className="text-[11px] text-[#AF52DE] mt-1.5"><i className="fas fa-check-circle mr-1"></i>{detectados} datos detectados y rellenados. Revisa el <b>sexo</b> si no venía en el texto.</p>
                )}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Campo label="Primer apellido *">
                  <input className={inputCls} value={form.ap1} onChange={e=>set('ap1', e.target.value)} placeholder="Hernández" />
                </Campo>
                <Campo label="Segundo apellido">
                  <input className={inputCls} value={form.ap2} onChange={e=>set('ap2', e.target.value)} placeholder="García" />
                </Campo>
              </div>

              <Campo label="Nombre(s) *">
                <input className={inputCls} value={form.nombre} onChange={e=>set('nombre', e.target.value)} placeholder="Gloria" />
              </Campo>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Campo label="Fecha de nacimiento *">
                  <input type="date" className={inputCls} value={form.fecha} onChange={e=>set('fecha', e.target.value)} max="2099-12-31" />
                </Campo>
                <Campo label="Sexo *">
                  <div className="flex gap-2">
                    {[{v:'H',l:'Hombre',i:'fa-mars'},{v:'M',l:'Mujer',i:'fa-venus'}].map(o => (
                      <button key={o.v} type="button" onClick={()=>set('sexo', o.v)}
                        className={"seg-btn flex-1 py-2.5 rounded-xl text-sm font-semibold border " +
                          (form.sexo===o.v ? "bg-[#007AFF] text-white border-[#007AFF]" : "bg-[#F2F2F7] text-[#3C3C43] border-transparent hover:bg-[#E9E9EE]")}>
                        <i className={"fas " + o.i + " mr-1.5 text-xs"}></i>{o.l}
                      </button>
                    ))}
                  </div>
                </Campo>
              </div>

              <Campo label="Entidad de nacimiento *">
                <select className={inputCls + " appearance-none"} value={form.estado} onChange={e=>set('estado', e.target.value)}>
                  <option value="">Selecciona el estado…</option>
                  {ESTADOS.map(e => <option key={e.c} value={e.c}>{e.n}</option>)}
                </select>
              </Campo>
            </div>

            {/* Resultado */}
            {(resultado || rfc) ? (
              <div className="mt-5 pop-in space-y-3">
                {resultado && (
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5EA]">
                    <div className="flex items-center justify-between mb-3">
                      <span className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide">CURP estimada</span>
                      <button onClick={copiar}
                        className={"text-xs font-semibold px-3 py-1.5 rounded-full transition-all active:scale-95 " +
                          (copiado ? "bg-[#34C759] text-white" : "bg-[#007AFF]/10 text-[#007AFF] hover:bg-[#007AFF]/20")}>
                        <i className={"fas " + (copiado ? "fa-check" : "fa-copy") + " mr-1.5"}></i>{copiado ? "Copiada" : "Copiar"}
                      </button>
                    </div>
                    <div className="text-center py-2">
                      <span className="font-mono font-bold text-[#1C1C1E] tracking-[0.12em] text-[clamp(1.15rem,5vw,1.9rem)] select-all break-all">
                        {resultado.curp}
                      </span>
                    </div>

                    {resultado.altisonante && (
                      <p className="mt-2 text-[11px] text-[#FF9500] text-center">
                        <i className="fas fa-info-circle mr-1"></i>
                        Se sustituyó la 2ª letra por “X” (palabra no permitida).
                      </p>
                    )}

                    {/* Desglose */}
                    <div className="mt-4 pt-4 border-t border-[#E5E5EA] grid grid-cols-2 gap-x-4 gap-y-2.5">
                      {resultado.segmentos.map((s, i) => (
                        <div key={i} className="flex items-center justify-between gap-2">
                          <span className="text-[11px] text-[#8E8E93] leading-tight">{s.label}</span>
                          <span className={"font-mono font-bold text-sm " + s.color}>{s.val}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {rfc && (
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5EA]">
                    <div className="flex items-center justify-between mb-3">
                      <span className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide">RFC estimado</span>
                      <button onClick={copiarRfc}
                        className={"text-xs font-semibold px-3 py-1.5 rounded-full transition-all active:scale-95 " +
                          (copiadoRfc ? "bg-[#34C759] text-white" : "bg-[#AF52DE]/10 text-[#AF52DE] hover:bg-[#AF52DE]/20")}>
                        <i className={"fas " + (copiadoRfc ? "fa-check" : "fa-copy") + " mr-1.5"}></i>{copiadoRfc ? "Copiado" : "Copiar"}
                      </button>
                    </div>
                    <div className="text-center py-2">
                      <span className="font-mono font-bold text-[#1C1C1E] tracking-[0.12em] text-[clamp(1.15rem,5vw,1.9rem)] select-all break-all">
                        {rfc}
                      </span>
                    </div>
                    {!resultado && (
                      <p className="mt-2 text-[11px] text-[#8E8E93] text-center">Agrega <b>sexo</b> y <b>entidad</b> para calcular también la CURP.</p>
                    )}
                  </div>
                )}

                <div className="bg-[#FFF9E6] border border-[#FFE9A8] rounded-xl p-3.5 flex gap-2.5">
                  <i className="fas fa-triangle-exclamation text-[#FF9500] mt-0.5"></i>
                  <p className="text-[12px] text-[#8A6D00] leading-snug">
                    <b>Valores estimados.</b> Las homoclaves las asignan RENAPO (CURP) y el SAT (RFC) para diferenciar homónimos.
                    Se calculan con el algoritmo oficial, pero verifica siempre en <span className="font-mono">gob.mx/curp</span> y <span className="font-mono">sat.gob.mx</span>.
                  </p>
                </div>
              </div>
            ) : (
              <div className="mt-5 text-center text-[#8E8E93] text-sm py-10">
                <i className="fas fa-id-card text-3xl mb-3 text-[#C7C7CC]"></i>
                <p>Completa los campos marcados con <b>*</b> para generar la CURP y el RFC.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
