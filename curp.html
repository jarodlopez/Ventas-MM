<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de CURP</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMEIxMDAiLz48ZyBmaWxsPSIjZmZmZmZmIj48cGF0aCBkPSJNMzIgMTAgTDU1IDIzIEg5IFoiLz48cmVjdCB4PSI5IiB5PSIyNSIgd2lkdGg9IjQ2IiBoZWlnaHQ9IjQiLz48cmVjdCB4PSIxNCIgeT0iMzEiIHdpZHRoPSI1IiBoZWlnaHQ9IjE3Ii8+PHJlY3QgeD0iMjQuNSIgeT0iMzEiIHdpZHRoPSI1IiBoZWlnaHQ9IjE3Ii8+PHJlY3QgeD0iMzQuNSIgeT0iMzEiIHdpZHRoPSI1IiBoZWlnaHQ9IjE3Ii8+PHJlY3QgeD0iNDUiIHk9IjMxIiB3aWR0aD0iNSIgaGVpZ2h0PSIxNyIvPjxyZWN0IHg9IjkiIHk9IjUwIiB3aWR0aD0iNDYiIGhlaWdodD0iNSIgcng9IjEuNSIvPjwvZz48L3N2Zz4K" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --ios-bg: #F2F2F7;
      --ios-sep: #E5E5EA;
      --ios-blue: #007AFF;
      --mm-green: #00B100;
    }
    html, body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; background: var(--ios-bg); }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,128,0.26); border-radius: 10px; }
    .ios-input { background:#F2F2F7; border:1px solid transparent; transition: background .15s, border-color .15s; }
    .ios-input:focus { outline:none; background:#fff; border-color: var(--ios-blue); }
    .seg-btn { transition: all .15s ease; }
    @keyframes popIn { 0% { transform: scale(0.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop-in { animation: popIn .28s cubic-bezier(.34,1.4,.64,1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    /* ============================================================
       Lógica de cálculo de la CURP (18 caracteres)
       Basada en el "Instructivo Normativo para la Asignación de la
       Clave Única de Registro de Población" (SEGOB / RENAPO).
       ============================================================ */
    const VOCALES = 'AEIOU';

    // Preposiciones, conjunciones y artículos que se ignoran en apellidos/nombres.
    const PARTICULAS = new Set(['DA','DAS','DE','DEL','DER','DI','DIE','DD','EL','LA','LOS','LAS','LE','LES','MAC','MC','VAN','VON','Y']);

    // Nombres "comunes" que se omiten cuando existe un segundo nombre de pila.
    const COMUNES = new Set(['MARIA','MA','JOSE','J']);

    // Palabras altisonantes: si las 4 primeras letras forman una, la 2ª se cambia por 'X'.
    const INCONVENIENTES = new Set(['BACA','BAKA','BUEI','BUEY','CACA','CACO','CAGA','CAGO','CAKA','CAKO','COGE','COGI','COJA','COJE','COJI','COJO','COLA','CULO','FALO','FETO','GETA','GUEI','GUEY','JETA','JOTO','KACA','KACO','KAGA','KAGO','KAKA','KAKO','KOGE','KOGI','KOJA','KOJE','KOJI','KOJO','KOLA','KULO','LILO','LOCA','LOCO','LOKA','LOKO','MAME','MAMO','MEAR','MEAS','MEON','MIAR','MION','MOCO','MOKO','MULA','MULO','NACA','NACO','PEDA','PEDO','PENE','PIPI','PITO','POPO','PUTA','PUTO','QULO','RATA','ROBA','ROBE','ROBO','RUIN','SENO','TETA','VACA','VAGA','VAGO','VAKA','VUEI','VUEY','WUEI','WUEY']);

    // Entidades de nacimiento y su clave de 2 letras.
    const ESTADOS = [
      { c:'AS', n:'Aguascalientes' }, { c:'BC', n:'Baja California' },
      { c:'BS', n:'Baja California Sur' }, { c:'CC', n:'Campeche' },
      { c:'CS', n:'Chiapas' }, { c:'CH', n:'Chihuahua' },
      { c:'CL', n:'Coahuila' }, { c:'CM', n:'Colima' },
      { c:'DF', n:'Ciudad de México' }, { c:'DG', n:'Durango' },
      { c:'GT', n:'Guanajuato' }, { c:'GR', n:'Guerrero' },
      { c:'HG', n:'Hidalgo' }, { c:'JC', n:'Jalisco' },
      { c:'MC', n:'México (Estado de)' }, { c:'MN', n:'Michoacán' },
      { c:'MS', n:'Morelos' }, { c:'NT', n:'Nayarit' },
      { c:'NL', n:'Nuevo León' }, { c:'OC', n:'Oaxaca' },
      { c:'PL', n:'Puebla' }, { c:'QT', n:'Querétaro' },
      { c:'QR', n:'Quintana Roo' }, { c:'SP', n:'San Luis Potosí' },
      { c:'SL', n:'Sinaloa' }, { c:'SR', n:'Sonora' },
      { c:'TC', n:'Tabasco' }, { c:'TS', n:'Tamaulipas' },
      { c:'TL', n:'Tlaxcala' }, { c:'VZ', n:'Veracruz' },
      { c:'YN', n:'Yucatán' }, { c:'ZS', n:'Zacatecas' },
      { c:'NE', n:'Nacido en el Extranjero' },
    ];

    // Normaliza: mayúsculas, Ñ→X, quita acentos y caracteres no alfabéticos.
    function limpiar(s) {
      if (!s) return '';
      s = s.toUpperCase().replace(/Ñ/g, 'X');
      s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
      s = s.replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
      return s;
    }

    // Quita partículas de un apellido y une lo restante en un solo bloque.
    function sinParticulas(s) {
      const parts = s.split(' ').filter(Boolean);
      const f = parts.filter(p => !PARTICULAS.has(p));
      return (f.length ? f : parts).join('');
    }

    // Elige el nombre de pila útil (omite MARIA/JOSE/etc. si hay un segundo nombre).
    function eligeNombre(s) {
      const parts = s.split(' ').filter(Boolean).filter(p => !PARTICULAS.has(p));
      if (parts.length >= 2 && COMUNES.has(parts[0])) return parts[1];
      return parts[0] || '';
    }

    const primeraLetra   = s => s.charAt(0) || 'X';
    const vocalInterna   = s => { for (let i=1;i<s.length;i++) if (VOCALES.includes(s[i])) return s[i]; return 'X'; };
    const consonInterna  = s => { for (let i=1;i<s.length;i++){ const c=s[i]; if (!VOCALES.includes(c) && /[A-Z]/.test(c)) return c; } return 'X'; };

    // Dígito verificador (posición 18).
    function digitoVerificador(c17) {
      const dicc = '0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
      let suma = 0;
      for (let i=0;i<17;i++) { const v = dicc.indexOf(c17[i]); suma += (v<0?0:v) * (18 - i); }
      const d = 10 - (suma % 10);
      return d === 10 ? '0' : String(d);
    }

    // Calcula la CURP completa y devuelve el desglose por segmentos.
    function calcularCurp({ ap1, ap2, nombre, fecha, sexo, estado }) {
      if (!ap1 || !nombre || !fecha || !sexo || !estado) return null;

      const p1  = sinParticulas(limpiar(ap1));
      const p2  = sinParticulas(limpiar(ap2));
      const nom = eligeNombre(limpiar(nombre));
      if (!p1 || !nom) return null;

      // Posiciones 1-4
      let iniciales = primeraLetra(p1) + vocalInterna(p1) + (p2 ? primeraLetra(p2) : 'X') + primeraLetra(nom);
      let altisonante = false;
      if (INCONVENIENTES.has(iniciales)) { iniciales = iniciales[0] + 'X' + iniciales.slice(2); altisonante = true; }

      // Posiciones 5-10 (fecha AAMMDD)
      const [yyyy, mm, dd] = fecha.split('-');
      const bloqueFecha = yyyy.slice(2) + mm + dd;

      // Posiciones 14-16 (consonantes internas)
      const consonantes = consonInterna(p1) + (p2 ? consonInterna(p2) : 'X') + consonInterna(nom);

      // Posición 17 (homoclave): dígito para <2000, letra para >=2000. La asigna RENAPO.
      const homoclave = Number(yyyy) < 2000 ? '0' : 'A';

      const c17 = iniciales + bloqueFecha + sexo + estado + consonantes + homoclave;
      const dv  = digitoVerificador(c17);

      return {
        curp: c17 + dv, altisonante,
        segmentos: [
          { label: 'Iniciales del nombre',        val: iniciales,   color: 'text-[#007AFF]' },
          { label: 'Fecha de nacimiento (AAMMDD)', val: bloqueFecha, color: 'text-[#34C759]' },
          { label: 'Sexo',                         val: sexo,        color: 'text-[#FF9500]' },
          { label: 'Entidad de nacimiento',        val: estado,      color: 'text-[#AF52DE]' },
          { label: 'Consonantes internas',         val: consonantes, color: 'text-[#FF2D55]' },
          { label: 'Homoclave',                    val: homoclave,   color: 'text-[#8E8E93]' },
          { label: 'Dígito verificador',           val: dv,          color: 'text-[#8E8E93]' },
        ],
      };
    }

    /* ============================================================
       Interfaz
       ============================================================ */
    function Campo({ label, children }) {
      return (
        <label className="block">
          <span className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide">{label}</span>
          <div className="mt-1">{children}</div>
        </label>
      );
    }

    function App() {
      const [form, setForm] = useState({ ap1:'', ap2:'', nombre:'', fecha:'', sexo:'', estado:'' });
      const [copiado, setCopiado] = useState(false);
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const resultado = useMemo(() => calcularCurp(form), [form]);

      const copiar = () => {
        if (!resultado) return;
        navigator.clipboard.writeText(resultado.curp).then(() => {
          setCopiado(true);
          setTimeout(() => setCopiado(false), 1800);
        });
      };

      const inputCls = "w-full ios-input px-4 py-2.5 rounded-xl text-[15px] text-[#1C1C1E]";

      return (
        <div className="min-h-screen">
          {/* Encabezado */}
          <div className="max-w-2xl mx-auto px-4 pt-6 pb-3 flex items-center justify-between gap-3">
            <a href="index.html" className="inline-flex items-center gap-2 text-sm font-semibold text-white bg-[#00B100] hover:bg-[#009a00] active:scale-[0.97] px-4 py-2.5 rounded-full transition-all">
              <i className="fas fa-chevron-left text-xs"></i> Volver al Panel
            </a>
            <div className="text-right">
              <h1 className="text-lg font-bold text-[#1C1C1E] leading-tight">Calculadora de CURP</h1>
              <p className="text-[11px] text-[#8E8E93]">Clave Única de Registro de Población</p>
            </div>
          </div>

          {/* Formulario */}
          <div className="max-w-2xl mx-auto px-4 pb-24">
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5EA] space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Campo label="Primer apellido *">
                  <input className={inputCls} value={form.ap1} onChange={e=>set('ap1', e.target.value)} placeholder="Hernández" />
                </Campo>
                <Campo label="Segundo apellido">
                  <input className={inputCls} value={form.ap2} onChange={e=>set('ap2', e.target.value)} placeholder="García" />
                </Campo>
              </div>

              <Campo label="Nombre(s) *">
                <input className={inputCls} value={form.nombre} onChange={e=>set('nombre', e.target.value)} placeholder="Gloria" />
              </Campo>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <Campo label="Fecha de nacimiento *">
                  <input type="date" className={inputCls} value={form.fecha} onChange={e=>set('fecha', e.target.value)} max="2099-12-31" />
                </Campo>
                <Campo label="Sexo *">
                  <div className="flex gap-2">
                    {[{v:'H',l:'Hombre',i:'fa-mars'},{v:'M',l:'Mujer',i:'fa-venus'}].map(o => (
                      <button key={o.v} type="button" onClick={()=>set('sexo', o.v)}
                        className={"seg-btn flex-1 py-2.5 rounded-xl text-sm font-semibold border " +
                          (form.sexo===o.v ? "bg-[#007AFF] text-white border-[#007AFF]" : "bg-[#F2F2F7] text-[#3C3C43] border-transparent hover:bg-[#E9E9EE]")}>
                        <i className={"fas " + o.i + " mr-1.5 text-xs"}></i>{o.l}
                      </button>
                    ))}
                  </div>
                </Campo>
              </div>

              <Campo label="Entidad de nacimiento *">
                <select className={inputCls + " appearance-none"} value={form.estado} onChange={e=>set('estado', e.target.value)}>
                  <option value="">Selecciona el estado…</option>
                  {ESTADOS.map(e => <option key={e.c} value={e.c}>{e.n}</option>)}
                </select>
              </Campo>
            </div>

            {/* Resultado */}
            {resultado ? (
              <div className="mt-5 pop-in">
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-[#E5E5EA]">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-[11px] font-semibold text-[#8E8E93] uppercase tracking-wide">CURP estimada</span>
                    <button onClick={copiar}
                      className={"text-xs font-semibold px-3 py-1.5 rounded-full transition-all active:scale-95 " +
                        (copiado ? "bg-[#34C759] text-white" : "bg-[#007AFF]/10 text-[#007AFF] hover:bg-[#007AFF]/20")}>
                      <i className={"fas " + (copiado ? "fa-check" : "fa-copy") + " mr-1.5"}></i>{copiado ? "Copiada" : "Copiar"}
                    </button>
                  </div>
                  <div className="text-center py-2">
                    <span className="font-mono font-bold text-[#1C1C1E] tracking-[0.12em] text-[clamp(1.15rem,5vw,1.9rem)] select-all break-all">
                      {resultado.curp}
                    </span>
                  </div>

                  {resultado.altisonante && (
                    <p className="mt-2 text-[11px] text-[#FF9500] text-center">
                      <i className="fas fa-info-circle mr-1"></i>
                      Se sustituyó la 2ª letra por “X” (palabra no permitida).
                    </p>
                  )}

                  {/* Desglose */}
                  <div className="mt-4 pt-4 border-t border-[#E5E5EA] grid grid-cols-2 gap-x-4 gap-y-2.5">
                    {resultado.segmentos.map((s, i) => (
                      <div key={i} className="flex items-center justify-between gap-2">
                        <span className="text-[11px] text-[#8E8E93] leading-tight">{s.label}</span>
                        <span className={"font-mono font-bold text-sm " + s.color}>{s.val}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mt-3 bg-[#FFF9E6] border border-[#FFE9A8] rounded-xl p-3.5 flex gap-2.5">
                  <i className="fas fa-triangle-exclamation text-[#FF9500] mt-0.5"></i>
                  <p className="text-[12px] text-[#8A6D00] leading-snug">
                    <b>Valor estimado.</b> La <b>homoclave</b> (posición 17) es asignada por RENAPO para diferenciar homónimos;
                    aquí se usa el valor por defecto ({Number(form.fecha?.slice(0,4)) < 2000 ? '“0”' : '“A”'}).
                    Verifica siempre la CURP oficial en <span className="font-mono">gob.mx/curp</span>.
                  </p>
                </div>
              </div>
            ) : (
              <div className="mt-5 text-center text-[#8E8E93] text-sm py-10">
                <i className="fas fa-id-card text-3xl mb-3 text-[#C7C7CC]"></i>
                <p>Completa los campos marcados con <b>*</b> para generar la CURP.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
